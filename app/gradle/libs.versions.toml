# TroubaStage — Gradle version catalog (single source of truth for tool + lib versions).
#
# Pinned to CURRENT STABLE releases (A01). The one deliberate deviation from the toolchain doc
# (JDK 25+, docs/design/06-tech-stack.md): the compile toolchain is pinned to JDK 21, not 25.
# Why: Kotlin 2.2.20 caps its JVM bytecode target at 24, so a JDK 25 *toolchain* makes the Kotlin
# target (24) inconsistent with AGP's Java target (25) and AGP's target-consistency check fails
# (verified). JDK 21 is the newest LTS both agree on. The Gradle DAEMON still runs on the installed
# JDK 25 (Gradle 9.5.1 supports it); only compilation targets 21. Revisit when Kotlin ships JVM 25.
# See `jdk` below and the `jvmToolchain(...)` call + comment in shared/build.gradle.kts.

[versions]
# Compile/target toolchain — newest LTS Kotlin+AGP agree on (see header note; NOT the installed 25).
jdk = "21"

# Android SDK levels. compileSdk 36 = Android 16 (build-tools 36 present on the toolchain).
android-compileSdk = "36"
android-minSdk = "26"          # Android 8.0; androidx.ink / EncryptedSharedPreferences baseline
android-targetSdk = "36"

# Build tooling.
agp = "8.13.2"                 # latest stable Android Gradle Plugin (8.x)
kotlin = "2.2.20"              # Kotlin Multiplatform; the compose-compiler plugin is versioned WITH it
compose-multiplatform = "1.9.0"  # Compose Multiplatform (shared UI); compatible with Kotlin 2.2.x

# Shared-library dependencies (referenced by the commonMain stubs' notes; I6/I1).
coroutines = "1.10.2"          # kotlinx-coroutines — sync client + downloader are coroutine-based (I6)
kotlinx-serialization = "1.9.0"  # JSON on the Studio bridge / manifest diff (I1 wire shapes)

# androidApp entrypoint deps.
androidx-activity-compose = "1.10.1"
androidx-core-ktx = "1.15.0"   # WindowInsetsControllerCompat (immersive); newest core needing only compileSdk 35 / AGP 8.x

# Seam-3 (Storage) hardening + distribution (B03).
androidx-security-crypto = "1.1.0-alpha06"  # EncryptedSharedPreferences for the auth session cookie (I13)
ktor = "3.0.3"                 # ktor-client (okhttp engine) — the app's manifest/download transport (B03, I13)

# A53: QR invite scanner. CameraX for preview + frame analysis; ZXing core for decode. ZXing is
# Apache-2.0 (the project's own licence), fully offline, small — chosen over ML Kit, whose unbundled
# scanner needs Play Services and whose bundled model is several MB for one barcode format (the APK is
# sideloaded onto a music-stand tablet). Both live on google + mavenCentral (the locked repos).
androidx-camera = "1.4.1"      # CameraX (core/camera2/lifecycle/view); minSdk 26 clears it
zxing-core = "3.5.3"           # com.google.zxing:core — pure-JVM QR decoder in an ImageAnalysis.Analyzer

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidx-security-crypto" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "androidx-camera" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "androidx-camera" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "androidx-camera" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "androidx-camera" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing-core" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# The Compose compiler ships with Kotlin (>=2.0), so it is versioned to `kotlin`, not to Compose.
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
