# xcodegen spec for the thin iOS shell (I15). We commit this YAML, not a .xcodeproj — it diffs
# cleanly and the .xcodeproj is generated in CI (`xcodegen generate`). The app holds no logic beyond
# mounting the shared Compose UI exported by the `Shared` framework (IOS02).
#
# The `Shared.framework` referenced below is produced by Gradle
# (`./gradlew :shared:linkDebugFrameworkIosSimulatorArm64`) BEFORE `xcodegen generate` runs — see
# .github/workflows/ios.yml. Simulator/Debug/arm64 only; device + Release are IOS03.
name: iosApp
options:
  bundleIdPrefix: com.troubashare
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      # Dynamic Kotlin framework: link AND embed it into the .app (dynamic frameworks must ship in
      # the bundle). codeSign:false — simulator builds are unsigned (CODE_SIGNING_ALLOWED=NO).
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/Shared.framework
        embed: true
        codeSign: false
    # xcodegen generates Info.plist from these properties (merged with its defaults) at
    # `xcodegen generate` time — the file is git-ignored, regenerated in CI. We can't use
    # GENERATE_INFOPLIST_FILE because that only supports a fixed allowlist of keys, and Compose
    # Multiplatform iOS REQUIRES a custom one:
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TroubaShare
        # REQUIRED by Compose Multiplatform iOS — its PlistSanityCheck throws a
        # kotlin.IllegalStateException on the first frame if this key is missing or false.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.troubashare.app
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework

schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
