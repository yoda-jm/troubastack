<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- TroubaStage (A101): this configuration, minus non-scalable (bitmap) fonts, which Skia's font fallback must not open -->
<fontconfig>
  <include ignore_missing="yes">fonts.conf</include>
  <selectfont><rejectfont><pattern><patelt name="scalable"><bool>false</bool></patelt></pattern></rejectfont></selectfont>
</fontconfig>
