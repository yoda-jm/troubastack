name: win08-s2-spike
# THROWAWAY spike for WIN08 stage 2 S2.1 (R1): prove a HIDDEN embedded Browser still loads and sends `ready`.
# Builds the app-image once, then runs --win08-smoke twice: normally (the new check must PASS, full smoke green) and
# with WIN08_SABOTAGE=hiddennoready (the positive control — the check must RED). Deleted once S2.1's result is recorded.
on:
  workflow_dispatch:

jobs:
  s2spike:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: build the app-image (createDistributable — no MSI/WiX needed for the smoke)
        working-directory: app
        run: .\gradlew.bat :desktopApp:createDistributable "-PdesktopVersion=1.0.0"
      - name: S2.1 — hidden Browser loads & readies (normal smoke must PASS, full smoke green)
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "s2-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "s2-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-smoke", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          $txt = if ($log) { Get-Content $log.FullName -Raw } else { "" }
          if ($log) { Write-Host "---- win08.log ----"; Write-Host $txt }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "smoke hung (>120s)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "normal smoke failed (exit $($p.ExitCode)) — a check reddened"; exit 1 }
          if ($txt -notmatch "WIN08-CHECK hidden-browser-loads-and-readies: PASS") { Write-Error "new S2.1 check is not PASS in the log"; exit 1 }
          Write-Host "S2.1 OK: a hidden Browser loads & readies; the full smoke is green"
      - name: S2.1 positive control — hiddennoready must RED the check
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: hiddennoready
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "s2-sab-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "s2-sab-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-smoke", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          $txt = if ($log) { Get-Content $log.FullName -Raw } else { "" }
          if ($log) { Write-Host "---- win08.log (hiddennoready) ----"; Write-Host $txt }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if ($txt -notmatch "WIN08-CHECK hidden-browser-loads-and-readies: FAIL") { Write-Error "positive control did NOT red the check — not discriminating"; exit 1 }
          if ($p.ExitCode -eq 0) { Write-Error "sabotage smoke exited 0 — a reddened check didn't fail the run"; exit 1 }
          Write-Host "S2.1 positive control OK: hiddennoready reds hidden-browser-loads-and-readies"
