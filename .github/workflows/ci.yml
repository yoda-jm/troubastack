# CI for the TroubaStack monorepo.
#
# Gates every push to main and every pull request. Mirrors the local
# verification commands (docs/tasks/README.md ground rule 4):
#   - go   : go vet + go test + a gofmt check that FAILS on diff
#   - web  : per-package install (the web/ workspace is nominal — no root
#            lockfile; studio installs --no-workspaces, ink resolves from
#            source via a Vite alias + tsconfig paths), then tsc for all
#            three packages using studio's compiler, then the studio build
#   - proto  : buf lint (no codegen yet — T09 decides generated-code policy)
#   - android: the KMP mobile app — :shared checks + the Android debug APK (A01)
#   - e2e    : the Playwright suite against a live core+vite stack (slower)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    # T106: `go test -race` is substantially slower — httpapi alone measured ~18 min under the detector
    # locally, so the go-test step gets `-timeout=30m` per package and the job a 45m bound (generous over
    # the observed time, and slower CI cores). A hang fails loudly instead of running to the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      # poppler-utils provides pdftoppm, which the bake orchestrator (B02) shells
      # out to for PDF page rasters; the bake rasterizer test runs it.
      - name: install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: go vet
        working-directory: core
        run: go vet ./...
      - name: go test (race detector — T106 makes it a gate)
        working-directory: core
        run: go test -race -timeout=30m ./...
      - name: gofmt (fail on diff)
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      # T09: the proto-generated Go mirror must match what cmd/gen-mirrors emits from
      # proto/ — editing bundle_gen.go by hand is a CI failure (the glyphs.json/
      # CueGlyphData drift-guard pattern, applied to types).
      - name: verify generated mirrors are regenerated from proto
        working-directory: core
        run: |
          go run ./cmd/gen-mirrors
          git diff --exit-code internal/bake/bundle_gen.go internal/domain/objecttype_gen.go ../web/studio/src/api.gen.ts ../web/ink/src/objecttype.gen.ts ../app/shared/src/commonMain/kotlin/com/troubashare/shared/bundle/BundleModel.kt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/studio/package-lock.json
            web/ink/package-lock.json
            web/bake/package-lock.json
      # web/ is a workspace root (workspaces: ink, studio, bake) but has no root
      # lockfile, so per-package installs MUST pass --no-workspaces — otherwise
      # npm reparents to the root and `npm ci` fails (no root package-lock.json).
      # Each package installs from its own lockfile.
      - name: install studio
        working-directory: web/studio
        run: npm ci --no-workspaces
      - name: install ink
        working-directory: web/ink
        run: npm ci --no-workspaces
      # T50/T51 glyph contract: the runtime glyphs.json AND the app mirror CueGlyphData.kt
      # are GENERATED from the hand-authored SVG primitives (glyphs.authoring.mjs) by one
      # generator. Regenerate and fail if either committed output drifts — one source of
      # truth, no stale runtime artifact (A20: the app must never keep an old glyph set).
      - name: verify glyphs.json + CueGlyphData.kt are regenerated from source
        working-directory: web/ink
        run: |
          node gen-glyphs.mjs
          git diff --exit-code glyphs.json ../../app/shared/src/commonMain/kotlin/com/troubashare/shared/stage/CueGlyphData.kt
      # P205 view-resolution contract (print == screen): the vectors are committed in BOTH lanes —
      # the Go printer (core/internal/bake) and the app presenter (app/shared commonTest) run the SAME
      # cases. Fail if the two copies drift, so the shared rule can never silently fork (T57/P205 Stage 3).
      - name: verify P205 view-resolution vectors are in sync across lanes
        run: |
          diff -u core/internal/bake/testdata/view-resolution.vectors.json \
                  app/shared/src/commonTest/resources/view-resolution.vectors.json
      # A34/T85 visual-beat contract: `beatPhase` is authored in T85 (TS) against
      # docs/contracts/beat-phase.vectors.json; the app mirrors that file into commonTest
      # resources and runs the SAME cases in Kotlin. Fail if the two copies drift, so
      # "when is a beat" can never silently fork between studio and stage.
      - name: verify A34/T85 beat-phase vectors are in sync across lanes
        run: |
          diff -u docs/contracts/beat-phase.vectors.json \
                  app/shared/src/commonTest/resources/beat-phase.vectors.json
      # A35/T92 metre-parser contract: docs/contracts/meter-groups.vectors.json pins ParseMeter across
      # three runtimes (Go app, TS studio, Kotlin app). Go and TS read the contract path directly; the
      # app mirrors it into commonTest resources and runs the SAME cases in Kotlin. Fail if the two
      # copies drift, so the grouping rule can never silently fork between server, studio and stage.
      - name: verify A35/T92 meter-groups vectors are in sync across lanes
        run: |
          diff -u docs/contracts/meter-groups.vectors.json \
                  app/shared/src/commonTest/resources/meter-groups.vectors.json
      # bake imports node builtins + @napi-rs/canvas, so it must be installed
      # before the typecheck below resolves its `-p bake` project.
      - name: install bake
        working-directory: web/bake
        run: npm ci --no-workspaces
      # ink and bake are plain projects (-p checks their `include`). studio's
      # tsconfig.json is a SOLUTION file (files:[] + references), so `-p studio`
      # would compile nothing — use `-b` so tsc follows the app+node references.
      - name: typecheck ink + studio + bake
        working-directory: web
        run: |
          TSC=studio/node_modules/.bin/tsc
          "$TSC" --noEmit -p ink
          "$TSC" -b studio
          "$TSC" --noEmit -p bake
      - name: build studio
        working-directory: web/studio
        run: npm run build
      # bake worker: build the CLI bundle + run the I8 parity test (bake overlays
      # vs the studio dry path in headless Chromium). Needs Playwright's chromium.
      - name: install playwright chromium (bake parity)
        working-directory: web/bake
        run: npx playwright install --with-deps chromium
      - name: build + test bake
        working-directory: web/bake
        run: npm test
      # T97/T98 CI-gap fix: two real-CLI proofs that only THIS job can run (it's the only job that builds
      # web/bake/dist/cli.js — the `go` job never does, so these SKIP there and never execute in CI):
      #   • EmptyDoc_ZeroOverlays  — "0 objects ⇒ the real worker emits 0 overlays" (T97's skip is byte-identical)
      #   • BatchMatchesIsolated   — "a song's overlay is byte-identical whether rendered alone or batched" (T98)
      # Run them here (npm test above just built the CLI) and FAIL LOUDLY if EITHER skips, so the proofs
      # can't silently stop running. `shell: bash` gives us `-eo pipefail` so a `go test` failure through
      # the `tee` pipe isn't masked.
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - name: bake overlay real-CLI proofs (must RUN, not skip)
        working-directory: core
        shell: bash
        run: |
          go test -run TestOverlayRenderer -v ./internal/bake/ 2>&1 | tee overlay-proof.log
          grep -q 'PASS: TestOverlayRenderer_EmptyDoc_ZeroOverlays' overlay-proof.log \
            || { echo '::error::empty-doc CLI proof did not run (skipped or failed) — CI must execute it'; exit 1; }
          grep -q 'PASS: TestOverlayRenderer_BatchMatchesIsolated' overlay-proof.log \
            || { echo '::error::batch-parity CLI proof did not run (skipped or failed) — CI must execute it'; exit 1; }

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `buf breaking` can diff against the pre-push tip
      # Official buf action; installs the latest buf release. Add `version:`
      # here to pin a specific buf for fully reproducible lint runs.
      # NOTE: still on the Node20 runtime (latest v1.50.0 uses node20; no Node24
      # major published yet) — the sole remaining deprecation warning. Revisit
      # when bufbuild ships a Node24 release.
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf lint
        working-directory: proto
        run: buf lint
      # T09 Stage 4 — field-number safety. This repo lands by fast-forward PUSH to
      # main (no PRs), so `--against branch=main` would clone the just-pushed main
      # (a no-op). Compare against the PRE-PUSH tip (github.event.before) so every
      # landing is checked. Skip the all-zeros SHA (branch creation / force reset).
      - name: buf breaking (push — against pre-push main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        working-directory: proto
        run: buf breaking --against "../.git#ref=${{ github.event.before }},subdir=proto"
      # Belt for any future PR flow: diff the PR head against remote main.
      - name: buf breaking (pull_request — against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # JDK 21 = the Kotlin/AGP compile toolchain pinned in app/gradle/libs.versions.toml, so the
      # daemon and the jvmToolchain resolve to the SAME JDK here — no toolchain auto-provisioning.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Caches Gradle (~/.gradle) and the wrapper distribution across runs.
      - uses: gradle/actions/setup-gradle@v6
      # ubuntu-latest ships the Android SDK preinstalled with ANDROID_HOME set, so AGP finds it
      # without a local.properties or an explicit sdkmanager step. Add SDK setup only if this fails.
      - name: shared check + assemble debug APK
        working-directory: app
        run: ./gradlew :shared:check :androidApp:assembleDebug
      # iOS klibs cross-compile on Linux (no Mac needed) — type-checks the iosMain seam actuals
      # (Storage/WebViewHost + the zip reader) on every push. Linking a framework + running a
      # simulator still needs macOS; that's IOS02's job (manual-trigger macOS runner).
      - name: compile iOS klibs (cross-compile, no linking)
        working-directory: app
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
      # Publish the debug APK so anyone can sideload TroubaShare without a local
      # toolchain (README → "The mobile app"). Debug-signed — not a store release.
      - name: upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: troubashare-debug-apk
          path: app/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  e2e:
    runs-on: ubuntu-latest
    # Suite is ~7 min locally; the Go webServer cold-compiles on the runner.
    # Cap it so a broken app (e.g. an unresolved import) fails fast instead of
    # letting every test grind through its 30s timeout.
    timeout-minutes: 20
    # This job HARD-GATES. The one CI-only failure (editor-rorw-shift.spec.ts,
    # a real ~27px RO/RW pageTop shift — green locally) is quarantined at the
    # spec level via `test.skip(!!process.env.CI, ...)`, tracked in T13, so the
    # rest of the suite still blocks regressions. Do NOT add continue-on-error.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/studio/package-lock.json
      # make setup-equivalent: studio (standalone) + Playwright's chromium with
      # its system libs. The playwright.config webServer block boots the Go core
      # and the Vite dev server itself, so no separate server step is needed.
      - name: install studio
        working-directory: web/studio
        run: npm ci --no-workspaces
      # Vite bundles @troubastack/ink from source via its alias, and ink imports
      # perfect-freehand — so web/ink must be installed or the dev server 500s
      # on every page load and the whole suite times out.
      - name: install ink
        working-directory: web/ink
        run: npm ci --no-workspaces
      - name: install playwright chromium
        working-directory: web/studio
        run: npx playwright install --with-deps chromium
      - name: e2e
        run: make e2e
