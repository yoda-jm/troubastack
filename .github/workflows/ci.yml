# CI for the TroubaStack monorepo.
#
# Gates every push to main and every pull request. Mirrors the local
# verification commands (docs/tasks/README.md ground rule 4):
#   - go   : go vet + go test + a gofmt check that FAILS on diff
#   - web  : per-package install (the web/ workspace is nominal — no root
#            lockfile; studio installs --no-workspaces, ink resolves from
#            source via a Vite alias + tsconfig paths), then tsc for all
#            three packages using studio's compiler, then the studio build
#   - proto  : buf lint (no codegen yet — T09 decides generated-code policy)
#   - android: the KMP mobile app — :shared checks + the Android debug APK (A01)
#   - e2e    : the Playwright suite against a live core+vite stack (slower)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual republish of the Docker image without a code change — the escape hatch latest-only needs
  # (no immutable tag to re-point). Runs the full suite; the image job publishes green-gated (below).
  workflow_dispatch:
    inputs:
      # WIN08 S2.3: set the embedded-Studio sabotage for a measurement spike (e.g. clearonlya, nopending). The WIN08
      # smoke/cookieclear steps pass it as WIN08_SABOTAGE; empty on push/PR, so normal CI runs un-sabotaged. A measured
      # discriminator run is EXPECTED to red the targeted check (proof the guard has teeth), so it is never landed.
      win08_sabotage:
        description: "WIN08_SABOTAGE value for a measurement spike (leave empty for a normal run)"
        required: false
        default: ""
      # WIN09: "all" makes the band-QR step run its smoke once per sabotage and assert each reds its own check.
      win09_sabotage:
        description: "WIN09: 'all' runs the band-QR sabotage passes instead of the normal smoke (leave empty for a normal run)"
        required: false
        default: ""
      # A101: licencedropone / licencenonotice break the notices generator (at build time, as the Gradle property
      # a101Sabotage); nofontfix turns off the Linux app's fontconfig fix, fontenvleak opens links the way it did before
      # (both at run time, as A101_SABOTAGE); nofontcache skips writing the CJK repro's font cache (CI only). A sabotage
      # run is expected to red its own A101-CHECK and nothing else, so it is never landed.
      a101_sabotage:
        description: "A101: licencedropone, licencenonotice, nofontfix, fontenvleak or nofontcache (leave empty for a normal run)"
        required: false
        default: ""

permissions:
  contents: read

# T111: a newer push to the same ref cancels the older run's whole matrix, so a burst of pushes doesn't
# queue N full CI runs (image build + e2e make this expensive). The default group already scopes per-ref.
# BUT NOT ON main: main is the integration branch, and a burst of handoff/doc commits (which land every
# few minutes) was cancelling the in-progress run of the CODE commit before it — so for hours no run
# completed and main went effectively unvalidated (a red image build hid behind cancelled runs). On main
# we let every push run to completion; PRs still collapse their bursts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    # T106: `go test -race` is substantially slower — httpapi alone measured ~18 min under the detector
    # locally, so the go-test step gets `-timeout=30m` per package and the job a 45m bound (generous over
    # the observed time, and slower CI cores). A hang fails loudly instead of running to the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          # The module lives in core/, so setup-go's cache key lookup misses at the repo root and
          # logs "Restore cache failed: Dependencies file is not found" — every Go job re-downloaded
          # its modules. Point it at the real sum file.
          cache-dependency-path: core/go.sum
      # poppler-utils provides pdftoppm, which the bake orchestrator (B02) shells
      # out to for PDF page rasters; the bake rasterizer test runs it.
      - name: install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: go vet
        working-directory: core
        run: go vet ./...
      - name: go test (race detector — T106 makes it a gate)
        working-directory: core
        run: go test -race -timeout=30m ./...
      - name: gofmt (fail on diff)
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      # T09: the proto-generated Go mirror must match what cmd/gen-mirrors emits from
      # proto/ — editing bundle_gen.go by hand is a CI failure (the glyphs.json/
      # CueGlyphData drift-guard pattern, applied to types).
      - name: verify generated mirrors are regenerated from proto
        working-directory: core
        run: |
          go run ./cmd/gen-mirrors
          git diff --exit-code internal/bake/bundle_gen.go internal/domain/objecttype_gen.go ../web/studio/src/api.gen.ts ../web/ink/src/objecttype.gen.ts ../app/shared/src/commonMain/kotlin/com/troubastack/shared/bundle/BundleModel.kt

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/studio/package-lock.json
            web/ink/package-lock.json
            web/bake/package-lock.json
      # web/ is a workspace root (workspaces: ink, studio, bake) but has no root
      # lockfile, so per-package installs MUST pass --no-workspaces — otherwise
      # npm reparents to the root and `npm ci` fails (no root package-lock.json).
      # Each package installs from its own lockfile.
      - name: install studio
        working-directory: web/studio
        run: npm ci --no-workspaces
      - name: install ink
        working-directory: web/ink
        run: npm ci --no-workspaces
      # T110: browser-free unit tests for studio + ink pure functions (geometry, stroke width, DPR budget).
      # Fails the build on red, like every other gate. Fast — runs before the heavier tsc/build below.
      - name: unit tests (vitest)
        working-directory: web/studio
        run: npm run test:unit
      # T50/T51 glyph contract: the runtime glyphs.json AND the app mirror CueGlyphData.kt
      # are GENERATED from the hand-authored SVG primitives (glyphs.authoring.mjs) by one
      # generator. Regenerate and fail if either committed output drifts — one source of
      # truth, no stale runtime artifact (A20: the app must never keep an old glyph set).
      - name: verify glyphs.json + CueGlyphData.kt are regenerated from source
        working-directory: web/ink
        run: |
          node gen-glyphs.mjs
          git diff --exit-code glyphs.json ../../app/shared/src/commonMain/kotlin/com/troubastack/shared/stage/CueGlyphData.kt
      # BRAND01: docs/brand/dist is GENERATED from docs/brand/src by build.py — never
      # hand-edited. build.py is stdlib-only and deterministic, so regenerating and
      # diffing is a valid drift guard, the same pattern as the glyphs and mirrors above.
      # NOT `--png`, and deliberately NOT sheet.py: the PNG ladder and family-sheet.svg
      # embed rsvg-rasterised output, so their bytes depend on the rsvg build and the
      # fonts installed on the runner. Only the SVGs are reproducible anywhere.
      - name: verify docs/brand/dist is regenerated from src
        run: |
          python3 docs/brand/build.py
          git diff --exit-code docs/brand/dist
      # P205 view-resolution contract (print == screen): the vectors are committed in BOTH lanes —
      # the Go printer (core/internal/bake) and the app presenter (app/shared commonTest) run the SAME
      # cases. Fail if the two copies drift, so the shared rule can never silently fork (T57/P205 Stage 3).
      - name: verify P205 view-resolution vectors are in sync across lanes
        run: |
          diff -u core/internal/bake/testdata/view-resolution.vectors.json \
                  app/shared/src/commonTest/resources/view-resolution.vectors.json
      # A34/T85 visual-beat contract: `beatPhase` is authored in T85 (TS) against
      # docs/contracts/beat-phase.vectors.json; the app mirrors that file into commonTest
      # resources and runs the SAME cases in Kotlin. Fail if the two copies drift, so
      # "when is a beat" can never silently fork between studio and stage.
      - name: verify A34/T85 beat-phase vectors are in sync across lanes
        run: |
          diff -u docs/contracts/beat-phase.vectors.json \
                  app/shared/src/commonTest/resources/beat-phase.vectors.json
      # A35/T92 metre-parser contract: docs/contracts/meter-groups.vectors.json pins ParseMeter across
      # three runtimes (Go app, TS studio, Kotlin app). Go and TS read the contract path directly; the
      # app mirrors it into commonTest resources and runs the SAME cases in Kotlin. Fail if the two
      # copies drift, so the grouping rule can never silently fork between server, studio and stage.
      - name: verify A35/T92 meter-groups vectors are in sync across lanes
        run: |
          diff -u docs/contracts/meter-groups.vectors.json \
                  app/shared/src/commonTest/resources/meter-groups.vectors.json
      # T158 running-order numbering contract: docs/contracts/running-order-numbering.vectors.json pins the
      # ONE numbering rule across three surfaces (Go export, TS studio, Kotlin Stage drawer). The app mirrors
      # it into commonTest resources and runs the SAME cases in Kotlin. Fail if the two copies drift, so
      # "song number 7" can never silently fork between the printed sheet, the drawer and the editor.
      - name: verify T158 running-order-numbering vectors are in sync across lanes
        run: |
          diff -u docs/contracts/running-order-numbering.vectors.json \
                  app/shared/src/commonTest/resources/running-order-numbering.vectors.json
      # bake imports node builtins + @napi-rs/canvas, so it must be installed
      # before the typecheck below resolves its `-p bake` project.
      - name: install bake
        working-directory: web/bake
        run: npm ci --no-workspaces
      # ink and bake are plain projects (-p checks their `include`). studio's
      # tsconfig.json is a SOLUTION file (files:[] + references), so `-p studio`
      # would compile nothing — use `-b` so tsc follows the app+node references.
      - name: typecheck ink + studio + bake
        working-directory: web
        run: |
          TSC=studio/node_modules/.bin/tsc
          "$TSC" --noEmit -p ink
          "$TSC" -b studio
          "$TSC" --noEmit -p bake
      - name: build studio
        working-directory: web/studio
        run: npm run build
      # bake worker: build the CLI bundle + run the I8 parity test (bake overlays
      # vs the studio dry path in headless Chromium). Needs Playwright's chromium.
      - name: install playwright chromium (bake parity)
        working-directory: web/bake
        run: npx playwright install --with-deps chromium
      - name: build + test bake
        working-directory: web/bake
        run: npm test
      # T97/T98 CI-gap fix: two real-CLI proofs that only THIS job can run (it's the only job that builds
      # web/bake/dist/cli.js — the `go` job never does, so these SKIP there and never execute in CI):
      #   • EmptyDoc_ZeroOverlays  — "0 objects ⇒ the real worker emits 0 overlays" (T97's skip is byte-identical)
      #   • BatchMatchesIsolated   — "a song's overlay is byte-identical whether rendered alone or batched" (T98)
      # Run them here (npm test above just built the CLI) and FAIL LOUDLY if EITHER skips, so the proofs
      # can't silently stop running. `shell: bash` gives us `-eo pipefail` so a `go test` failure through
      # the `tee` pipe isn't masked.
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          # The module lives in core/, so setup-go's cache key lookup misses at the repo root and
          # logs "Restore cache failed: Dependencies file is not found" — every Go job re-downloaded
          # its modules. Point it at the real sum file.
          cache-dependency-path: core/go.sum
      - name: bake overlay real-CLI proofs (must RUN, not skip)
        working-directory: core
        shell: bash
        run: |
          go test -run TestOverlayRenderer -v ./internal/bake/ 2>&1 | tee overlay-proof.log
          grep -q 'PASS: TestOverlayRenderer_EmptyDoc_ZeroOverlays' overlay-proof.log \
            || { echo '::error::empty-doc CLI proof did not run (skipped or failed) — CI must execute it'; exit 1; }
          grep -q 'PASS: TestOverlayRenderer_BatchMatchesIsolated' overlay-proof.log \
            || { echo '::error::batch-parity CLI proof did not run (skipped or failed) — CI must execute it'; exit 1; }

  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so `buf breaking` can diff against the pre-push tip
      # Official buf action; installs the latest buf release. Add `version:`
      # here to pin a specific buf for fully reproducible lint runs.
      # NOTE: still on the Node20 runtime (latest v1.50.0 uses node20; no Node24
      # major published yet) — the sole remaining deprecation warning. Revisit
      # when bufbuild ships a Node24 release.
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}
      - name: buf lint
        working-directory: proto
        run: buf lint
      # T09 Stage 4 — field-number safety. This repo lands by fast-forward PUSH to
      # main (no PRs), so `--against branch=main` would clone the just-pushed main
      # (a no-op). Compare against the PRE-PUSH tip (github.event.before) so every
      # landing is checked. Skip the all-zeros SHA (branch creation / force reset).
      - name: buf breaking (push — against pre-push main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        working-directory: proto
        run: buf breaking --against "../.git#ref=${{ github.event.before }},subdir=proto"
      # Belt for any future PR flow: diff the PR head against remote main.
      - name: buf breaking (pull_request — against main)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: buf breaking --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A101: empty on push/PR; set by a sabotage dispatch (the a101_sabotage input).
    env:
      ORG_GRADLE_PROJECT_a101Sabotage: ${{ github.event.inputs.a101_sabotage }}
      A101_SABOTAGE: ${{ github.event.inputs.a101_sabotage }}
    steps:
      - uses: actions/checkout@v7
      # JDK 21 = the Kotlin/AGP compile toolchain pinned in app/gradle/libs.versions.toml, so the
      # daemon and the jvmToolchain resolve to the SAME JDK here — no toolchain auto-provisioning.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # Caches Gradle (~/.gradle) and the wrapper distribution across runs.
      - uses: gradle/actions/setup-gradle@v6
      # ubuntu-latest ships the Android SDK preinstalled with ANDROID_HOME set, so AGP finds it
      # without a local.properties or an explicit sdkmanager step. Add SDK setup only if this fails.
      # A88 §0: sign with the ONE stable key (the dev machine's debug keystore, an Actions secret VLL added), so a CI
      # APK installs over the app already on a tablet — no uninstall, no lost notes. Only on pushes to main: PR builds
      # run third-party Gradle code and keep the throwaway key. No secret (a fork, or before it was added) → the
      # throwaway key, and release-apk's body says which key signed the APK.
      - name: stable signing key (A88)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.TROUBASTAGE_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/troubastage-debug.keystore"
            echo "TROUBASTAGE_DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/troubastage-debug.keystore" >> "$GITHUB_ENV"
            echo "signing with the stable key"
          else
            echo "::warning::TROUBASTAGE_DEBUG_KEYSTORE is not set — this APK is signed with a throwaway key and cannot update an installed app"
          fi
      - name: shared check + androidApp unit tests + assemble debug APK
        working-directory: app
        # A47: :androidApp:test runs the app module's JVM unit tests (sessionCookieFor / safeSegment) and
        # fails the build on red — the module had no test source set before, so this code had never been
        # executed by a test on any machine.
        run: ./gradlew :shared:check :androidApp:test :androidApp:assembleDebug
      # A101 — the notices inside the APK, checked independently of the generator (app/licences/ci/check-notices.py):
      # every component the build resolves is listed at its version (excluded nodes printed), every NOTICE file ships,
      # every licence a shipped file names has its text, every native library in lib/ maps to an entry.
      - name: A101 — the notices inside the APK (coverage, notices, natives)
        if: always()
        working-directory: app
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP/a101"; rm -rf "$t"; mkdir -p "$t/apk"
          apk=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          [ -s "$apk" ] || { echo "::error::no debug APK"; exit 1; }
          ./gradlew -q :androidApp:dependencies --configuration debugRuntimeClasspath > "$t/report.txt"
          ./gradlew -q --no-configuration-cache -I licences/ci/artifact-paths.init.gradle.kts "-Da101.out=$t/artifacts.tsv" :androidApp:a101ArtifactPaths
          unzip -q "$apk" 'assets/notices/*' -d "$t/apk"
          rc=0
          python3 -I licences/ci/check-notices.py --name apk --report "$t/report.txt" --artifacts "$t/artifacts.tsv" \
            --notices "$t/apk/assets/notices" --spdx licences/spdx --manifest licences/native/manifest.txt --apk "$apk" || rc=1
          echo "APK: $(stat -c %s "$apk") bytes"
          exit $rc
      # A101 — what app/buildSrc costs: configuration time without the configuration cache (a cache hit skips it), base
      # vs head, each the median of three warm runs after a warm-up. Pull requests only (it needs the base commit).
      - name: A101 — configuration time, base vs head
        if: github.event_name == 'pull_request'
        working-directory: app
        run: |
          set -uo pipefail
          base=${{ github.event.pull_request.base.sha }}
          git fetch -q --depth=1 origin "$base" && git worktree add -q --detach "$RUNNER_TEMP/base" FETCH_HEAD
          median() { ( cd "$1" && ./gradlew -q --no-configuration-cache help >/dev/null 2>&1
            for i in 1 2 3; do s=$(date +%s%N); ./gradlew -q --no-configuration-cache help >/dev/null 2>&1; e=$(date +%s%N); echo $(( (e - s) / 1000000 )); done ) | sort -n | sed -n 2p; }
          b=$(median "$RUNNER_TEMP/base/app"); h=$(median "$PWD")
          echo "A101 configuration time (help, no configuration cache, warm daemon, median of 3): base ${base:0:8} ${b} ms, head ${h} ms"
      # iOS klibs cross-compile on Linux (no Mac needed) — type-checks the iosMain seam actuals
      # (Storage/WebViewHost + the zip reader) on every push. Linking a framework + running a
      # simulator still needs macOS; that's IOS02's job (manual-trigger macOS runner).
      - name: compile iOS klibs (cross-compile, no linking)
        working-directory: app
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
      # Publish the debug APK so anyone can sideload TroubaStage without a local
      # toolchain (README → "The mobile app"). Debug-signed — not a store release.
      - name: upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: troubastage-debug-apk
          path: app/androidApp/build/outputs/apk/debug/androidApp-debug.apk

  # OPS05: publish the debug APK as the single asset on a rolling `latest` prerelease so the
  # site's QR/button link straight to an installable .apk (no GitHub sign-in, no zip). This is a
  # SEPARATE job on purpose: `permissions:` is granted per-job, and the `android` job runs on PRs
  # and executes a full Gradle build with third-party plugins — keeping contents:write out of it
  # (least privilege). Guarded to pushes on `main`; on PRs the `if:` skips it entirely.
  # WIN03 D8: the Windows MSI rides the same release, built by the `windows` job: one release, two assets, recreated
  # together (so the APK now also waits for the windows job, and a red windows job publishes neither).
  # DESK01 D4: that job is now the `desktop` matrix; its linux leg adds the AppImage (three assets).
  # DESK02: the macOS DMG joins them, so `latest` carries four assets (built by `desktop-macos`, in `needs` too). A red
  # Mac leg now holds up the APK, the MSI and the AppImage — the price of recreating the release as one set.
  release-apk:
    needs: [android, desktop, desktop-macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # VLL, 2026-09-02: only republish when the release's contents could actually have changed. Without this the
      # release is deleted and recreated on every main push -- including docs-only ones -- which
      # republishes identical assets and 404s the download URLs for a few seconds each time.
      #
      # What can change the assets: a change under `app/` (the apps themselves), OR a change to this workflow,
      # which is what builds and names them -- DESK02's own landing commit touches only `.github/workflows/ci.yml`
      # and must still republish, so the DMG reaches `latest`. A workflow-level `paths:` filter cannot express this:
      # it would gate the WHOLE of CI, not this job. So decide here, via the compare API (no checkout needed, and
      # the token is already set). FAIL OPEN: if the base is unknown (branch creation, force push) or the compare
      # call fails, publish anyway -- a missed publish is worse than a redundant one.
      - name: do the release contents change?
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "base unknown - publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                         --jq '.files[].filename' 2>/dev/null); then
            echo "compare failed - publishing anyway"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(app/|\.github/workflows/ci\.yml$)'; then
            echo "app/ or the CI workflow touched - publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "no change to the release contents - keeping the existing release"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: fetch the APK the android job built
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: troubastage-debug-apk
      - name: fetch the MSI the windows job built
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: troubastage-windows-msi
          path: windows-msi
      - name: fetch the AppImage the desktop (linux) job built
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: troubastage-linux-appimage
          path: linux-appimage
      - name: fetch the DMG the desktop (macos) job built
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v7
        with:
          name: troubastage-macos-dmg
          path: macos-dmg
      - name: publish it on the rolling `latest` release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stable, human asset name — the download URL embeds it; androidApp-debug is gradle-internal.
          mv androidApp-debug.apk troubastage-debug.apk
          # WIN03 D8: the MSI under a stable name too (the windows job names it by run number). Exactly one, or stop.
          msis=(windows-msi/troubastage-*.msi)
          [ "${#msis[@]}" -eq 1 ] && [ -f "${msis[0]}" ] || { echo "::error::expected one MSI, found: ${msis[*]}"; exit 1; }
          mv "${msis[0]}" troubastage-windows.msi
          # DESK01 D4: the AppImage, already under its stable name. Exactly one, or stop.
          [ -s linux-appimage/troubastage-linux-x86_64.AppImage ] || { echo "::error::no AppImage from the desktop (linux) job"; exit 1; }
          mv linux-appimage/troubastage-linux-x86_64.AppImage .
          # DESK02: the DMG the desktop (macos) job built. Exactly one .dmg, or stop (its artifact also holds the smoke PNGs).
          dmgs=(macos-dmg/*.dmg)
          [ "${#dmgs[@]}" -eq 1 ] && [ -f "${dmgs[0]}" ] || { echo "::error::expected one DMG, found: ${dmgs[*]}"; exit 1; }
          mv "${dmgs[0]}" troubastage-macos.dmg
          # Finding 1 (Fable): a rolling tag must not lie. `--clobber` would replace the asset but
          # leave the tag at an old commit, and versionName is a static 0.1.0 that cannot say which
          # build this is. So recreate the release+tag at THIS commit every publish and state the
          # exact commit + build time in the body. The download URL is stable (fixed tag + asset name).
          # A88: say which key signed it. Only the stable key's APK can update an installed app in place.
          STABLE=e99675323f86797c5addbafe2d4c0a8c7d855fb1d21e7e00fe9c72d07340a426
          # Read the signer with the newest build-tools apksigner that works (the first publish read nothing and the
          # body wrongly said "throwaway"); its stderr goes to the job log so a failure is visible.
          SIGNER=""
          for bt in $(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/ 2>/dev/null | sort -rV); do
            SIGNER=$("${bt}apksigner" verify --print-certs troubastage-debug.apk | sed -n 's/^Signer.*certificate SHA-256 digest: //p' | head -1) || true
            [ -n "$SIGNER" ] && { echo "signer read with ${bt}apksigner: $SIGNER"; break; }
            echo "::warning::${bt}apksigner could not read the signer"
          done
          {
            echo "Debug-signed Android APK — rolling build of \`main\`. Not a store release; Android warns about an unknown source."
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Built:  $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            if [ "$SIGNER" = "$STABLE" ]; then echo "Signed with the stable TroubaStage key (updates the installed app in place)."
            elif [ -z "$SIGNER" ]; then echo "Signing key: could not be read on this run."
            else echo "Signed with a throwaway key ($SIGNER): it cannot update an app installed from another build in place."; fi
            echo
            echo "Windows: troubastage-windows.msi — a per-user install (no administrator rights), same commit."
            echo "Linux: troubastage-linux-x86_64.AppImage — no installation: make it executable and run it, same commit."
            echo "macOS: troubastage-macos.dmg — one app for Apple silicon and Intel Macs, not signed yet, same commit."
          } > notes.md
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create latest troubastage-debug.apk troubastage-windows.msi troubastage-linux-x86_64.AppImage troubastage-macos.dmg \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Latest debug build" \
            --notes-file notes.md

  e2e:
    runs-on: ubuntu-latest
    # Budget, measured on run 40416155161 (2026-10-26): the long pole is the Playwright `--with-deps` APT fetch —
    # up to ~9 min on a slow Ubuntu mirror (24.9 MB in 8m39s @ 48 kB/s; ~1s at 30 MB/s on a good day), NOT the
    # browser download (~10s, so a browser cache wouldn't help). The suite itself is ~14 min on a fast runner
    # (348 specs in 852s on 2adf350a) but ~19 min on a slow one (296 in 974s before the cap), plus the Go
    # webServer cold-compile. Worst case ≈ slow-apt + slow-suite ≈ 28 min, so cap at 35 for headroom. The cap
    # still protects against a broken app: a broken CORE fails fast (the Go webServer won't start), and a broken
    # SPA — Vite dev serves 500 on every page, so each test burns its full 30s timeout (see the ink-install
    # note) — is bounded by the cap at 35 min instead of ≈3h (348 × 30s).
    timeout-minutes: 35
    # This job HARD-GATES. The one CI-only failure (editor-rorw-shift.spec.ts,
    # a real ~27px RO/RW pageTop shift — green locally) is quarantined at the
    # spec level via `test.skip(!!process.env.CI, ...)`, tracked in T13, so the
    # rest of the suite still blocks regressions. Do NOT add continue-on-error.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          # The module lives in core/, so setup-go's cache key lookup misses at the repo root and
          # logs "Restore cache failed: Dependencies file is not found" — every Go job re-downloaded
          # its modules. Point it at the real sum file.
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/studio/package-lock.json
      # make setup-equivalent: studio (standalone) + Playwright's chromium with
      # its system libs. The playwright.config webServer block boots the Go core
      # and the Vite dev server itself, so no separate server step is needed.
      - name: install studio
        working-directory: web/studio
        run: npm ci --no-workspaces
      # Vite bundles @troubastack/ink from source via its alias, and ink imports
      # perfect-freehand — so web/ink must be installed or the dev server 500s
      # on every page load and the whole suite times out.
      - name: install ink
        working-directory: web/ink
        run: npm ci --no-workspaces
      - name: install playwright chromium
        working-directory: web/studio
        run: npx playwright install --with-deps chromium
      - name: e2e
        run: make e2e
      # T117: retries (CI=1) score a fail-then-pass as `flaky` — surface it even on a green run so a
      # retried pass is never a silent green. `if: always()` so it also reports after a failing run.
      - name: flaky visibility
        if: always()
        working-directory: web/studio
        run: node ../../.github/scripts/flaky-warn.mjs

  # T111 (C8): build the artifact users actually run. Until now CI gated six ways but never built the
  # production image or checked the compose stack — the least-verified files in a heavily-verified repo,
  # and the ones a self-hoster deploys. Build-only: no registry, no push (publishing is audit F5).
  image:
    # Finding 1 (Fable): publish only from a GREEN commit — wait for the test gates rather than
    # racing them. Without this the image pushed from a run being torn down, built from a commit
    # whose suite never reported. android is not in the image, so it is not a gate here.
    needs: [go, web, e2e]
    # Finding 3 / spec §5: serialize publishes so two quick merges cannot race an older build into
    # `latest`; do not cancel a publish mid-push (the newest queued one wins).
    concurrency:
      group: docker-image-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # A GHA layer cache keeps this off the critical path when nothing Docker-related changed, but it
      # cannot mask a broken build: a changed (or broken) instruction invalidates the cache from that
      # layer down, so a Dockerfile that can't build from scratch still fails the job.
      - name: build timestamp (BUILT_AT, ISO-8601 UTC)
        id: bt
        run: echo "at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      # Finding 2 (Fable): republish `latest` only when what goes INTO the image could have changed.
      # Otherwise every main push — docs included — silently moves the tag every `compose pull`
      # fetches, and latest-only has no immutable tag to roll back to. A workflow-level paths: filter
      # would gate all of CI, so decide here via the compare API (same fail-open pattern as
      # release-apk). FAIL OPEN — branch creation / force push / API error → publish, because a
      # missed publish is worse than a redundant one.
      - name: does image content change?
        id: gate
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "manual dispatch - forcing a republish of current main"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "base unknown - publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" \
                         --jq '.files[].filename' 2>/dev/null); then
            echo "compare failed - publishing anyway"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # OPS06: publish UNLESS every changed file is known NOT to be in the image. This is a
          # DENYLIST, the inverse of an allowlist, and it fails SAFE: a new Dockerfile COPY republishes
          # by default, because a redundant push (minutes) beats a silently stale public image (OPS04
          # finding 2). The `irrelevant` set is the only thing to maintain, and forgetting to extend it
          # over-publishes (harmless) rather than going stale (a bug nobody can reproduce).
          # What the image IS built from — keep this comment beside the Dockerfile's COPY lines: the
          # core+web multi-stage build, and `COPY deploy/apps/ /app/apps/` (Dockerfile). Everything not
          # matched below is treated as image content. proto/ is irrelevant ON PURPOSE — core
          # hand-mirrors it (I1) and the runtime stage takes only the binary; do NOT make it a trigger.
          irrelevant='^(docs/|app/|web/site/|\.github/|proto/|Makefile$|LICENSE$|NOTICE$|\.gitignore$|[^/]*\.md$|deploy/[^/]*\.md$)'
          if printf '%s\n' "$files" | grep -qvE "$irrelevant"; then
            echo "image content (or an unknown path) touched - publishing"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "only image-irrelevant paths - keeping the published image"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      # Log in to Docker Hub ONLY when we are actually going to push (main + image content changed).
      # A fork's pull request builds the image below (validation) but never reaches the credential —
      # OPS04's security core: the build stays on PRs, the login and push do not.
      - name: log in to Docker Hub
        if: steps.gate.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build the production image, push to Docker Hub on main
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Built on every push/PR (validates the Dockerfile from scratch); pushed ONLY when the gate
          # above says so — a green main push whose diff touched image content.
          push: ${{ steps.gate.outputs.publish == 'true' }}
          tags: vincentleligeour/troubastack:latest
          # latest-only carries no immutable tag (OPS04 decision b), so the commit + build time
          # threaded into buildinfo are the image's ONLY traceability — `docker run …` reports them.
          build-args: |
            VERSION=${{ github.sha }}
            BUILT_AT=${{ steps.bt.outputs.at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Validate the compose stack so a malformed compose or a dangling variable fails here, not on the
      # host. Uses the committed example env for the required variables (DOMAIN).
      - name: validate deploy compose
        # `docker compose config` exits non-zero on malformed YAML, but an UNSET ${VAR} is only a warning
        # (rc=0) that renders a blank string — so a typo'd variable would sail through CI and the container
        # start blank. Catch BOTH: fail on invalid compose, and fail if any variable is unset (T111).
        run: |
          out=$(docker compose -f deploy/docker-compose.yml --env-file deploy/.env.example config 2>&1) || {
            echo "$out"
            echo "::error::deploy compose is invalid"
            exit 1
          }
          if echo "$out" | grep -qi 'variable is not set'; then
            echo "$out" | grep -i 'variable is not set'
            echo "::error::deploy compose references an unset variable — a typo, or a missing entry in deploy/.env.example"
            exit 1
          fi

  # WIN02 — the Windows desktop build, proven end to end on a real Windows runner: the shared code's desktop
  # tests (incl. the DPAPI secret protection), the per-user MSI, a launch smoke that renders one frame, and an
  # upgrade-in-place proof (MSI n → n+1 leaves ONE entry). Hard-gating. The MSI + the smoke PNG are uploaded.
  # (The desktop tests ALSO run on Linux in the `android` job's :shared:check — D4, both JVMs agree.)
  # DESK01 D1 — one desktop job, matrixed per OS: each packages its native installer from the same code and runs the
  # same launch smoke (B5: exit 0 only after the real window drew). The Windows steps are WIN02–WIN04's, unchanged.
  desktop:
    name: desktop (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # A101: empty on push/PR; set by a sabotage dispatch (the a101_sabotage input).
    env:
      ORG_GRADLE_PROJECT_a101Sabotage: ${{ github.event.inputs.a101_sabotage }}
      A101_SABOTAGE: ${{ github.event.inputs.a101_sabotage }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: windows
            os: windows-latest
          # The oldest Ubuntu runner left, so the AppImage does not ask for a newer glibc than it must.
          - leg: linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      # jpackage builds the MSI with WiX 3 (candle/light). It ships on the windows-latest image; fail with a
      # clear message here if it ever stops being on PATH, rather than deep inside a Gradle stack trace.
      - name: check WiX 3 is available (jpackage MSI needs it)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            Write-Host "WiX not on PATH — installing WiX 3.14 via Chocolatey"
            choco install wixtoolset --version=3.14.1 -y --no-progress
            "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "WiX found: $((Get-Command candle.exe).Source)"
          }
      - name: desktop tests (incl. DPAPI secret-not-plaintext)
        if: runner.os == 'Windows'
        working-directory: app
        run: .\gradlew.bat :shared:desktopTest :desktopApp:test
      # WIN07 — the desktop tests must unpack Skiko under each module's build dir, never the shared per-user ~/.skiko
      # (two concurrent test JVMs racing that one folder is what reddened Windows twice on 2026-11-02). Ask the test
      # JVM for its user.home (Skiko's default root), assert no .skiko there, and list what each build's skiko/ holds.
      - name: WIN07 — no Skiko under the JVM's home (per-task unpack dir)
        if: always() && runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $props = (& java -XshowSettings:properties -version 2>&1 | Out-String)
          $m = [regex]::Match($props, 'user\.home = (.+)')
          $jvmHome = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "" }
          Write-Host "JVM user.home = [$jvmHome]   USERPROFILE = [$env:USERPROFILE]"
          foreach ($h in @($jvmHome, $env:USERPROFILE) | Where-Object { $_ } | Select-Object -Unique) {
            $skiko = Join-Path $h ".skiko"
            if (Test-Path $skiko) {
              Write-Host "::error::WIN07: Skiko unpacked into the shared $skiko — a desktop test task is missing skiko.data.path"
              Get-ChildItem -Force -Recurse -Depth 1 $skiko | Format-Table -AutoSize | Out-String | Write-Host
              exit 1
            }
          }
          Write-Host "OK - no .skiko under the JVM user.home or USERPROFILE"
          foreach ($d in @("shared\build\skiko", "desktopApp\build\skiko")) {
            Write-Host "## $d"
            if (Test-Path $d) { Get-ChildItem -Recurse -Depth 1 $d | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host }
            else { Write-Host "  (absent - the task did not run, or unpacked elsewhere)" }
          }
      - name: package the per-user MSI (version 1.0.<run_number>)
        if: runner.os == 'Windows'
        working-directory: app
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.8: licencewrongversion / licencenofile break swtLicences; empty on push/PR
        # createDistributable leaves the app-image (the exe the smoke runs) on disk; packageMsi wraps it.
        run: .\gradlew.bat :desktopApp:createDistributable :desktopApp:packageMsi "-PdesktopVersion=1.0.${{ github.run_number }}"
      - name: keep the artifact MSI aside (before building n+1)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $msi = Get-ChildItem desktopApp\build\compose\binaries\main\msi\*.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "no MSI was produced"; exit 1 }
          Copy-Item $msi.FullName "troubastage-1.0.${{ github.run_number }}.msi"
          Write-Host "artifact MSI: $($msi.Name)"
      - name: launch smoke — the packaged app performs the demo concert in Stage (WIN03 acceptance 1)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "no TroubaStage.exe under binaries; tree:"
            Get-ChildItem -Recurse desktopApp\build\compose\binaries -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            Write-Error "packaged exe not found"; exit 1
          }
          Write-Host "exe: $($exe.FullName)"
          # The demo concert is imported through the app's own import path into a throwaway data root, then shown in
          # Stage; the smoke writes smoke-1920x1080.png and smoke-800x600.png and exits 0 only once the real window drew.
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "smoke-home"
          $concert = (Resolve-Path ..\docs\demo\demo-concert.tstage).Path
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--smoke", "smoke.png", "--smoke-concert", "`"$concert`"") -PassThru -WorkingDirectory (Get-Location)
          if (-not $p.WaitForExit(150000)) { $p.Kill(); Write-Error "smoke hung (>150s)"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "smoke exited with $($p.ExitCode)"; exit 1 }
          foreach ($png in @("smoke-1920x1080.png", "smoke-800x600.png")) {
            if (-not ((Test-Path $png) -and ((Get-Item $png).Length -gt 0))) { Write-Error "smoke wrote no $png"; exit 1 }
            Write-Host "smoke OK — $png $((Get-Item $png).Length) bytes"
          }
      # WIN08 S2.4 — links by origin: a captured link to the server's origin opens in place (and the main browser ends
      # on it); another http(s) origin opens in the default browser (a recording stub) WITHOUT the session; non-http(s)
      # schemes (search-ms:, file:) are dropped; no in-app window opens (top-level WebView2 window count stays 0). This
      # runs BEFORE the embedded-smoke step so that under the noblock sabotage — which reds the smoke's new-window check
      # too — the links no-new-window red surfaces here. Sabotages (win08_sabotage): nolinkfilter → bad-scheme-dropped;
      # linksalwaysinplace → other-origin-to-default-browser; linksalwaysexternal / linksnoplaceload → same-origin-in-place;
      # noblock → links-no-new-window.
      - name: WIN08 — links by origin (S2.4)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.3: empty on push/PR; set for a measurement spike
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-links-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-links-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-links", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (links) ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "win08-links hung (>120s)"; exit 1 }
          Write-Host "win08-links exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "win08-links checks failed"; exit 1 }
          Write-Host "WIN08 S2.4: links route by origin; off-origin to the default browser without the session"
      # WIN08 — embedded Studio (WebView2 via SWT.EDGE). The packaged app opens its Studio screen against a loopback
      # test page inside the real TroubaStage window and checks: engine is Edge; the browser's top window is the
      # frame (GA_ROOT); the seeded cookie arrives; the bridge round-trips; off-origin nav is vetoed; the data dir is
      # under the data root and ~/.swt is absent; DPI awareness + shell-rect==canvas-rect at 100%. Then it exits and
      # no msedgewebview2.exe is left. The per-line win08.log is echoed (a packaged GUI app has no captured stdout).
      - name: WIN08 — embedded Studio smoke
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.3: empty on push/PR; set for a measurement spike
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-smoke", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(150000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          # Check 7's no-survivor half: orphaned msedgewebview2 children self-reap a few seconds after the WebView2 env
          # closes, so poll to 0 (up to 20s) rather than reading once — reading immediately is a timing flake (the spike
          # already polls this way). The PROCESS-exit half is $exited/$p.ExitCode above.
          $sv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue)
          for ($i = 0; $i -lt 20 -and $sv.Count -ne 0; $i++) { Start-Sleep -Seconds 1; $sv = @(Get-Process msedgewebview2 -ErrorAction SilentlyContinue) }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "win08-smoke hung (>150s)"; exit 1 }
          Write-Host "win08-smoke exit $($p.ExitCode); msedgewebview2 survivors=$($sv.Count)"
          if ($p.ExitCode -ne 0) { Write-Error "win08-smoke checks failed"; exit 1 }
          if ($sv.Count -ne 0) { Write-Error "WIN08 check 7: $($sv.Count) msedgewebview2 survivor(s) held the data dir"; exit 1 }
          Write-Host "WIN08 smoke: all checks passed; process exited; no survivor"
      - name: upload WIN08 styled ⋮ menu PNG (S2.7)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: win08-menu-styled
          path: app/win08-out/menu-*.png
          if-no-files-found: ignore
      - name: WIN08 — forced no-WebView2 shows the message (S1.6)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          TROUBA_WIN08_FORCE_NO_WEBVIEW: "1"
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-noengine-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-noengine-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-smoke", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(60000)
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (no-engine) ----"; Get-Content $log.FullName | Write-Host }
          if (-not $exited) { $p.Kill(); Write-Error "S1.6 smoke hung"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "S1.6 checks failed"; exit 1 }
          Write-Host "WIN08 S1.6: forced no-WebView2 shows the message, no Browser, no IE fallback"
      # WIN08 S2.3 — the sign-out reopen cookie clear: a persistent cookie is set, Studio closes, the clear is requested
      # with no live Browser (a pending-clear file), and the reopen (signed out) applies it before loading, so the reopen
      # request carries no old session. The nopending sabotage reds pending-clear-applied-on-reopen (proving it has teeth).
      - name: WIN08 — sign-out reopen cookie clear (S2.3)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.3: empty on push/PR; set for a measurement spike
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-cookieclear-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-cookieclear-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-cookieclear", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(120000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (cookieclear) ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "win08-cookieclear hung (>120s)"; exit 1 }
          Write-Host "win08-cookieclear exit $($p.ExitCode)"
