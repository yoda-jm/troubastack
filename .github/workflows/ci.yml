          Write-Host "WIN08 S2.3: sign-out reopen carries no old session"
      # WIN08 S2.3b — the ⋮ "Server URL…" re-point: the in-canvas dialog's TextField takes keystrokes with the SwingPanel
      # at 0.dp, and re-pointing to a second loopback origin keeps the new session and applies the re-point's pending clear.
      # Two guards, each a deterministic red via win08_sabotage: clearafterseed reds survives-repoint (the clear must run
      # BEFORE the new seed); repointnowrite reds repoint-applies-pending (the re-point must WRITE the pending record for
      # the new controller to apply — repointnowrite does not touch cookieclear's own clearCookies path, so cookieclear
      # stays green under it). nopending reds cookieclear above (so this step is skipped under nopending, which is fine).
      - name: WIN08 — Server URL re-point (S2.3b)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.3: empty on push/PR; set for a measurement spike
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-serverurl-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-serverurl-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-serverurl", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(170000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (serverurl) ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "win08-serverurl hung (>170s)"; exit 1 }
          Write-Host "win08-serverurl exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "win08-serverurl checks failed"; exit 1 }
          Write-Host "WIN08 S2.3b: Server URL dialog focuses, re-point keeps the new session and applies the pending clear"
      # WIN08 S2.5 — downloads: run Studio's real saveBlob against the loopback /pdf (cookie-gated, non-ASCII
      # Content-Disposition). The file must land in the person's Downloads (SHGetKnownFolderPath) with that exact name
      # and a SHA-256 matching the served bytes; a panel PNG is captured. Sabotage catchdownload (win08_sabotage) cancels
      # the <a download> click → the file never lands → download-saves-to-downloads reds.
      - name: WIN08 — downloads (S2.5)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}   # S2.3: empty on push/PR; set for a measurement spike
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-download-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-download-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-download", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(150000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (download) ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
