      - name: upload WIN08 download panel PNG (S2.5)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: win08-download-panel
          path: app/win08-download-out/download-panel.png
          if-no-files-found: ignore
      # WIN09 — the band QR in the Windows app: the TroubaStudio screen (the app's own Browse, signed in) against a loopback
      # fake core. Checks: the ⋮ "Show band QR…" item is absent for a non-admin and present for an admin; choosing it
      # dismisses the menu; the QR in a window capture decodes (ZXing) to the standing link the core served; opening the
      # screen creates nothing (the counter's positive control is the app's own create call); keep-awake is held while
      # the QR shows and released after Back (powercfg /requests' DISPLAY list, else UNMEASURED); the overlay takes the
      # focus from a focused Browser and a real Alt+← closes it without walking Studio's history; Back leaves the same
      # controller on the same page with the panel full size and the focus back in Studio; "Manage / revoke in Studio"
      # loads the band's settings in that same Browser. A dispatch with win09_sabotage=all then also runs the smoke once
      # per sabotage, each in a fresh data root, and asserts each one reds its own check(s) while the others stay green.
      - name: WIN09 — band QR (--win09-qr)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN09_SABOTAGE_RUN: ${{ github.event.inputs.win09_sabotage }}   # empty on push/PR; "all" for the sabotage run
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $allChecks = @("item-absent-for-non-admin", "item-present-for-admin", "menu-dismissed-on-open", "qr-decodes-to-served-link",
            "keep-awake-while-shown", "back-returns-where-it-was", "focus-returns-to-studio", "overlay-takes-focus",
            "manage-opens-settings-in-place", "no-create-on-open", "unsuitable-link-not-shown", "create-counter-control",
            "item-stays-on-failed-refresh", "item-follows-roles")
          function Invoke-Win09([string]$sab, [bool]$fullLog) {
            $tag = if ($sab) { $sab } else { "normal" }
            $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win09-home-$tag"
            Remove-Item -Recurse -Force $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
            $env:WIN09_SABOTAGE = $sab
            $out = Join-Path (Get-Location) "win09-out-$tag"
            $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win09-qr", $out) -PassThru -WorkingDirectory (Get-Location)
            $exited = $p.WaitForExit(220000)
            if (-not $exited) { $p.Kill() }
            Start-Sleep -Seconds 2
            Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            $env:WIN09_SABOTAGE = ""
            $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
            $lines = if ($log) { @(Get-Content $log.FullName) } else { @() }
            if ($fullLog) { Write-Host "---- win08.log (win09-qr $tag) ----"; $lines | Write-Host }
            Write-Host "---- WIN09 $tag ----"
            $lines | Where-Object { $_ -match "WIN09-CHECK|win09-qr:" } | Write-Host
            $verdicts = @{}
            foreach ($l in $lines) { if ($l -match "WIN09-CHECK (\S+): (PASS|FAIL|UNMEASURED)") { $verdicts[$Matches[1]] = $Matches[2] } }
            Write-Host "exited=$exited exit=$(if ($exited) { $p.ExitCode } else { 'killed' })"
            return @{ Exited = $exited; Code = $(if ($exited) { $p.ExitCode } else { -1 }); Verdicts = $verdicts }
          }
          $r = Invoke-Win09 "" $true
          if (-not $r.Exited) { Write-Error "win09-qr hung (>220s)"; exit 1 }
          $missing = @($allChecks | Where-Object { -not $r.Verdicts.ContainsKey($_) })
          $failed = @($r.Verdicts.Keys | Where-Object { $r.Verdicts[$_] -eq "FAIL" })
          $unmeasured = @($r.Verdicts.Keys | Where-Object { $r.Verdicts[$_] -eq "UNMEASURED" })
          if ($failed.Count -gt 0) { Write-Error "WIN09 checks failed: $($failed -join ', ')"; exit 1 }
          if ($missing.Count -gt 0) { Write-Error "WIN09 checks never reported: $($missing -join ', ')"; exit 1 }
          if ($r.Code -ne 0) { Write-Error "win09-qr exited $($r.Code)"; exit 1 }
          foreach ($u in $unmeasured) { Write-Host "::warning::WIN09 $u UNMEASURED on this runner (see its WIN09-CHECK line)" }
          Write-Host "WIN09: all $($allChecks.Count) checks reported; none failed; unmeasured: [$($unmeasured -join ', ')]"
          if ($env:WIN09_SABOTAGE_RUN -ne "all") { exit 0 }
          # The sabotage run: each value must red its own check(s) (target); "allowed" may red as a consequence; every
          # other check must stay PASS (keep-awake may be UNMEASURED if powercfg can't be read here).
          $plan = [ordered]@{
            "qrwrongtext"     = @{ Target = @("qr-decodes-to-served-link"); Allowed = @() }
            "qrblank"         = @{ Target = @("qr-decodes-to-served-link"); Allowed = @() }
            "createonopen"    = @{ Target = @("no-create-on-open"); Allowed = @() }
            "nokeepawake"     = @{ Target = @("keep-awake-while-shown"); Allowed = @() }
            "itemfornonadmin" = @{ Target = @("item-absent-for-non-admin"); Allowed = @("item-follows-roles") }   # its member half is a non-admin absence too
            "qrnofocus"       = @{ Target = @("overlay-takes-focus"); Allowed = @() }
            "qrnofocusback"   = @{ Target = @("focus-returns-to-studio"); Allowed = @() }
            "qrreplace"       = @{ Target = @("back-returns-where-it-was"); Allowed = @("focus-returns-to-studio", "overlay-takes-focus", "manage-opens-settings-in-place") }
            "norefresh"       = @{ Target = @("item-follows-roles"); Allowed = @() }
            "blankonfail"     = @{ Target = @("item-stays-on-failed-refresh"); Allowed = @() }
          }
          $bad = @()
          foreach ($sab in $plan.Keys) {
            $r = Invoke-Win09 $sab $false
            $want = $plan[$sab]
            $notRed = @($want.Target | Where-Object { $r.Verdicts[$_] -ne "FAIL" })
            $collateral = @($r.Verdicts.Keys | Where-Object { $r.Verdicts[$_] -eq "FAIL" -and $want.Target -notcontains $_ -and $want.Allowed -notcontains $_ })
            $missing = @($allChecks | Where-Object { -not $r.Verdicts.ContainsKey($_) })
            $verdict = if ($notRed.Count -eq 0 -and $collateral.Count -eq 0 -and $missing.Count -eq 0) { "OK" } else { "BAD" }
            Write-Host "SABOTAGE $sab -> $verdict (target not red: [$($notRed -join ', ')]; other reds: [$($collateral -join ', ')]; unreported: [$($missing -join ', ')])"
            if ($verdict -ne "OK") { $bad += $sab }
          }
          if ($bad.Count -gt 0) { Write-Error "WIN09 sabotages that did not red exactly their own check: $($bad -join ', ')"; exit 1 }
          Write-Host "WIN09: every sabotage reds its own check, and only that"
      - name: WIN09 — upload the band-QR captures
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: win09-qr-captures
          path: app/win09-out-*/*.png
          if-no-files-found: ignore
      # WIN08 S2.8 — SWT's licences inside the built MSI. Extract the artifact MSI with an administrative install, take
      # the SWT version from the jar INSIDE it (file name + MANIFEST Bundle-Version), and check: the six files are in
      # the image's resources/licences (sizes listed); SWT-NOTICE.txt names both versions; EPL-2.0.txt is the EPL; and
      # about.html + every about_files/ text are byte-identical to the jar's. Sabotages (win08_sabotage):
      # licencewrongversion → msi-notice-names-built-version; licencenofile → msi-licence-files.
      - name: WIN08 S2.8 — SWT's licences inside the MSI
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $msi = Get-ChildItem troubastage-1.0.*.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "no artifact MSI to extract"; exit 1 }
          $x = Join-Path $env:RUNNER_TEMP "msi-admin"
          if (Test-Path $x) { Remove-Item -Recurse -Force $x }
          $p = Start-Process msiexec.exe -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$x`"", "/l*v", "`"$env:RUNNER_TEMP\msi-admin.log`"") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi-admin.log" -Tail 40 | Write-Host; Write-Error "msiexec /a exited $($p.ExitCode)"; exit 1 }
          $jar = Get-ChildItem -Path $x -Recurse -Filter "org.eclipse.swt.win32.win32.x86_64-*.jar" | Select-Object -First 1
          if (-not $jar) { Write-Error "no SWT jar in the extracted MSI"; exit 1 }
          # The image renames jars with a content hash (…x86_64-3.134.0-<hex>.jar): the version is the part before it. A101:
          # the hash drops its leading zeros (20 to 32 hex digits measured), so 32 only matched by chance.
          $ver = [regex]::Match($jar.Name, 'x86_64-(\d+(?:\.\d+)*)(?:-[0-9a-f]{20,32})?\.jar$').Groups[1].Value
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
          function EntryBytes([string]$name) {
            $e = $zip.GetEntry($name); if (-not $e) { return $null }
            $st = $e.Open(); $ms = New-Object System.IO.MemoryStream; $st.CopyTo($ms); $st.Dispose(); return ,$ms.ToArray()
          }
          $mf = [System.Text.Encoding]::UTF8.GetString((EntryBytes "META-INF/MANIFEST.MF"))
          $bv = [regex]::Match($mf, '(?m)^Bundle-Version:\s*(\S+)').Groups[1].Value
          $lic = Join-Path $jar.Directory.FullName "resources\licences"
          Write-Host "SWT in the MSI: $($jar.Name) (version $ver, Bundle-Version $bv); licences expected at $lic"
          # A101 §4: SWT-about.txt (about.html as plain text) is the seventh file.
          $want = @("SWT-NOTICE.txt", "EPL-2.0.txt", "about.html", "SWT-about.txt", "about_files\WebView2_LICENSE.txt", "about_files\IJG_README", "about_files\mpl-v11.txt")
          $missing = @()
          foreach ($f in $want) {
            $path = Join-Path $lic $f
            if (Test-Path $path) { Write-Host ("  {0,-36} {1,8} bytes" -f $f, (Get-Item $path).Length) } else { Write-Host "  $f  MISSING"; $missing += $f }
          }
          $eplPath = Join-Path $lic "EPL-2.0.txt"
          $epl = (Test-Path $eplPath) -and ((Get-Content $eplPath -TotalCount 1) -eq "Eclipse Public License - v 2.0")
          $files = $missing.Count -eq 0 -and $epl
          Write-Host "S28-CHECK msi-licence-files: $(if ($files) { 'PASS' } else { 'FAIL' }) — missing=[$($missing -join ', ')] EPL heading=$epl"
          $noticePath = Join-Path $lic "SWT-NOTICE.txt"
          $notice = if (Test-Path $noticePath) { Get-Content $noticePath -Raw } else { "" }
          $bvBase = ($bv.Split('.') | Select-Object -First 3) -join '.'   # 3.134.0.v20260515-1429 → 3.134.0, the jar's own version
          $names = $ver -ne "" -and $ver -eq $bvBase -and ($notice -match "(?m)^\s*Version:\s*$([regex]::Escape($ver))\s*$") -and ($notice -match "(?m)^\s*Bundle-Version:\s*$([regex]::Escape($bv))\s*$")
          $nv = [regex]::Match($notice, '(?m)^\s*Version:\s*(\S+)').Groups[1].Value
          Write-Host "S28-CHECK msi-notice-names-built-version: $(if ($names) { 'PASS' } else { 'FAIL' }) — notice Version=[$nv], built jar $ver / $bv"
          $jarTexts = @($zip.Entries | Where-Object { $_.FullName -eq "about.html" -or ($_.FullName.StartsWith("about_files/") -and -not $_.FullName.EndsWith("/")) })
          $diff = @()
          foreach ($e in $jarTexts) {
            $path = Join-Path $lic ($e.FullName -replace '/', '\')
            $a = EntryBytes $e.FullName
            if (-not (Test-Path $path)) { $diff += "$($e.FullName) (absent)"; continue }
            $b = [System.IO.File]::ReadAllBytes($path)
            if ($a.Length -ne $b.Length -or -not [System.Linq.Enumerable]::SequenceEqual([byte[]]$a, [byte[]]$b)) { $diff += $e.FullName }
          }
          $zip.Dispose()
          $same = $diff.Count -eq 0 -and $jarTexts.Count -ge 4
          Write-Host "S28-CHECK msi-swt-notices-identical: $(if ($same) { 'PASS' } else { 'FAIL' }) — jar texts compared=$($jarTexts.Count): [$(($jarTexts | ForEach-Object FullName) -join ', ')]; differing=[$($diff -join ', ')]"
          if (-not ($files -and $names -and $same)) { Write-Error "S2.8: the MSI's licences are wrong (see the S28-CHECK lines)"; exit 1 }
          Write-Host "S2.8: SWT $ver's licences ship in the MSI, as built"
      # WIN08 S2.8 — the About smoke on the packaged image: the About line names the shipped notice's version, which is
      # the SWT jar's the app runs with; Licences → SWT shows the notice and the EPL. Runs even if the MSI check failed, so
      # a sabotage run reports both (licencewrongversion also reds about-line-shows-version; licencenofile also reds
      # licences-screen-shows-files).
      - name: WIN08 S2.8 — About shows the licences (--about-smoke)
        if: always() && runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "no packaged TroubaStage.exe"; exit 1 }
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "about-home"
          if (Test-Path $env:TROUBASTAGE_HOME) { Remove-Item -Recurse -Force $env:TROUBASTAGE_HOME }
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "about-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--about-smoke", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(180000)
          if (-not $exited) { $p.Kill() }
          $log = Join-Path $out "about-smoke.log"
          $lines = if (Test-Path $log) { @(Get-Content $log) } else { @() }
          Write-Host "---- about-smoke.log ----"; $lines | Write-Host
          if (-not $exited) { Write-Error "about-smoke hung (>180s)"; exit 1 }
          $bad = @("about-line-shows-version", "licences-screen-shows-files") | Where-Object { $n = $_; -not ($lines | Where-Object { $_ -match "S28-CHECK $n`: PASS" }) }
          if ($bad.Count -gt 0 -or $p.ExitCode -ne 0) { Write-Error "S2.8 About checks not passing: [$($bad -join ', ')] (exit $($p.ExitCode))"; exit 1 }
          Write-Host "S2.8: About names SWT's version and opens its licences"
      # A101 — the notices inside the MSI (its admin extract, as S2.8's step made it), checked independently of the
      # generator: every resolved component listed at its version, every jar in the image listed, every NOTICE shipped,
      # every native mapped (SWT's DLLs to SWT's own entry, the runtime's and the launcher to the Java runtime).
      - name: A101 — the notices inside the MSI (coverage, notices, natives)
        if: always() && runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "a101"
          if (Test-Path $t) { Remove-Item -Recurse -Force $t }
          New-Item -ItemType Directory -Force -Path $t | Out-Null
          $msi = Get-ChildItem troubastage-1.0.*.msi | Select-Object -First 1
          if (-not $msi) { Write-Error "no artifact MSI"; exit 1 }
          $x = Join-Path $env:RUNNER_TEMP "msi-admin"
          if (-not (Test-Path $x)) {
            $p = Start-Process msiexec.exe -ArgumentList @("/a", "`"$($msi.FullName)`"", "/qn", "TARGETDIR=`"$x`"") -Wait -PassThru
            if ($p.ExitCode -ne 0) { Write-Error "msiexec /a exited $($p.ExitCode)"; exit 1 }
          }
          $index = Get-ChildItem -Path $x -Recurse -Filter index.txt | Where-Object { $_.FullName -match '\\app\\resources\\notices\\index\.txt$' } | Select-Object -First 1
          if (-not $index) { Write-Error "no notices index in the MSI"; exit 1 }
          $notices = $index.Directory.FullName
          $appDir = $index.Directory.Parent.Parent.FullName
          $root = $index.Directory.Parent.Parent.Parent.FullName
          ./gradlew -q :desktopApp:dependencies --configuration runtimeClasspath | Out-File -Encoding utf8 (Join-Path $t "report.txt")
          ./gradlew -q --no-configuration-cache -I licences/ci/artifact-paths.init.gradle.kts "-Da101.out=$t\artifacts.tsv" :desktopApp:a101ArtifactPaths
          python licences/ci/check-notices.py --name msi --report (Join-Path $t "report.txt") --artifacts (Join-Path $t "artifacts.tsv") `
            --notices $notices --spdx licences/spdx --manifest licences/native/manifest.txt --image-jars $appDir --image-root $root `
            --swt-licences (Join-Path $appDir "resources\licences")
          $code = $LASTEXITCODE
          Write-Host "MSI: $($msi.Length) bytes"
          exit $code
      # A101 — the same --about-smoke run (S2.8's step above) also opens Ktor and the Java runtime entry, then every entry
      # to time it. S2.8's two checks are that step's; these are A101's.
      - name: A101 — About lists the notices (Windows, from that --about-smoke run)
        if: always() && runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $log = Join-Path (Get-Location) "about-out\about-smoke.log"
          $lines = if (Test-Path $log) { @(Get-Content $log) } else { @() }
          $lines | Where-Object { $_ -match '^(A101-CHECK|A101-TIME|S28-CHECK)' } | Write-Host
          $bad = @("about-ktor-entry", "about-java-runtime-entry") | Where-Object { $n = $_; -not ($lines | Where-Object { $_ -match "A101-CHECK $n`: PASS" }) }
          if ($bad.Count -gt 0) { Write-Error "A101 About checks not passing: [$($bad -join ', ')]"; exit 1 }
          Write-Host "A101: About lists the notices and opens Ktor and the Java runtime"
      - name: WIN08 S2.8 — upload the About captures
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: s28-about-captures
          path: app/about-out/*.png
          if-no-files-found: ignore
      # WIN08 S2.6 — right-click (R3): a host contextmenu listener suppresses the page menu on a non-editable target
      # (the chart, and any non-text input) but keeps WebView2's native edit menu on a text input/textarea/contenteditable,
      # and leaves a Studio-handled right-click (defaultPrevented) alone. Sabotages (win08_sabotage): ctxnosuppress reds
      # the suppress checks, ctxalwayssuppress reds ctx-editable-kept, ctxcapture reds ctx-studio-untouched, ctxanyinput
      # (old any-input rule) reds only ctx-noninput-suppressed.
      - name: WIN08 — right-click menu (S2.6)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        env:
          WIN08_SABOTAGE: ${{ github.event.inputs.win08_sabotage }}
        run: |
          $exe = Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe | Select-Object -First 1
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "win08-ctx-home"
          New-Item -ItemType Directory -Force -Path $env:TROUBASTAGE_HOME | Out-Null
          $out = Join-Path (Get-Location) "win08-ctx-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @("--win08-contextmenu", $out) -PassThru -WorkingDirectory (Get-Location)
          $exited = $p.WaitForExit(150000)
          if (-not $exited) { $p.Kill() }
          Start-Sleep -Seconds 2
          $log = Get-ChildItem -Recurse -Filter win08.log $env:TROUBASTAGE_HOME -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Write-Host "---- win08.log (contextmenu) ----"; Get-Content $log.FullName | Write-Host } else { Write-Host "::warning::no win08.log" }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          if (-not $exited) { Write-Error "win08-contextmenu hung (>150s)"; exit 1 }
          Write-Host "win08-contextmenu exit $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "win08-contextmenu checks failed"; exit 1 }
          Write-Host "WIN08 S2.6: chart + non-text inputs suppressed, text-field edit menu kept, Studio-handled untouched"
      - name: upload WIN08 context-menu PNGs (S2.6)
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: win08-contextmenu
          path: app/win08-ctx-out/*.png
          if-no-files-found: ignore
      - name: secret store cost — DPAPI get/put p50/p95 (F2)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $exe = (Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "packaged exe not found for --bench"; exit 1 }
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "bench-store"  # isolated store, real DPAPI
          $p = Start-Process -FilePath $exe -ArgumentList @("--bench", "bench.txt") -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "bench exited $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path bench.txt)) { Write-Error "bench wrote no report"; exit 1 }
          Get-Content bench.txt | Write-Host   # p50/p95 land in the job log (and the artifact)
      - name: prove upgrade-in-place (one entry at n, upgrade to n+1, data survives, install disjoint from data)
        if: runner.os == 'Windows'
        working-directory: app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # WIN04 (H1): the data root's folder name holds a space, &, (, ) and %, so the update helper's paths are tested
          # with every character cmd could misread. The installed app and its helper inherit it.
          $env:TROUBASTAGE_HOME = Join-Path $env:RUNNER_TEMP "TS data & (x) 100%"
          $n   = "1.0.${{ github.run_number }}"
          $n1  = "1.0.$([int]${{ github.run_number }} + 1)"
          # F2.3 nit — the data root comes FROM THE APP (--print-data-root), not a hard-coded folder name, so CI
          # follows resolveDataRoot automatically. A GUI app's stdout is not captured, so it writes to a file.
          $exe = (Get-ChildItem -Path desktopApp\build\compose\binaries -Recurse -Filter TroubaStage.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $exe) { Write-Error "packaged exe not found for --print-data-root"; exit 1 }
          $drFile = "$env:RUNNER_TEMP\dataroot.txt"
          $pr = Start-Process -FilePath $exe -ArgumentList @("--print-data-root", $drFile) -Wait -PassThru
          if ($pr.ExitCode -ne 0 -or -not (Test-Path $drFile)) { Write-Error "--print-data-root failed (exit $($pr.ExitCode))"; exit 1 }
          $dataRoot = (Get-Content $drFile -Raw).Trim()
          if (-not $dataRoot) { Write-Error "--print-data-root returned empty"; exit 1 }
          function Entries { @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          ) | ForEach-Object { Get-ItemProperty $_ -ErrorAction SilentlyContinue } |
              Where-Object { $_.DisplayName -eq "TroubaStage" } }

          # B3: install n, CHECK the exit code (/qn hides failures), then assert EXACTLY ONE entry at n BEFORE
          # n+1 — otherwise a silent install-n failure + a working n+1 would fake an "upgrade" with one entry.
          $msiN = (Get-ChildItem desktopApp\build\compose\binaries\main\msi\*.msi | Select-Object -First 1).FullName
          $p1 = Start-Process msiexec.exe -ArgumentList @("/i","`"$msiN`"","/qn","/norestart","/l*v","$env:RUNNER_TEMP\msi-n.log") -Wait -PassThru
          if ($p1.ExitCode -ne 0) { Write-Error "install n (msiexec) failed: exit $($p1.ExitCode)"; exit 1 }
          $afterN = @(Entries)
          Write-Host "after n: $($afterN.Count) entr(y/ies) at [$($afterN.DisplayVersion -join ', ')]"
          if ($afterN.Count -ne 1 -or $afterN[0].DisplayVersion -ne $n) { Write-Error "n did not install as ONE entry at $n"; exit 1 }

          # B2: InstallLocation must be DISJOINT from the data root (a data root inside the install dir is wiped
          # on upgrade). Print both, assert neither contains the other, then prove a data-root marker survives.
          $install = $afterN[0].InstallLocation
          Write-Host "InstallLocation = [$install]   dataRoot = [$dataRoot]"
          # F2.3 nit — an empty InstallLocation must be an ERROR, not a silently skipped disjoint check.
          if (-not $install) { Write-Error "InstallLocation is empty — cannot verify it is disjoint from the data root"; exit 1 }
          $i = $install.TrimEnd('\'); $d = $dataRoot.TrimEnd('\')
          if ($d -eq $i -or $d.StartsWith("$i\") -or $i.StartsWith("$d\")) { Write-Error "data root and install dir are NOT disjoint"; exit 1 }
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $marker = Join-Path $dataRoot "marker.txt"; "keep me" | Set-Content $marker

          # WIN04 — n → n+1 through the APP's own update path (the Update button's code, driven by --update-now), not msiexec.
          # A local release on 127.0.0.1 offers the n+1 MSI; the installed n checks, downloads, verifies the SHA-256, hands
          # off to its helper and exits; the helper installs n+1 and reopens it, which records last-update.txt.
          .\gradlew.bat :desktopApp:packageMsi "-PdesktopVersion=$n1"
          $msiN1 = (Get-ChildItem desktopApp\build\compose\binaries\main\msi\*.msi | Sort-Object LastWriteTime | Select-Object -Last 1).FullName
          $sha = (Get-FileHash -Algorithm SHA256 $msiN1).Hash.ToLower()
          $size = (Get-Item $msiN1).Length
          # A broken installer whose digest MATCHES what the release says: it passes verification and msiexec fails on it.
          $brokenMsi = Join-Path $env:RUNNER_TEMP "broken.msi"
          [IO.File]::WriteAllBytes($brokenMsi, [byte[]](@(7) * 4096))
          $brokenSha = (Get-FileHash -Algorithm SHA256 $brokenMsi).Hash.ToLower()
          $brokenSize = (Get-Item $brokenMsi).Length
          $port = 18765
          $modeFile = Join-Path $env:RUNNER_TEMP "release-mode.txt"
          "bad" | Set-Content $modeFile
          $server = Start-Job -ScriptBlock {
            param($port, $msi, $sha, $size, $brokenMsi, $brokenSha, $brokenSize, $modeFile)
            $l = [System.Net.HttpListener]::new(); $l.Prefixes.Add("http://127.0.0.1:$port/"); $l.Start()
            while ($true) {
              $ctx = $l.GetContext(); $res = $ctx.Response
              switch ($ctx.Request.Url.AbsolutePath) {
                "/release.json" {
                  $mode = (Get-Content $modeFile -Raw).Trim()
                  $digest = switch ($mode) { "bad" { "sha256:" + ("0" * 64) } "broken" { "sha256:$brokenSha" } default { "sha256:$sha" } }
                  $assetSize = if ($mode -eq "broken") { $brokenSize } else { $size }
                  $json = @{ target_commitish = ("f" * 40); published_at = (Get-Date).ToUniversalTime().AddHours(1).ToString("yyyy-MM-ddTHH:mm:ssZ"); body = "";
                    assets = @(@{ name = "troubastage-windows.msi"; size = $assetSize; digest = $digest; browser_download_url = "http://127.0.0.1:$port/troubastage-windows.msi" }) } | ConvertTo-Json -Depth 5
                  $b = [Text.Encoding]::UTF8.GetBytes($json); $res.ContentType = "application/json"; $res.OutputStream.Write($b, 0, $b.Length)
                }
                "/troubastage-windows.msi" {
                  $file = if ((Get-Content $modeFile -Raw).Trim() -eq "broken") { $brokenMsi } else { $msi }
                  $b = [IO.File]::ReadAllBytes($file); $res.ContentLength64 = $b.Length; $res.OutputStream.Write($b, 0, $b.Length)
                }
                default { $res.StatusCode = 404 }
              }
              $res.Close()
            }
          } -ArgumentList $port, $msiN1, $sha, $size, $brokenMsi, $brokenSha, $brokenSize, $modeFile
          Start-Sleep -Seconds 3
          $installedExe = Join-Path $install "TroubaStage.exe"
          if (-not (Test-Path $installedExe)) { Write-Error "installed exe not found at $installedExe"; exit 1 }
          $release = "http://127.0.0.1:$port/release.json"
          $updDir = Join-Path $dataRoot "tmp\app-update"

          # C2 — the negative pass first: a wrong SHA-256. The app must refuse (exit 4), msiexec must never run, n stays alone.
          # WaitForExit, not -Wait: -Wait waits for the whole process tree, and on the good pass the tree includes the
          # helper and the reopened app (which never exits). Only the app's own exit is awaited, with a cap.
          $bad = Start-Process -FilePath $installedExe -ArgumentList @("--update-from", $release, "--update-now") -PassThru
          if (-not $bad.WaitForExit(120000)) { Write-Error "the app did not exit on the wrong-digest pass (>120 s)"; exit 1 }
          Write-Host "wrong-digest pass: exit $($bad.ExitCode)"
          if ($bad.ExitCode -ne 4) {
            $ulog = Join-Path $dataRoot "update-now.log"
            if (Test-Path $ulog) { Write-Host "---- update-now.log ----"; Get-Content $ulog | Write-Host } else { Write-Host "::warning::no update-now.log at $ulog" }
            Write-Error "the app did not refuse a wrong SHA-256 (exit $($bad.ExitCode), expected 4)"; exit 1
          }
          if ((Test-Path (Join-Path $updDir "msiexec.log")) -or (Test-Path (Join-Path $updDir "result.txt"))) { Write-Error "msiexec ran on a refused update"; exit 1 }
          $stillN = @(Entries)
          if ($stillN.Count -ne 1 -or $stillN[0].DisplayVersion -ne $n) { Write-Error "after the refused update: expected ONE entry at $n"; exit 1 }
          if (-not (Test-Path $marker)) { Write-Error "data-root marker lost on a refused update"; exit 1 }
          Write-Host "wrong-digest pass OK: refused, no msiexec, one entry at $n, data intact"

          # 5a403976 — a broken installer whose digest matches: it is handed off, msiexec FAILS, and the helper reopens
          # the UNCHANGED n, which records the failure. n stays alone and the data survives.
          "broken" | Set-Content $modeFile
          $lastUpdate = Join-Path $dataRoot "last-update.txt"
          Remove-Item $lastUpdate -ErrorAction SilentlyContinue
          $brk = Start-Process -FilePath $installedExe -ArgumentList @("--update-from", $release, "--update-now") -PassThru
          if (-not $brk.WaitForExit(120000)) { Write-Error "the app did not exit on the broken-MSI pass (>120 s)"; exit 1 }
          Write-Host "broken-MSI pass: exit $($brk.ExitCode)"
          if ($brk.ExitCode -ne 0) {
            $ulog = Join-Path $dataRoot "update-now.log"; if (Test-Path $ulog) { Write-Host "---- update-now.log (broken pass) ----"; Get-Content $ulog | Write-Host }
            Write-Error "the app did not hand off the broken MSI (exit $($brk.ExitCode))"; exit 1
          }
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $lastUpdate) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          if (-not (Test-Path (Join-Path $updDir "msiexec.log"))) { Write-Error "msiexec did not run on the broken MSI"; exit 1 }
          if (-not (Test-Path $lastUpdate)) { Write-Error "no last-update.txt: the unchanged app was not reopened after the failed install"; exit 1 }
          $luBroken = Get-Content $lastUpdate -Raw
          Write-Host "last-update.txt (broken MSI):`n$luBroken"
          $reopened = @(Get-Process -Name TroubaStage -ErrorAction SilentlyContinue)
          Write-Host "TroubaStage processes after the failed install: $($reopened.Count)"
          $reopened | Stop-Process -Force
          if ($luBroken -notmatch "result=failed") { Write-Error "the reopened app did not record the failed install"; exit 1 }
          $afterBroken = @(Entries)
          if ($afterBroken.Count -ne 1 -or $afterBroken[0].DisplayVersion -ne $n) { Write-Error "after the failed install: expected ONE entry at $n"; exit 1 }
          if (-not (Test-Path $marker)) { Write-Error "data-root marker lost on a failed install"; exit 1 }
          Write-Host "broken-MSI pass OK: msiexec failed, the unchanged app reopened and recorded it, one entry at $n, data intact"

          # The good release: the same path, through to the helper, msiexec and the reopen.
          "good" | Set-Content $modeFile
          Remove-Item $lastUpdate -ErrorAction SilentlyContinue
          $good = Start-Process -FilePath $installedExe -ArgumentList @("--update-from", $release, "--update-now") -PassThru
          if (-not $good.WaitForExit(120000)) { Write-Error "the app did not exit after handing off (>120 s)"; exit 1 }
          Write-Host "good pass: exit $($good.ExitCode)"
          if ($good.ExitCode -ne 0) {
            $ulog = Join-Path $dataRoot "update-now.log"; if (Test-Path $ulog) { Write-Host "---- update-now.log (good pass) ----"; Get-Content $ulog | Write-Host }
            Write-Error "the app did not hand off the update (exit $($good.ExitCode))"; exit 1
          }
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Path $lastUpdate) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 3 }
          Get-ChildItem $updDir -ErrorAction SilentlyContinue | Format-Table Name, Length | Out-String | Write-Host
          if (Test-Path (Join-Path $updDir "script.log")) { Get-Content (Join-Path $updDir "script.log") | Write-Host }
          if (-not (Test-Path $lastUpdate)) { Write-Error "no last-update.txt: the helper did not install and reopen n+1 within 240 s"; exit 1 }
          $lu = Get-Content $lastUpdate -Raw
          Write-Host "last-update.txt:`n$lu"
          Get-Process -Name TroubaStage -ErrorAction SilentlyContinue | Stop-Process -Force   # the reopened n+1 (CI runner)
          Stop-Job $server; Remove-Job $server -Force
          if ($lu -notmatch "result=success") { Write-Error "the reopened app did not record a successful update"; exit 1 }

          $afterUpg = @(Entries)
          $afterUpg | Select-Object DisplayName, DisplayVersion, InstallLocation | Format-Table | Out-String | Write-Host
          if ($afterUpg.Count -ne 1) { Write-Error "expected ONE TroubaStage entry after upgrade, found $($afterUpg.Count)"; exit 1 }
          if ($afterUpg[0].DisplayVersion -ne $n1) { Write-Error "upgraded entry is $($afterUpg[0].DisplayVersion), expected $n1"; exit 1 }
          if (-not (Test-Path $marker)) { Write-Error "data-root marker did NOT survive the upgrade (data root ~ install dir?)"; exit 1 }
          Write-Host "upgrade-in-place proven THROUGH THE APP: refused a wrong digest; a broken MSI failed and reopened n; then one entry at $n1, reopened ($($lu -replace "`n", ' | ')); data-root marker survived; install dir disjoint from data root"
      - name: upload MSI + smoke PNG
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: troubastage-windows-msi
          path: |
            app/troubastage-*.msi
            app/smoke-*.png
            app/bench.txt
      # ---- Linux (DESK01 D2): the app image, wrapped as one AppImage, smoked under Xvfb ----
      - name: desktop tests (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        run: ./gradlew :shared:desktopTest :desktopApp:test
      # WIN07 — same guard as the Windows leg. On Unix the JVM may resolve user.home from the passwd entry, not $HOME,
      # so ask the JVM where its home is rather than trust $HOME; check both to be safe.
      - name: WIN07 — no Skiko under the JVM's home (per-task unpack dir)
        if: always() && runner.os == 'Linux'
        working-directory: app
        shell: bash
        run: |
          set -uo pipefail
          jvm_home="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*user\.home = //p')"
          echo "JVM user.home = [$jvm_home]   \$HOME = [${HOME:-}]"
          rc=0
          for h in "$jvm_home" "${HOME:-}"; do
            [ -n "$h" ] || continue
            if [ -e "$h/.skiko" ]; then
              echo "::error::WIN07: Skiko unpacked into the shared $h/.skiko — a desktop test task is missing skiko.data.path"
              ls -la "$h/.skiko" || true
              rc=1
            fi
          done
          [ "$rc" = 0 ] || exit 1
          echo "OK - no .skiko under the JVM user.home or \$HOME"
          for d in shared/build/skiko desktopApp/build/skiko; do
            echo "## $d"
            if [ -d "$d" ]; then find "$d" -maxdepth 2 -print; else echo "  (absent - the task did not run, or unpacked elsewhere)"; fi
          done
      - name: package the Linux app image (version 1.0.<run_number>)
        if: runner.os == 'Linux'
        working-directory: app
        run: ./gradlew :desktopApp:createDistributable "-PdesktopVersion=1.0.${{ github.run_number }}"
      - name: WIN08 — no SWT jar in the Linux app image (SWT is a Windows-host-only dependency)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          set -uo pipefail
          root="desktopApp/build/compose/binaries/main/app/TroubaStage"
          hits="$(find "$root" -iname '*swt*.jar' 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "::error::WIN08: an SWT jar reached the Linux app image:"; echo "$hits"; exit 1; fi
          echo "WIN08: no SWT jar in the Linux app image ($(find "$root" -name '*.jar' | wc -l) jars, none SWT)"
      - name: WIN08 S2.8 — no SWT licences in the Linux app image (they ship with SWT, on Windows only)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          set -uo pipefail
          root="desktopApp/build/compose/binaries/main/app/TroubaStage"
          hits="$(find "$root" \( -name 'SWT-NOTICE.txt' -o -name 'EPL-2.0.txt' -o -type d -name licences \) 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "::error::S2.8: SWT's licences reached the Linux app image:"; echo "$hits"; exit 1; fi
          echo "S2.8: no SWT licences in the Linux app image"
      - name: wrap it as one AppImage (appimagetool 1.9.1 + type2-runtime 20251108, pinned by sha256)
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/appimage-tools"; mkdir -p "$tools"
          curl -fsSL -o "$tools/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSL -o "$tools/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $tools/appimagetool" | sha256sum -c -
          echo "2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $tools/runtime-x86_64" | sha256sum -c -
          chmod +x "$tools/appimagetool"
          desktopApp/packaging/linux/make-appimage.sh desktopApp/build/compose/binaries/main/app/TroubaStage \
            "$PWD/troubastage-linux-x86_64.AppImage" "$tools/appimagetool" "$tools/runtime-x86_64"
      - name: launch smoke — the AppImage performs the demo concert in Stage, under Xvfb
        if: runner.os == 'Linux'
        working-directory: app
        run: |
          set -euo pipefail
          command -v xvfb-run >/dev/null || { sudo apt-get update -q; sudo apt-get install -y -q xvfb; }
          # The AppImage mounts itself with FUSE; a machine without it can still extract-and-run (said in the log).
          if [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; then echo "running the AppImage through FUSE"
          else echo "::warning::no FUSE on this runner — extract-and-run"; export APPIMAGE_EXTRACT_AND_RUN=1; fi
          export TROUBASTAGE_HOME="$RUNNER_TEMP/smoke-home"
          timeout 150 xvfb-run -a -s "-screen 0 1920x1080x24" ./troubastage-linux-x86_64.AppImage \
            --smoke smoke.png --smoke-concert "$GITHUB_WORKSPACE/docs/demo/demo-concert.tstage"
          for png in smoke-1920x1080.png smoke-800x600.png; do
            [ -s "$png" ] || { echo "::error::smoke wrote no $png"; exit 1; }
            echo "smoke OK — $png $(stat -c %s "$png") bytes"
          done
          unset TROUBASTAGE_HOME
          root=$(./troubastage-linux-x86_64.AppImage --print-data-root)
          [ "$root" = "$HOME/.local/share/troubastage" ] || { echo "::error::data root is [$root], expected XDG's"; exit 1; }
          echo "data root (no override): $root"
      # A101 — the notices inside the AppImage itself (extracted, not the build folder), checked independently of the
      # generator: every resolved component listed at its version, every jar listed, every NOTICE shipped, every native
      # mapped (Skiko's library beside the jars to Skia's entry, the runtime's and jpackage's to the Java runtime).
      - name: A101 — the notices inside the AppImage (coverage, notices, natives)
        if: always() && runner.os == 'Linux'
        working-directory: app
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP/a101"; rm -rf "$t"; mkdir -p "$t"
          app="$PWD/troubastage-linux-x86_64.AppImage"
          [ -s "$app" ] || { echo "::error::no AppImage"; exit 1; }
          ./gradlew -q :desktopApp:dependencies --configuration runtimeClasspath > "$t/report.txt"
          ./gradlew -q --no-configuration-cache -I licences/ci/artifact-paths.init.gradle.kts "-Da101.out=$t/artifacts.tsv" :desktopApp:a101ArtifactPaths
          (cd "$t" && "$app" --appimage-extract >/dev/null)
          root="$t/squashfs-root/TroubaStage"
          rc=0
          python3 -I licences/ci/check-notices.py --name appimage --report "$t/report.txt" --artifacts "$t/artifacts.tsv" \
            --notices "$root/lib/app/resources/notices" --spdx licences/spdx --manifest licences/native/manifest.txt \
            --image-jars "$root/lib/app" --image-root "$root" || rc=1
          echo "AppImage: $(stat -c %s "$app") bytes"
          exit $rc
      # A101 — About on the AppImage, under Xvfb as the launch smoke runs it: the row, Ktor, the Java runtime entry (its
      # legal/ read in place), then every entry opened and timed.
      - name: A101 — About lists the notices (--about-smoke, the AppImage under Xvfb)
        if: always() && runner.os == 'Linux'
        working-directory: app
        run: |
          # No errexit (the runner's default is bash -e): a failed smoke must still print its log below.
          set +e -uo pipefail
          if [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; then echo "running the AppImage through FUSE"
          else echo "::warning::no FUSE on this runner — extract-and-run"; export APPIMAGE_EXTRACT_AND_RUN=1; fi
          export TROUBASTAGE_HOME="$RUNNER_TEMP/about-home"; rm -rf "$TROUBASTAGE_HOME"; mkdir -p "$TROUBASTAGE_HOME" "$RUNNER_TEMP/about-run"
          out="$PWD/about-out-linux"; app="$PWD/troubastage-linux-x86_64.AppImage"; rm -rf "$out"
          (cd "$RUNNER_TEMP/about-run" && ulimit -c 0 && timeout 200 xvfb-run -a -s "-screen 0 1920x1080x24" "$app" --about-smoke "$out" \
            > "$RUNNER_TEMP/about-run/output.txt" 2>&1); code=$?
          echo "---- about-smoke.log (exit $code) ----"; cat "$out/about-smoke.log" 2>/dev/null || true
          bad=""
          for n in about-row-shows about-ktor-entry about-java-runtime-entry; do grep -q "A101-CHECK $n: PASS" "$out/about-smoke.log" 2>/dev/null || bad="$bad $n"; done
          # A101 — the fonts through the configuration this run used (FONTCONFIG_FILE unset: the image's own file, which
          # rejects bitmap fonts): above zero, and no more than without it. Read through the smoke's byte copy — the
          # AppImage's mount is gone once it exits — which must be the extracted AppImage's own file.
          fcline=$(grep -m1 '^A101-FONTCONFIG ' "$out/about-smoke.log"); echo "$fcline"
          warn=$(grep -m1 'TroubaStage: could not set up fonts without bitmap fonts' "$RUNNER_TEMP/about-run/output.txt")
          copy="$out/fontconfig-in-use.conf"; shipped="$RUNNER_TEMP/a101/squashfs-root/TroubaStage/lib/app/resources/troubastage-fonts.conf"
          without=$(fc-list | wc -l); through=0; [ -s "$copy" ] && through=$(FONTCONFIG_FILE="$copy" fc-list | wc -l)
          same=no; [ -s "$copy" ] && [ -s "$shipped" ] && cmp -s "$copy" "$shipped" && same=yes
          if [ "${A101_SABOTAGE:-}" = nofontfix ] && echo "$fcline" | grep -q 'sabotage nofontfix'; then fc="SKIP — the fix is off (sabotage nofontfix)"
          elif [ -z "$warn" ] && echo "$fcline" | grep -q 'FONTCONFIG_FILE unset' && [ "$same" = yes ] && [ "$through" -gt 0 ] && [ "$through" -le "$without" ]; then fc=PASS
          else fc=FAIL; bad="$bad linux-fonts-through-shipped-config"; fi
          echo "A101-CHECK linux-fonts-through-shipped-config: $fc — fc-list without the app's file: $without fonts, through it: $through; the file in use is the AppImage's own: $same; stderr warning: [${warn:-none}]"
          [ -z "$bad" ] && [ "$code" = 0 ] || { echo "::error::A101 About checks not passing: [$bad ] (exit $code)"; tail -20 "$RUNNER_TEMP/about-run/output.txt"; exit 1; }
          echo "A101: About lists the notices and opens Ktor and the Java runtime"
      # A101 — the CJK repro's fontconfig: one scalable Latin font (DejaVu Sans) and one CJK PCF bitmap (18x18ja), and
      # its font cache written the way a desktop's is. The crash needs that cache to list the bitmap font: a desktop's
      # always does (fc-cache and every fontconfig program write it), but a cache the app process writes itself leaves
      # the PCF out (the app can't read it), and then nothing crashes (measured on fontconfig 2.13.1 and 2.18.1 with a
      # one-Text Compose app). So this step writes it with fc-list before the app ever runs, and the check below fails
      # unless the cache lists the bitmap font. The positive control gets its own cache folder, so it can't write this
      # one by accident. Sabotage nofontcache skips the write, and the check must then fail on its precondition.
      - name: A101 — the CJK repro's fontconfig, its cache written as a desktop's is
        if: always() && runner.os == 'Linux'
        working-directory: app
        run: |
          set +e -uo pipefail
          r="$RUNNER_TEMP/fc-repro"; rm -rf "$r"; mkdir -p "$r/fonts" "$r/cache" "$r/control-cache" "$r/run"
          pcf=$(find /usr/share/fonts -name '18x18ja.pcf.gz' 2>/dev/null | head -1)
          if [ -z "$pcf" ]; then sudo apt-get install -y -q xfonts-base >/dev/null; pcf=$(find /usr/share/fonts -name '18x18ja.pcf.gz' 2>/dev/null | head -1); fi
          latin=$(fc-match -f '%{file}' 'DejaVu Sans')
          [ -n "$pcf" ] && [ -n "$latin" ] && cp "$pcf" "$latin" "$r/fonts/"
          conf() { printf '<?xml version="1.0"?>\n<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">\n<fontconfig>\n  <dir>%s</dir>\n  <cachedir>%s</cachedir>\n</fontconfig>\n' "$r/fonts" "$1"; }
          conf "$r/cache" > "$r/repro.conf"; conf "$r/control-cache" > "$r/control.conf"
          if [ "${A101_SABOTAGE:-}" = nofontcache ]; then echo "the repro's cache NOT written (sabotage nofontcache)"
          else FONTCONFIG_FILE="$r/repro.conf" fc-list > /dev/null; echo "the repro's cache written by fc-list: [$(ls "$r/cache" | tr '\n' ' ')]"; fi
          echo "the repro's fonts: [$(ls "$r/fonts" | tr '\n' ' ')]"
      # A101 — Skiko 0.9.22.2 crashes (SIGSEGV in SkTypeface_fontconfig::onOpenStream) when its font fallback opens a
      # bitmap font. On a machine whose only CJK-capable font is a PCF bitmap, the Java runtime's notices (libpng's
      # contributors, in Chinese) crashed the app; it now runs with a fontconfig file that rejects non-scalable fonts
      # (LinuxFontConfig). The repro (the step above): the AppImage through --appimage-extract-and-run, the Java runtime
      # entry opened. Its precondition is part of the verdict: the cache must list the bitmap font, or the check fails
      # ("precondition missing") whatever the app did. Sabotage nofontfix turns the fix off and must red this check, by
      # the crash; sabotage nofontcache must red it on the precondition.
      - name: A101 — a bitmap-only CJK fallback doesn't crash (repro fontconfig)
        if: always() && runner.os == 'Linux'
        working-directory: app
        run: |
          # No errexit (the runner's default is bash -e): the app's exit code is the measurement, and a crash must print.
          set +e -uo pipefail
          r="$RUNNER_TEMP/fc-repro"
          # The precondition, read before the app runs (which may write the cache itself): does the cache list the PCF?
          precond=no; seen=""
          for c in "$r"/cache/*cache*; do
            [ -e "$c" ] || continue
            listing=$(fc-cat -v "$c" 2>&1); rc=$?
            n=$(printf '%s\n' "$listing" | grep -c '"18x18ja.pcf.gz"')
            seen="$seen $(basename "$c"): fc-cat exit $rc, $n PCF entr(y/ies);"
            [ "$n" -gt 0 ] && precond=yes
          done
          echo "the repro's cache lists 18x18ja.pcf.gz: $precond —${seen:- no cache file}"
          fallback=$(FONTCONFIG_FILE="$r/control.conf" fc-match -s 'sans-serif:lang=zh' | head -3 | tr '\n' ';')
          echo "positive control — the repro's fonts: [$(ls "$r/fonts" | tr '\n' ' ')]; fc-match -s 'sans-serif:lang=zh' under it: [$fallback]"
          trigger=$(python3 -I - desktopApp/build/compose/binaries/main/app/TroubaStage/lib/runtime/legal <<'PY'
          import os, sys
          for d, _, fs in sorted(os.walk(sys.argv[1])):
              for f in sorted(fs):
                  try: t = open(os.path.join(d, f), encoding="utf-8").read()
                  except Exception: continue
                  cjk = [c for c in t if 0x4E00 <= ord(c) <= 0x9FFF]
                  if cjk: print(f"{os.path.relpath(os.path.join(d, f), sys.argv[1])}: {len(cjk)} CJK characters, first U+{ord(cjk[0]):04X}"); sys.exit(0)
          print("none")
          PY
          )
          echo "the trigger — CJK text in the shipped runtime's legal/: [$trigger]"
          export TROUBASTAGE_HOME="$RUNNER_TEMP/cjk-home"; rm -rf "$TROUBASTAGE_HOME"; mkdir -p "$TROUBASTAGE_HOME"
          out="$PWD/about-out-cjk"; app="$PWD/troubastage-linux-x86_64.AppImage"; rm -rf "$out"
          (cd "$r/run" && ulimit -c 0 && FONTCONFIG_FILE="$r/repro.conf" timeout 200 xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$app" --appimage-extract-and-run --about-smoke "$out" > "$r/run/stdout.txt" 2>&1); code=$?
          echo "---- about-smoke.log (exit $code) ----"; cat "$out/about-smoke.log" 2>/dev/null || echo "(none)"
          echo "---- the app's output, last 40 lines ----"; tail -40 "$r/run/stdout.txt"
          mkdir -p "$out"; cp "$r/run/stdout.txt" "$out/stdout.txt"; cp "$r/run"/hs_err_pid*.log "$out/" 2>/dev/null || true
          jre=$(grep -m1 "A101-CHECK about-java-runtime-entry" "$out/about-smoke.log" 2>/dev/null | cut -c1-160)
          crash=$(grep -m1 -E '^#[[:space:]]+(SIGSEGV|SIGBUS|SIGABRT|SIGILL)' "$r/run/stdout.txt" | tr -s ' ')
          frame=$(grep -m1 -A1 'Problematic frame' "$r/run/stdout.txt" | tail -1 | tr -s ' ')
          ok=1
          [ "$precond" = yes ] || { ok=0; echo "::error::precondition missing: the repro's font cache doesn't list 18x18ja.pcf.gz, so the crash can't happen"; }
          echo "$fallback" | grep -q '18x18ja' || { ok=0; echo "::error::the repro's Chinese fallback is not the bitmap font — it reproduces nothing"; }
          [ "$trigger" != none ] || { ok=0; echo "::error::no CJK text in the runtime's legal/ — nothing to trigger the fallback"; }
          [ "$code" = 0 ] && echo "$jre" | grep -q PASS && [ -z "$crash" ] || ok=0
          echo "A101-CHECK linux-cjk-bitmap-font: $([ $ok = 1 ] && echo PASS || echo FAIL) — $([ "$precond" = yes ] || echo 'precondition missing — ')cache lists 18x18ja.pcf.gz: $precond; about-smoke through --appimage-extract-and-run under the repro: exit $code; [$jre]; crash: [${crash:-none}${frame:+ / $frame}]"
          # A101 — "no crash" alone would also pass if the wrapper loaded no fonts. The wrapper the app wrote (its path from
          # the smoke's log; it stays, replaced at each launch) must still give the person's fonts, minus the bitmap one.
          fcline=$(grep -m1 '^A101-FONTCONFIG ' "$out/about-smoke.log"); echo "$fcline"
          inuse=$(echo "$fcline" | sed -n 's/^A101-FONTCONFIG in-use=\([^ ]*\) .*/\1/p')
          warn=$(grep -m1 'TroubaStage: could not set up fonts without bitmap fonts' "$r/run/stdout.txt")
          without=$(FONTCONFIG_FILE="$r/repro.conf" fc-match -s 'sans-serif:lang=zh' | tr '\n' ';')
          through=""; listed=0
          if [ -n "$inuse" ] && [ -s "$inuse" ]; then through=$(FONTCONFIG_FILE="$inuse" fc-match -s 'sans-serif:lang=zh' | tr '\n' ';'); listed=$(FONTCONFIG_FILE="$inuse" fc-list | wc -l); fi
          wok=1
          if [ "${A101_SABOTAGE:-}" = nofontfix ] && echo "$fcline" | grep -q 'sabotage nofontfix'; then w="SKIP — the fix is off (sabotage nofontfix)"
          elif [ -z "$warn" ] && echo "$fcline" | grep -q 'a wrapper of FONTCONFIG_FILE=' && echo "$through" | grep -q 'DejaVuSans' \
              && ! echo "$through" | grep -q '\.pcf' && [ "$listed" -gt 0 ]; then w=PASS
          else w=FAIL; wok=0; fi
          echo "A101-CHECK linux-fonts-through-wrapper: $w — in use: [$inuse]; fc-match -s 'sans-serif:lang=zh' without the wrapper: [$without] through it: [$through]; fc-list through it: $listed; stderr warning: [${warn:-none}]"
          [ $ok = 1 ] && [ $wok = 1 ]
      # A101 — the programs the app starts on Linux get FONTCONFIG_FILE as it was at launch: the setenv is the app's own
      # (its file may sit in the AppImage's mount, gone when the app quits). A recorder stands in for xdg-open (first on
      # PATH) and is the default https handler (for AWT's browse, through GTK); the app opens a link the way Update's link
      # does (--open-link). Twice: FONTCONFIG_FILE unset, and set to the person's own. Sabotage fontenvleak (the browse
      # path as it was) must red this check only.
      - name: A101 — programs the app starts get FONTCONFIG_FILE as at launch
        if: always() && runner.os == 'Linux'
        working-directory: app
        run: |
          # No errexit (the runner's default is bash -e): each case must report.
          set +e -uo pipefail
          if [ -e /dev/fuse ] && { command -v fusermount3 || command -v fusermount; } >/dev/null; then :; else export APPIMAGE_EXTRACT_AND_RUN=1; fi
          o="$RUNNER_TEMP/open-env"; rm -rf "$o"; mkdir -p "$o/bin" "$o/data/applications" "$o/config"
          printf '#!/bin/sh\n{ echo "FONTCONFIG_FILE=${FONTCONFIG_FILE-<unset>}"; echo "via=$0"; } >> "$A101_OPEN_RECORD"\n' > "$o/bin/xdg-open"
          chmod +x "$o/bin/xdg-open"; cp "$o/bin/xdg-open" "$o/bin/a101-https-handler"
          printf '[Desktop Entry]\nType=Application\nName=A101 recorder\nExec=%s %%u\nMimeType=x-scheme-handler/https;\n' "$o/bin/a101-https-handler" > "$o/data/applications/a101-recorder.desktop"
          printf '[Default Applications]\nx-scheme-handler/https=a101-recorder.desktop\n' > "$o/config/mimeapps.list"
          printf '<?xml version="1.0"?>\n<fontconfig>\n  <include ignore_missing="yes">fonts.conf</include>\n</fontconfig>\n' > "$o/own.conf"
          app="$PWD/troubastage-linux-x86_64.AppImage"; ok=1; detail=""
          for case in unset own; do
            rec="$o/record-$case.txt"; : > "$rec"
            if [ $case = own ]; then launch="$o/own.conf"; set -- FONTCONFIG_FILE="$o/own.conf"; else launch="<unset>"; set --; fi
            env -u FONTCONFIG_FILE -u DBUS_SESSION_BUS_ADDRESS PATH="$o/bin:$PATH" XDG_DATA_HOME="$o/data" XDG_CONFIG_HOME="$o/config" \
              XDG_DATA_DIRS="$o/data:/usr/share" A101_OPEN_RECORD="$rec" TROUBASTAGE_HOME="$RUNNER_TEMP/open-home-$case" "$@" \
              timeout 60 xvfb-run -a -s "-screen 0 1280x800x24" "$app" --open-link "https://example.invalid/a101" > "$o/out-$case.txt" 2>&1
            for i in 1 2 3 4 5 6 7 8; do [ -s "$rec" ] && break; sleep 1; done
            got=$(sed -n 's/^FONTCONFIG_FILE=//p' "$rec" | head -1); via=$(sed -n 's/^via=//p' "$rec" | head -1)
            how=$(grep -m1 'open-link:' "$o/out-$case.txt")
            [ -s "$rec" ] && [ "$got" = "$launch" ] || ok=0
            detail="$detail $case: launch [$launch] → recorded [${got:-nothing}] by [${via:-none}] ($how);"
          done
          echo "A101-CHECK linux-child-fontconfig-env: $([ $ok = 1 ] && echo PASS || echo FAIL) —$detail"
          [ $ok = 1 ]
      - name: A101 — upload the Linux About captures
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: a101-about-linux
          path: |
            app/about-out-linux/*.png
            app/about-out-linux/about-smoke.log
            app/about-out-linux/fontconfig-in-use.conf
            app/about-out-cjk/*.png
            app/about-out-cjk/*.log
            app/about-out-cjk/stdout.txt
          if-no-files-found: ignore
      - name: upload AppImage + smoke PNG
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: troubastage-linux-appimage
          path: |
            app/troubastage-linux-x86_64.AppImage
            app/smoke-*.png

  # DESK01 D3 — the macOS app: ONE universal TroubaStage.app (Apple silicon + Intel) from two builds, layout B (two
  # runtimes, a universal stub; packaging/macos/make-universal.sh). Hard-gating for CI, but NOT in release-apk's needs
  # (Fable, b67486a3): until DESK02 this job was NOT in release-apk's needs, so a flaky Mac runner could not hold the
  # APK and the MSI. DESK02 (VLL, 2026-11-02) puts the DMG on `latest` with the others, so it is in `needs` now; the
  # `hdiutil create` step below gets a bounded retry so a single transient failure does not redden the release.
  desktop-macos:
    name: desktop (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    # A101: empty on push/PR; set by a sabotage dispatch (the a101_sabotage input).
    env:
      ORG_GRADLE_PROJECT_a101Sabotage: ${{ github.event.inputs.a101_sabotage }}
      A101_SABOTAGE: ${{ github.event.inputs.a101_sabotage }}
    steps:
      - uses: actions/checkout@v7
      # Two JDKs: the x64 one builds the Intel app under Rosetta; the arm64 one (set up last) is JAVA_HOME.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v6
      - name: Rosetta (builds and smokes the Intel half)
        run: |
          uname -m; sw_vers -productVersion
          arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
          arch -x86_64 /usr/bin/true && echo "Rosetta present"
      - name: desktop tests (macOS)
        working-directory: app
        run: ./gradlew :shared:desktopTest :desktopApp:test
      # WIN07 — same guard as the other two legs (dedicated job, so no runner.os condition). The JVM may read user.home
      # from the passwd entry, not $HOME, so ask the JVM; check both to be safe.
      - name: WIN07 — no Skiko under the JVM's home (per-task unpack dir)
        if: always()
        working-directory: app
        shell: bash
        run: |
          set -uo pipefail
          jvm_home="$(java -XshowSettings:properties -version 2>&1 | sed -n 's/^[[:space:]]*user\.home = //p')"
          echo "JVM user.home = [$jvm_home]   \$HOME = [${HOME:-}]"
          rc=0
          for h in "$jvm_home" "${HOME:-}"; do
            [ -n "$h" ] || continue
            if [ -e "$h/.skiko" ]; then
              echo "::error::WIN07: Skiko unpacked into the shared $h/.skiko — a desktop test task is missing skiko.data.path"
              ls -la "$h/.skiko" || true
              rc=1
            fi
          done
          [ "$rc" = 0 ] || exit 1
          echo "OK - no .skiko under the JVM user.home or \$HOME"
          for d in shared/build/skiko desktopApp/build/skiko; do
            echo "## $d"
            if [ -d "$d" ]; then find "$d" -maxdepth 2 -print; else echo "  (absent - the task did not run, or unpacked elsewhere)"; fi
          done
      # Both builds carry ONE build identity (the update check compares it): the same minute, stamped once.
      - name: one build time for both halves
        run: echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:00Z)" >> "$GITHUB_ENV"
      - name: app image — Apple silicon (native JDK)
        working-directory: app
        run: |
          ./gradlew :desktopApp:createDistributable "-PdesktopVersion=1.0.${{ github.run_number }}" "-PbuiltAt=$BUILT_AT"
          mkdir -p "$RUNNER_TEMP/arm64" && ditto desktopApp/build/compose/binaries/main/app/TroubaStage.app "$RUNNER_TEMP/arm64/TroubaStage.app"
      - name: app image — Intel (x64 JDK, Gradle under Rosetta)
        working-directory: app
        run: |
          rm -rf desktopApp/build/compose
          JAVA_HOME="$JAVA_HOME_21_X64" arch -x86_64 ./gradlew --no-daemon :desktopApp:createDistributable "-PdesktopVersion=1.0.${{ github.run_number }}" "-PbuiltAt=$BUILT_AT"
          mkdir -p "$RUNNER_TEMP/x64" && ditto desktopApp/build/compose/binaries/main/app/TroubaStage.app "$RUNNER_TEMP/x64/TroubaStage.app"
      - name: one universal app (merge rule, two runtimes, universal stub, ad-hoc signed inside-out)
        working-directory: app
        run: desktopApp/packaging/macos/make-universal.sh "$RUNNER_TEMP/arm64/TroubaStage.app" "$RUNNER_TEMP/x64/TroubaStage.app" "$RUNNER_TEMP/universal/TroubaStage.app"
      - name: WIN08 — no SWT jar in the macOS app (SWT is a Windows-host-only dependency)
        run: |
          set -uo pipefail
          hits="$(find "$RUNNER_TEMP/universal/TroubaStage.app" -iname '*swt*.jar' 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "::error::WIN08: an SWT jar reached the macOS app:"; echo "$hits"; exit 1; fi
          echo "WIN08: no SWT jar in the macOS universal app"
      - name: WIN08 S2.8 — no SWT licences in the macOS app (they ship with SWT, on Windows only)
        run: |
          set -uo pipefail
          hits="$(find "$RUNNER_TEMP/universal/TroubaStage.app" \( -name 'SWT-NOTICE.txt' -o -name 'EPL-2.0.txt' -o -type d -name licences \) 2>/dev/null || true)"
          if [ -n "$hits" ]; then echo "::error::S2.8: SWT's licences reached the macOS app:"; echo "$hits"; exit 1; fi
          echo "S2.8: no SWT licences in the macOS universal app"
      - name: launch smoke ×3 — natively, under Rosetta, and through LaunchServices; each draws, each on its own runtime
        working-directory: app
        run: |
          # No errexit (the runner's default is bash -e): a launch's failure is collected into $fail and reported, and
          # an lsof that finds no libjvm YET (a Rosetta launch starts slowly) is not a failure.
          set +e -u
          U="$RUNNER_TEMP/universal/TroubaStage.app"; concert="$GITHUB_WORKSPACE/docs/demo/demo-concert.tstage"; fail=0
          # Runs one launch to its exit (150 s at most) while noting the libjvm it mapped (lsof), then checks the exit, both
          # PNGs, the -ok.txt marker the smoke writes only once the REAL window drew (B5; the PNGs are rendered off-screen
          # first, and `open -W` exits 0 whatever the app does), and that the runtime was the expected arch's.
          check() { label=$1 want=$2; shift 2
            export TROUBASTAGE_HOME="$RUNNER_TEMP/home-$label"
            "$@" &
            pid=$!; seen=""
            for i in $(seq 1 150); do
              kill -0 $pid 2>/dev/null || break
              seen="$seen $(lsof -c TroubaStag 2>/dev/null | grep -o "runtime-[a-z0-9_]*/Contents/Home/lib/server/libjvm.dylib" | sort -u || true)"
              sleep 1
            done
            if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "::error::$label hung"; fail=1; return; fi
            wait $pid; code=$?
            jvm=$(echo $seen | tr ' ' '\n' | sort -u | grep . | tr '\n' ' ')
            echo "$label: exit $code, runtime mapped: $jvm"
            [ $code -eq 0 ] || { echo "::error::$label exited $code"; fail=1; }
            for s in 1920x1080 800x600; do [ -s "smoke-$label-$s.png" ] || { echo "::error::$label wrote no $s PNG"; fail=1; }; done
            [ -s "smoke-$label-ok.txt" ] || { echo "::error::$label: the real window never drew (no smoke-$label-ok.txt)"; fail=1; }
            [ "$jvm" = "runtime-$want/Contents/Home/lib/server/libjvm.dylib " ] || { echo "::error::$label ran on [$jvm], expected runtime-$want"; fail=1; }
          }
          check native arm64 "$U/Contents/MacOS/TroubaStage" --smoke smoke-native.png --smoke-concert "$concert"
          check rosetta x86_64 arch -x86_64 "$U/Contents/MacOS/TroubaStage" --smoke smoke-rosetta.png --smoke-concert "$concert"
          check open arm64 open -W -n --env TROUBASTAGE_HOME="$RUNNER_TEMP/home-open" "$U" --args --smoke "$PWD/smoke-open.png" --smoke-concert "$concert"
          unset TROUBASTAGE_HOME
          root=$("$U/Contents/MacOS/TroubaStage" --print-data-root)
          [ "$root" = "$HOME/Library/Application Support/TroubaStage" ] || { echo "::error::data root is [$root]"; fail=1; }
          echo "data root (no override): $root"
          exit $fail
      # A101 — the notices inside the universal app, checked independently of the generator (its one app/ folder holds
      # both Skiko libraries, both runtimes' legal/ are read in place).
      - name: A101 — the notices inside the macOS app (coverage, notices, natives)
        if: always()
        working-directory: app
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP/a101"; rm -rf "$t"; mkdir -p "$t"
          U="$RUNNER_TEMP/universal/TroubaStage.app"
          ./gradlew -q :desktopApp:dependencies --configuration runtimeClasspath > "$t/report.txt"
          ./gradlew -q --no-configuration-cache -I licences/ci/artifact-paths.init.gradle.kts "-Da101.out=$t/artifacts.tsv" :desktopApp:a101ArtifactPaths
          python3 -I licences/ci/check-notices.py --name macos --report "$t/report.txt" --artifacts "$t/artifacts.tsv" \
            --notices "$U/Contents/app/resources/notices" --spdx licences/spdx --manifest licences/native/manifest.txt \
            --image-jars "$U/Contents/app" --image-root "$U"
      # A101 — About on the universal app (natively): the row, Ktor, the Java runtime entry, every entry opened and timed.
      - name: A101 — About lists the notices (--about-smoke, the universal app)
        if: always()
        working-directory: app
        run: |
          # No errexit (the runner's default is bash -e): a failed smoke must still print its log below.
          set +e -uo pipefail
          U="$RUNNER_TEMP/universal/TroubaStage.app"
          export TROUBASTAGE_HOME="$RUNNER_TEMP/about-home"; rm -rf "$TROUBASTAGE_HOME"; mkdir -p "$TROUBASTAGE_HOME" "$RUNNER_TEMP/about-run"
          out="$PWD/about-out-macos"
          (cd "$RUNNER_TEMP/about-run" && "$U/Contents/MacOS/TroubaStage" --about-smoke "$out") & pid=$!
          for i in $(seq 1 200); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "::error::about-smoke hung"; exit 1; fi
          wait $pid; code=$?
          echo "---- about-smoke.log (exit $code) ----"; cat "$out/about-smoke.log" 2>/dev/null || true
          bad=""
          for n in about-row-shows about-ktor-entry about-java-runtime-entry; do grep -q "A101-CHECK $n: PASS" "$out/about-smoke.log" 2>/dev/null || bad="$bad $n"; done
          [ -z "$bad" ] && [ "$code" = 0 ] || { echo "::error::A101 About checks not passing: [$bad ] (exit $code)"; exit 1; }
          echo "A101: About lists the notices and opens Ktor and the Java runtime"
      - name: A101 — upload the macOS About captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: a101-about-macos
          path: |
            app/about-out-macos/*.png
            app/about-out-macos/about-smoke.log
          if-no-files-found: ignore
      - name: the DMG — one app for Apple silicon and Intel Macs (DESK02)
        working-directory: app
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/dmg"; mkdir -p "$d"; ditto "$RUNNER_TEMP/universal/TroubaStage.app" "$d/TroubaStage.app"; ln -s /Applications "$d/Applications"
          # DESK02: `hdiutil create` flaked once (land run 41451900079 attempt 1) and passed on re-run with nothing
          # changed. Now that the DMG gates the whole release, retry just the create a bounded few times, clearing any
          # partial file between tries; if every try fails the leg still goes red. Only `create` retries — the verify
          # and the launch checks above do not.
          ok=
          for try in 1 2 3; do
            rm -f troubastage-macos.dmg
            if hdiutil create -quiet -volname TroubaStage -srcfolder "$d" -ov -format UDZO troubastage-macos.dmg; then
              ok=1; break
            fi
            echo "::warning::hdiutil create failed (try $try of 3)"
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::hdiutil create failed on every try"; exit 1; }
          hdiutil verify troubastage-macos.dmg
          echo "DMG: $(du -h troubastage-macos.dmg | cut -f1)"
      - name: upload DMG + smoke PNGs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: troubastage-macos-dmg
          path: |
            app/troubastage-macos.dmg
            app/smoke-*.png
