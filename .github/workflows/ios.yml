# iOS simulator proof (IOS02). SEPARATE from ci.yml and MANUAL — macOS runner minutes bill 10× on
# private repos, so this NEVER runs per-push: workflow_dispatch + a weekly cron at most. Simulator
# builds are unsigned (CODE_SIGNING_ALLOWED=NO) — no Apple ID, no provisioning profile, no secrets.
# It links the Kotlin framework, builds the unsigned .app, boots a simulator, injects the committed
# demo bundle, launches, screenshots the Concerts list + a Stage page, and FAILS if Stage didn't
# actually load a bundle (marker-file assertion — a crash screenshot must not pass).
name: iOS (simulator)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC — a heartbeat, not per-push

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest # Apple silicon → iphonesimulator is arm64 (iosSimulatorArm64)
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Same JDK 21 compile toolchain as the android job (libs.versions.toml).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: install xcodegen
        run: brew install xcodegen

      # 1) Link the dynamic Kotlin framework (macOS-only step — SKIPPED on Linux CI).
      - name: link Shared.framework (simulator)
        working-directory: app
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      # 2) Generate the .xcodeproj from the committed project.yml, then build UNSIGNED.
      - name: generate xcodeproj
        working-directory: app/iosApp
        run: xcodegen generate
      # 2b) Boot the target simulator BEFORE building so xcodebuild can target it by id — that pins
      # the build to the simulator's native arch (arm64 on the Apple-silicon runner), matching the
      # arm64-only Kotlin framework. Without a -destination, xcodebuild also builds an x86_64 slice
      # and fails to link the arm64 framework.
      - name: boot simulator
        run: |
          set -euo pipefail
          # Pick a device type from the chosen runtime's OWN supportedDeviceTypes, so the pair is
          # always compatible (an arbitrary "last iPhone" can be an old model the new runtime rejects
          # with SimError 403). Prefer the highest-numbered iPhone the runtime supports.
          PAIR=$(python3 -c '
          import json, re, subprocess
          def num(d):
              m = re.search(r"iPhone (\d+)", d["name"]); return int(m.group(1)) if m else -1
          rts = [r for r in json.loads(subprocess.check_output(["xcrun","simctl","list","runtimes","-j"]))["runtimes"] if r.get("isAvailable") and "iOS" in r["name"]]
          if not rts: raise SystemExit("no available iOS runtime")
          rt = rts[-1]
          ph = sorted([d for d in rt.get("supportedDeviceTypes", []) if "iPhone" in d["name"]], key=num)
          if not ph: raise SystemExit("runtime supports no iPhone device types")
          print(ph[-1]["identifier"], rt["identifier"])
          ')
          DEVTYPE=$(echo "$PAIR" | cut -d" " -f1)
          RUNTIME=$(echo "$PAIR" | cut -d" " -f2)
          echo "device=$DEVTYPE runtime=$RUNTIME"
          UDID=$(xcrun simctl create trouba-sim "$DEVTYPE" "$RUNTIME")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: build (unsigned, simulator)
        working-directory: app/iosApp
        run: |
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination "id=$UDID" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=YES \
            build

      # 3) Install, inject the demo bundle, launch twice (list + Stage), assert. Reuses $UDID.
      - name: simulator smoke (inject demo, screenshot, assert load)
        working-directory: app/iosApp
        run: |
          set -euo pipefail
          BUNDLE_ID=com.troubashare.app

          APP=$(find DerivedData -name "iosApp.app" -type d | head -1)
          test -n "$APP" || { echo "iosApp.app not found"; exit 1; }
          xcrun simctl install "$UDID" "$APP"

          mkdir -p diag
          # Inject the committed demo bundle into the app's Documents/bundles (mirrors Android run-as).
          CONTAINER=$(xcrun simctl get_app_container "$UDID" "$BUNDLE_ID" data)
          DEST="$CONTAINER/Documents/bundles/wonderwall-demo"
          mkdir -p "$DEST"
          unzip -o "$GITHUB_WORKSPACE/docs/demo/demo-concert.tstage" -d "$DEST"

          echo "CONTAINER=$CONTAINER" >> "$GITHUB_ENV"

          # Launch 1: Concerts list, CONSOLE-CAPTURED. Kotlin/Native uncaught-exception text prints to
          # the app's stderr (invisible to `log show`); --console-pty relays it. It blocks while the
          # app runs, so background it and screenshot after a beat.
          xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > diag/app-console-concerts.txt 2>&1 &
          C1=$!
          sleep 12
          xcrun simctl io "$UDID" screenshot concerts.png
          kill "$C1" 2>/dev/null || true
          # terminate WITHOUT `|| true`: if the app already crashed at first frame, this finds nothing
          # to kill and fails the job. The marker alone is NOT proof the UI rendered.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"

          # Launch 2: auto-open the first concert → a Stage page (also console-captured). TROUBA_AUTOPEN
          # is read by the app (via SIMCTL_CHILD_ passthrough) so we don't drive Compose taps.
          SIMCTL_CHILD_TROUBA_AUTOPEN=1 xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" > diag/app-console-stage.txt 2>&1 &
          C2=$!
          sleep 12
          xcrun simctl io "$UDID" screenshot stage.png
          kill "$C2" 2>/dev/null || true

          # Marker: the app writes this only after a bundle actually loads (LoadResult.Loaded).
          MARKER="$CONTAINER/Documents/stage-loaded.marker"
          if [ ! -f "$MARKER" ]; then
            echo "::error::Stage did not load a bundle — no stage-loaded.marker written"
            exit 1
          fi
          echo "stage marker: $(cat "$MARKER")"

          # Final liveness assertion: the app must STILL be alive (rendered, didn't crash at first
          # frame). No `|| true` — a dead app => terminate fails => job fails.
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"

      # Always collect the crash report + app log so a first-frame crash is diagnosable from CI
      # (printed to the job log too, so no artifact download is needed to read it).
      - name: collect crash diagnostics
        if: always()
        working-directory: app/iosApp
        run: |
          set +e
          mkdir -p diag
          sleep 20   # ReportCrash lags an abort by seconds — give the .ips time to land
          [ -n "${UDID:-}" ] && xcrun simctl spawn "$UDID" log show --last 5m --style syslog \
            --predicate 'processImagePath CONTAINS "iosApp"' > diag/app-log.txt 2>&1
          # Match by CONTENT, not name prefix — sim crash reports aren't always "iosApp*".
          for f in $(grep -l iosApp ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null); do cp "$f" diag/; done
          echo "==== app console (Concerts) ===="; cat diag/app-console-concerts.txt 2>/dev/null
          echo "==== app console (Stage) ===="; cat diag/app-console-stage.txt 2>/dev/null
          echo "==== diag dir ===="; ls -la diag
          for f in diag/*.ips diag/*.crash; do
            [ -f "$f" ] && { echo "===== $f ====="; cat "$f"; }
          done
          echo "==== app-log.txt (tail) ===="; tail -150 diag/app-log.txt 2>/dev/null

      - name: upload app + screenshots + diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-proof
          path: |
            app/iosApp/DerivedData/Build/Products/Debug-iphonesimulator/iosApp.app
            app/iosApp/concerts.png
            app/iosApp/stage.png
            app/iosApp/diag
          if-no-files-found: warn
