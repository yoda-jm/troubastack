# DESK01 measurement spike (TEMPORARY — removed before landing): can the arm64 and x86_64 macOS app images be
# lipo-merged into one universal .app? Lists every file that differs, classifies it (Mach-O → lipo-able; anything
# else → the spec's merge rule fails), opens lib/modules with jimage when it differs, then tries the merge (taking
# the arm64 copy of each differing non-Mach-O file, recorded) and smokes it natively and under Rosetta.
name: desk01-spike

on:
  pull_request:

jobs:
  macos-merge:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: gradle/actions/setup-gradle@v6
      - name: runner facts
        run: |
          uname -m; sw_vers; sysctl -n machdep.cpu.brand_string
          env | grep -E '^JAVA_HOME' | sort
          if arch -x86_64 /usr/bin/true 2>/dev/null; then echo "rosetta: present"; else echo "rosetta: ABSENT - installing"; softwareupdate --install-rosetta --agree-to-license; fi
          "$JAVA_HOME_21_X64/bin/java" -XshowSettings:properties -version 2>&1 | grep -E 'os.arch|java.version '
      - name: app image arm64 (native JDK)
        working-directory: app
        run: |
          ./gradlew --no-daemon :desktopApp:createDistributable
          mkdir -p "$RUNNER_TEMP/arm64" && ditto desktopApp/build/compose/binaries/main/app/TroubaStage.app "$RUNNER_TEMP/arm64/TroubaStage.app"
      - name: app image x86_64 (x64 JDK under Rosetta)
        working-directory: app
        run: |
          rm -rf desktopApp/build/compose
          JAVA_HOME="$JAVA_HOME_21_X64" arch -x86_64 ./gradlew --no-daemon :desktopApp:createDistributable
          mkdir -p "$RUNNER_TEMP/x64" && ditto desktopApp/build/compose/binaries/main/app/TroubaStage.app "$RUNNER_TEMP/x64/TroubaStage.app"
      - name: compare the two trees
        run: |
          cat > "$RUNNER_TEMP/compare.py" <<'PY'
          import hashlib, os, subprocess, sys
          a, b = sys.argv[1], sys.argv[2]
          def walk(root):
              out = {}
              for d, dirs, files in os.walk(root):
                  for f in files + [x for x in dirs if os.path.islink(os.path.join(d, x))]:
                      p = os.path.join(d, f); out[os.path.relpath(p, root)] = p
              return out
          A, B = walk(a), walk(b)
          def kind(p):
              if os.path.islink(p): return "link:" + os.readlink(p)
              return subprocess.run(["file", "-b", p], capture_output=True, text=True).stdout.strip()
          def h(p): return "link:" + os.readlink(p) if os.path.islink(p) else hashlib.sha256(open(p, "rb").read()).hexdigest()
          same = macho = 0; other = []
          for rel in sorted(set(A) | set(B)):
              if rel not in A or rel not in B:
                  other.append(("ONLY-IN-" + ("arm64" if rel in A else "x64"), rel, "")); continue
              if h(A[rel]) == h(B[rel]): same += 1; continue
              ka, kb = kind(A[rel]), kind(B[rel])
              if "Mach-O" in ka and "Mach-O" in kb: macho += 1; print("MACHO   ", rel, "|", ka[:60], "|", kb[:60]); continue
              other.append(("DIFFERS", rel, f"{os.path.getsize(A[rel])} vs {os.path.getsize(B[rel])} ({ka[:40]})"))
          print(f"\nidentical: {same}   Mach-O differing (lipo-able): {macho}   other differences: {len(other)}")
          for o in other: print("  ", *o)
          open(os.environ["RUNNER_TEMP"] + "/other.txt", "w").write("\n".join(r for k, r, _ in other if k == "DIFFERS"))
          PY
          python3 "$RUNNER_TEMP/compare.py" "$RUNNER_TEMP/arm64/TroubaStage.app" "$RUNNER_TEMP/x64/TroubaStage.app" | tee "$RUNNER_TEMP/compare.txt" | grep -v '^MACHO' || true
          echo "--- Mach-O lines: $(grep -c '^MACHO' "$RUNNER_TEMP/compare.txt")"; grep '^MACHO' "$RUNNER_TEMP/compare.txt" | head -12
      - name: do the jars and the cfg really differ? (entry name + CRC + size per jar)
        run: |
          cat > "$RUNNER_TEMP/jars.py" <<'PY'
          import os, sys, zipfile
          a, b = sys.argv[1], sys.argv[2]
          for f in sorted(os.listdir(a)):
              if not f.endswith(".jar") or not os.path.exists(os.path.join(b, f)): continue
              ea = {i.filename: (i.CRC, i.file_size) for i in zipfile.ZipFile(os.path.join(a, f)).infolist()}
              eb = {i.filename: (i.CRC, i.file_size) for i in zipfile.ZipFile(os.path.join(b, f)).infolist()}
              if ea == eb: continue
              print("CONTENT DIFFERS:", f)
              for n in sorted(set(ea) | set(eb)):
                  if ea.get(n) != eb.get(n): print("    ", n, ea.get(n), eb.get(n))
          print("jar check done")
          PY
          python3 "$RUNNER_TEMP/jars.py" "$RUNNER_TEMP/arm64/TroubaStage.app/Contents/app" "$RUNNER_TEMP/x64/TroubaStage.app/Contents/app" | head -40
          diff "$RUNNER_TEMP/arm64/TroubaStage.app/Contents/app/TroubaStage.cfg" "$RUNNER_TEMP/x64/TroubaStage.app/Contents/app/TroubaStage.cfg" || true
          ls "$RUNNER_TEMP/arm64/TroubaStage.app/Contents/runtime/Contents/Home/lib/server/"; cat "$RUNNER_TEMP/arm64/TroubaStage.app/Contents/runtime/Contents/Home/release" 2>/dev/null | head -5 || echo "(no release file)"
      - name: layout A — lipo-merged single runtime (spec D3), Skiko union, ad-hoc signed
        run: |
          U="$RUNNER_TEMP/A/TroubaStage.app"; mkdir -p "$(dirname "$U")"; ditto "$RUNNER_TEMP/arm64/TroubaStage.app" "$U"
          grep '^MACHO' "$RUNNER_TEMP/compare.txt" | awk '{print $2}' | while read -r rel; do
            lipo -create "$RUNNER_TEMP/arm64/TroubaStage.app/$rel" "$RUNNER_TEMP/x64/TroubaStage.app/$rel" -output "$U/$rel"
          done
          cp "$RUNNER_TEMP/x64/TroubaStage.app/Contents/app/libskiko-macos-x64.dylib"* "$U/Contents/app/"
          codesign --force --deep --sign - "$U" && codesign --verify --deep --strict "$U" && echo "A: codesign verify OK"
      - name: layout B — two runtimes + a universal stub that execs the per-arch launcher, ad-hoc signed
        run: |
          U="$RUNNER_TEMP/B/TroubaStage.app"; mkdir -p "$(dirname "$U")"; ditto "$RUNNER_TEMP/arm64/TroubaStage.app" "$U"
          rm -rf "$U/Contents/runtime" "$U/Contents/_CodeSignature"
          ditto "$RUNNER_TEMP/arm64/TroubaStage.app/Contents/runtime" "$U/Contents/runtime-arm64"
          ditto "$RUNNER_TEMP/x64/TroubaStage.app/Contents/runtime" "$U/Contents/runtime-x86_64"
          mv "$U/Contents/MacOS/TroubaStage" "$U/Contents/MacOS/TroubaStage-arm64"
          cp "$RUNNER_TEMP/x64/TroubaStage.app/Contents/MacOS/TroubaStage" "$U/Contents/MacOS/TroubaStage-x86_64"
          cp "$RUNNER_TEMP/x64/TroubaStage.app/Contents/app/libskiko-macos-x64.dylib"* "$U/Contents/app/"
          for a in arm64 x86_64; do { echo "[Application]"; echo "app.runtime=\$ROOTDIR/runtime-$a"; tail -n +2 "$U/Contents/app/TroubaStage.cfg"; } > "$U/Contents/app/TroubaStage-$a.cfg"; done
          rm "$U/Contents/app/TroubaStage.cfg"; head -3 "$U/Contents/app/TroubaStage-x86_64.cfg"
          clang -arch arm64 -arch x86_64 -O2 -mmacosx-version-min=11.0 -o "$U/Contents/MacOS/TroubaStage" app/desktopApp/packaging/macos/universal-launcher.c
          lipo -archs "$U/Contents/MacOS/TroubaStage"
          for r in arm64 x86_64; do codesign --force --sign - "$U/Contents/runtime-$r"; done
          codesign --force --deep --sign - "$U" && codesign --verify --deep --strict "$U" && echo "B: codesign verify OK"
          codesign -dv "$U" 2>&1 | grep -E 'Signature|Format'
      - name: smoke both layouts — native and under Rosetta (which runtime is loaded, via lsof)
        run: |
          set +e
          run() { label=$1; shift; export TROUBASTAGE_HOME="$RUNNER_TEMP/home-$label"; rm -rf "$TROUBASTAGE_HOME"
            ( "$@" --smoke "$RUNNER_TEMP/smoke-$label.png" --smoke-concert "$GITHUB_WORKSPACE/docs/demo/demo-concert.tstage" > "$RUNNER_TEMP/smoke-$label.log" 2>&1 ) & pid=$!
            seen=""
            for i in $(seq 1 150); do
              kill -0 $pid 2>/dev/null || break
              seen="$seen $(lsof -c TroubaStag 2>/dev/null | grep -E 'libjvm.dylib|libskiko' | awk '{print $NF}')"
              sleep 1
            done
            if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "$label: HUNG"; else wait $pid; echo "$label: exit $?"; fi
            echo "   loaded: $(echo $seen | tr ' ' '\n' | sort -u | grep . | sed "s#$RUNNER_TEMP/##" | tr '\n' ' ')"
            grep -E 'render API|smoke: OK|Exception|Error' "$RUNNER_TEMP/smoke-$label.log" | head -4; }
          run A-native "$RUNNER_TEMP/A/TroubaStage.app/Contents/MacOS/TroubaStage"
          run A-rosetta arch -x86_64 "$RUNNER_TEMP/A/TroubaStage.app/Contents/MacOS/TroubaStage"
          run B-native "$RUNNER_TEMP/B/TroubaStage.app/Contents/MacOS/TroubaStage"
          run B-rosetta arch -x86_64 "$RUNNER_TEMP/B/TroubaStage.app/Contents/MacOS/TroubaStage"
          echo "--- open (LaunchServices) layout B, 20 s:"; TROUBASTAGE_HOME="$RUNNER_TEMP/home-open" open -n "$RUNNER_TEMP/B/TroubaStage.app" --args --print-data-root; sleep 5; pgrep -lf TroubaStage-arm64 || echo "(not running — print-data-root exits at once)"
      - name: DMG sizes
        run: |
          for L in A B; do
            d="$RUNNER_TEMP/dmg-$L"; mkdir -p "$d"; ditto "$RUNNER_TEMP/$L/TroubaStage.app" "$d/TroubaStage.app"; ln -s /Applications "$d/Applications"
            hdiutil create -quiet -volname TroubaStage -srcfolder "$d" -ov -format UDZO "$RUNNER_TEMP/TroubaStage-$L.dmg"
            echo "$L: app $(du -sh "$RUNNER_TEMP/$L/TroubaStage.app" | cut -f1), dmg $(du -h "$RUNNER_TEMP/TroubaStage-$L.dmg" | cut -f1)"
          done
          echo "thin arm64 app: $(du -sh "$RUNNER_TEMP/arm64/TroubaStage.app" | cut -f1)"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desk01-spike
          path: |
            ${{ runner.temp }}/compare.txt
            ${{ runner.temp }}/smoke-*
