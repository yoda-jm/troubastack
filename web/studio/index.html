<!doctype html>
<!--
  TroubaStudio SPA entry (I10). Client-rendered, NOT SSR — this is what lets
  core serve the built assets directly via embed.FS with no Node runtime in
  production (06-tech-stack.md, I14).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoomable by default (WCAG 1.4.4 — low-vision users can pinch-zoom the
         management pages). `user-scalable=no` is scoped to the editor route at runtime
         (Shell), where the in-app pinch owns the gesture (T27 stage 4). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- BRAND03: the tab wears the mark. The SVG is the source of truth (docs/brand/dist,
         copied at build by the brandFavicon Vite plugin — never a second copy in the tree);
         the PNG in public/ is the raster fallback for browsers without SVG-favicon support. -->
    <link rel="icon" href="/troubastudio-minimal.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Browser chrome (mobile address bar) matches the app ground, per scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f4ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100e16" />
    <title>TroubaStudio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
