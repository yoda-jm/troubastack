; troubacore.ini — example configuration (GENERATED, do not hand-edit).
;
; Regenerate with:  troubacore --print-default-config > troubacore.example.ini
; A byte-equality test keeps this file in sync with the code.
;
; Precedence (most specific wins): built-in defaults < this file < TROUBA_* env
; vars < CLI flags. Every key maps 1:1 to an existing TROUBA_* env var, which still
; works as an override. Default file location is ./troubacore.ini (NOT under the
; data dir); override with --config <path> or TROUBA_CONFIG. A missing default file
; is fine; a missing --config file is a startup error.
;
; Every knob below is shown commented-out at its default — uncomment to change.
;
; SECRETS: database_url (and any future smtp.pass) may carry credentials. Prefer
; injecting those via the environment (env still wins over this file), and if you
; do put them here, chmod 600 the file.

[server]
; listen address
;addr = :8080
; Secure flag on the session cookie — enable only behind TLS
;secure_cookies = false
; directory of downloadable native app binaries (OPS02); empty = none. The Docker image sets this to the embedded apps/ dir
;apps_dir =

[storage]
; relational backend: mem | file
;app_store = mem
; annotation store backend: mem | file | git | pg
;store = file
; data root (blobs, bakes, file backends)
;data_dir = ./troubadata
; Postgres URL (only when store = pg) — may carry credentials, see header
;database_url =

[mdns]
; advertise this core on the LAN (_troubacore._tcp); env TROUBA_NO_MDNS=1 disables
;enabled = true
; mDNS instance name (default: the host name)
;name =

[bake]
; poppler rasteriser binary (found on PATH by default)
;pdftoppm = pdftoppm
; Node binary for the web/bake overlay worker
;node = node
; web/bake CLI path (unset: searched next to the binary as bake/dist/cli.js, then the repo layout; T128)
;cli = ../web/bake/dist/cli.js
; retention: `troubacore gc` keeps only the newest N baked concert revisions per setlist (0 = keep all; a final-locked rev is never pruned)
;keep_revs = 0
; T120 render-cache dir for baked page rasters + overlays (empty = <data>/rendercache when app_store=file, off for a mem-backed core; empty its contents with `troubacore purge-render-cache`)
;render_cache =

[dev]
; dev: exit when the launching parent process dies (set by make dev/run/demo)
;die_with_parent = false

[smtp]
; NOT READ BY ANY CODE YET — reserved forward hook for a future self-service
; "forgot password" flow (T21 is deliberately email-free: admins/operators mint
; one-time reset links out-of-band). Shape only.
;host = smtp.example.org
;port = 587
;from = troubacore@example.org
;user =
;pass =
;tls = true
