syntax = "proto3";

package troubastack.v1;

// Baked concert bundles + the "what's available to me" manifest.
// See docs/design/05-distribution.md, ARCHITECTURE.md (I11, I12, I13).
//
// A bundle is SELF-CONTAINED flattened images (I12). These messages describe the
// manifest/metadata; the page rasters + transparent overlays are referenced blobs.

message PageImages {
  string page_raster_ref = 1;       // PDF page raster (WebP), ~2-3x DPI
  string raster_hash = 2;           // content hash → viewport-preserving swap on change (R10)
  repeated LayerImage overlays = 3; // one transparent overlay PER LAYER, in z-order (R4/R7)
}

// One layer's transparent overlay on one page. The presenter composites PDF + these in
// `order`, toggling optional layers by the viewer's role (R2/R7/R10). Self-contained.
message LayerImage {
  string layer_id = 1;
  string image_ref = 2;     // transparent WebP for this layer on this page
  string content_hash = 3;  // change detection for viewport-preserving auto-update (R10)
  int32 order = 4;          // z-order (mirrors Layer.order)
  bool mandatory = 5;       // viewer cannot hide (mirrors Layer.mandatory)
  string role_tag = 6;      // default-visibility targeting
  string name = 7;          // human name (mirrors Layer.name) so the viewer can label layers (T53)
  // P205 band-wide bundle: a single bundle carries ALL layers, tagged by owner, and
  // the viewer filters at view time. "" = band/shared content; a member id = that
  // member's PERSONAL layer (shown only to that identity). Additive: absent ⇒ "".
  string owner = 8;
  // P205: the layer's default-on state CAPTURED at bake time (explicit, WYSIWYG bake
  // dialog — not silent). proto3 `optional` for presence: absent ⇒ compute as today
  // (mandatory || role_tag rule); present ⇒ seeds the view-time default (precedence in
  // the P205 spec). Old bundles omit it and behave exactly as before.
  optional bool default_on = 9;
}

message BakedSong {
  string song_id = 1;
  uint64 source_revision = 2;            // the song revision this was baked from
  uint64 song_rev = 3;                   // bundle-local song revision (for granular apply)
  repeated PageImages pages = 4;
  // Setlist overrides ride as manifest METADATA, not burned into the page pixels
  // (B02 decision): the presenter may display them, and the pixels stay a pure
  // render of the song's annotations. Absent fields take the proto default —
  // loaders already ignore unknowns, so older bundles/loaders are unaffected.
  string display_notes = 5;              // setlist item Notes
  string key = 6;                        // T86: EFFECTIVE key — setlist KeyOverride, else the song's base key
  int32 tempo = 7;                       // T86: EFFECTIVE tempo — setlist TempoOverride (if >0), else the song's base tempo
  bool on_call = 8;                      // T23: bench/encore song — baked + jumpable,
                                         // outside the running order; false/absent = main
  // T26: the song's Title at bake time (a bundle is a snapshot; no rename
  // propagation). proto3 default-empty, so old bundles stay valid and old loaders
  // ignore it (same additive-compatibility argument as fields 5–7 above); an
  // empty/absent title falls back client-side to "Song N".
  string title = 9;
  // T50: the baked-for member's PERSONAL song cues (icons + colors) — what they
  // must prepare for this song ("mic + red guitar" = sings it, red electric). The
  // per-member bake injects THAT member's cues; the shared bake carries none (cues
  // are personal, B07). Additive metadata exactly like fields 5–9: proto3
  // default-empty, so old bundles stay valid and old loaders ignore it; absent =
  // no cues. An unknown icon id renders as the `note` fallback client-side.
  repeated SongCue cues = 10;
  // P205 band-wide bundle: EVERY member's personal cues for this song, keyed by
  // member id — the viewer shows its own identity's entry. Field 10 (`cues`) keeps
  // its per-member-bake semantics while `?scope=mine` still exists (and is left EMPTY
  // in band-wide bakes), so an old app degrades to no-cues, never wrong-cues. Additive.
  repeated MemberCues member_cues = 11;
  // T86: the song's metre as the musician writes it ("4/4", "6/8", additive "3+4/8");
  // "" = unset = 4/4. Additive like fields 5–11: old bundles stay valid, old loaders
  // ignore it. The Stage (A35) parses it to drive a metre-aware beat.
  string meter = 12;
  // P207: the song's Artist at bake time — a snapshot exactly like the title (field 9), so a later
  // rename does not propagate into an existing bundle (T26). proto3 default-empty, so old bundles stay
  // valid and old loaders ignore it (the same additive-compatibility argument as fields 5–12); an
  // absent/empty artist is normal — the drawer renders it as no dash and no suffix.
  string artist = 13;
  // T137: per-member READING sequences. `pages` (field 4) becomes a shared POOL — the union of every
  // member's selected files' pages — and each entry here is one member's ordered indices INTO that pool
  // (their file selection, in their order). Emitted TOGETHER or not at all: a song where members diverge
  // carries a `""`-keyed default entry PLUS a per-member entry for each divergent member; a song where
  // nobody diverges carries NONE, so its bundle is byte-identical to today's single-file bake. Additive
  // exactly like fields 5–13: proto3 default-empty, old bundles stay valid, old loaders ignore it. Mirrors
  // MemberCues (field 11) — the same per-member idea applied to what you READ instead of what you write.
  repeated MemberPages member_pages = 14;
}

// MemberCues is one member's personal cues for a song in a band-wide bundle (P205).
message MemberCues {
  string member_id = 1;
  repeated SongCue cues = 2;
}

// MemberPages is one member's ordered page sequence for a song (T137): indices into BakedSong.pages (the
// shared pool). Order preserved. `member_id` follows the same convention as LayerImage.owner: a member id
// is that member's PERSONAL sequence; "" is the DEFAULT (the no-selection / anonymous reader — the pool
// pages of the lowest-DisplayOrder viewable PDF). The viewer resolves in this order:
//   1. the entry whose member_id == the viewer's identity, else
//   2. the "" default entry, else
//   3. (no member_pages at all — an undivergent or pre-T137 bundle) every pool page in order.
message MemberPages {
  string member_id = 1;
  repeated int32 page = 2;
}

// SongCue is one personal cue on a song: a stable icon id + an optional tint (T50).
message SongCue {
  string icon = 1;  // stable id from the curated set (see docs/tasks/T50); unknown → `note` fallback
  string color = 2; // optional "#rrggbb" tint; "" = neutral/untinted
}

// Minted ONLY by an explicit admin bake (I11). `concert_rev` is a function of the
// song revs + structure; it is what performers compare against (I13).
message ConcertBundle {
  string concert_id = 1;
  string name = 2;
  uint64 concert_rev = 3;
  int64 baked_at = 4;
  string baked_by = 5;
  bool final_locked = 6;                 // admin band-wide lock (I13)
  repeated BakedSong songs = 7;
  // P205 band-wide bundle: the band roster, so the viewer resolves identity at view
  // time (logged-in Connect match ⇒ auto; anonymous ⇒ one-tap "Who are you?" pick).
  // Additive: absent ⇒ no roster (old bundles / pre-P205), viewer falls back to the
  // role picker only. I12 holds: identity is a local view preference, not an account.
  repeated BundleMember roster = 8;
  // T143: the owning band's identity, so the on-device library can GROUP downloaded
  // bundles by band ("je ne sais pas … quel band"). The baker has both at bake time
  // (band_id from the bake request, band_name via GetBand). Additive: absent ⇒ old
  // bundle / pre-T143, the library shows it in an "Unknown band" group and degrades
  // to a flat list — never wrong. The SETLIST id is NOT duplicated here: it already
  // equals `concert_id` for a band-wide bake (ParseConcertID), which the ⋮ reads. The
  // SERVER origin is likewise absent by design — the app records the source server at
  // download time (it knows its own server then; the baker does not know the public URL).
  string band_id = 9;
  string band_name = 10;
}

// BundleMember is one band member in the roster (P205), for view-time identity.
message BundleMember {
  string member_id = 1;
  string display_name = 2;
  string role = 3;          // "admin" | "conductor" | "member"
}

// Cheap metadata-only response for "what's available to me" (I13). A few KB.
message AvailableConcert {
  string concert_id = 1;
  string name = 2;
  uint64 current_rev = 3;
  int64 updated_at = 4;
  bool final_locked = 5;
  message SongRev { string song_id = 1; uint64 rev = 2; }
  repeated SongRev songs = 6;            // for per-song "Song A changed — apply?"
}

message AvailableConcerts {
  repeated AvailableConcert concerts = 1;
}
