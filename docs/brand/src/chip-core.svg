<!-- Core chip - TroubaCore. The CPU symbol, options 02 and 14 on the
     TroubaCore exploration plate; 14 is the one it marks recommended.

     Blue ground, layer 3: Core is the blue one with the circuit, TroubaStack
     the sum of all four. An earlier version had the two the other way round.

     The glyph fills more of the disc than it did, so the blue surround is a
     ring rather than a field: body 144 to 176, legs reaching 132 against a
     disc of 170.

     THREE THIN LEGS a side, pitch 31 so the gaps are three times the leg. They
     were once 12 wide, 26 long and starting at 70 — inside the body's own
     15-wide stroke, whose outer edge is at 79.5 — and merged into it. -->
<g transform="translate(786,786)">
  <circle cy="16" r="170" fill="#000000" fill-opacity="0.34"/>
  <circle r="170" fill="url(#gChipCore)"/>
  <circle r="170" fill="url(#gSheen)"/>
  <circle r="166" fill="none" stroke="url(#gRim)" stroke-width="7.5"/>
  <g fill="#E9EFF5">
    <g>
      <rect x="-35" y="-132" width="9" height="34" rx="4"/>
      <rect x="-35" y="98"   width="9" height="34" rx="4"/>
      <rect x="-132" y="-35" width="34" height="9" rx="4"/>
      <rect x="98"   y="-35" width="34" height="9" rx="4"/>
      <rect x="-4" y="-132" width="9" height="34" rx="4"/>
      <rect x="-4" y="98"   width="9" height="34" rx="4"/>
      <rect x="-132" y="-4" width="34" height="9" rx="4"/>
      <rect x="98"   y="-4" width="34" height="9" rx="4"/>
      <rect x="27" y="-132" width="9" height="34" rx="4"/>
      <rect x="27" y="98"   width="9" height="34" rx="4"/>
      <rect x="-132" y="27" width="34" height="9" rx="4"/>
      <rect x="98"   y="27" width="34" height="9" rx="4"/>
    </g>
    <rect x="-88" y="-88" width="176" height="176" rx="26" fill="none"
          stroke="#E9EFF5" stroke-width="17"/>
    <rect x="-38" y="-38" width="76" height="76" rx="14"/>
  </g>
</g>
