<!-- Play chip - TroubaStage. Centre (786,786) r=170: the tile's corner arc is
     centred (795,795) with radius 229, and the chip centre sits 12.7 from that
     centre, so it reaches 12.7+170=183 < 229 and cannot clip. -->
<g transform="translate(786,786)">
  <circle cy="16" r="170" fill="#000000" fill-opacity="0.34"/>
  <circle r="170" fill="url(#gChipPlay)"/>
  <circle r="170" fill="url(#gSheen)"/>
  <circle r="166" fill="none" stroke="url(#gRim)" stroke-width="7.5"/>
  <path d="M -44 -72 L 76 0 L -44 72 Z" fill="url(#gWhite)" stroke="url(#gWhite)"
        stroke-width="26" stroke-linejoin="round"/>
</g>
