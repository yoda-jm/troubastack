  <circle cy="16" r="170" fill="#000000" fill-opacity="0.34"/>
  <circle r="170" fill="url(#gChipStack)"/>
  <circle r="170" fill="url(#gSheen)"/>
  <circle r="166" fill="none" stroke="url(#gRim)" stroke-width="7.5"/>
