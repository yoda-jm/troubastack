<!-- Stack chip - TroubaStack, the umbrella mark: the sum of the other three.

     A three-bladed whirl, one blade per layer colour, from option 02 TRI FLOW
     on the whirl plate rather than 12 STACK SPHERE, whose ellipses merge at
     chip size; the tile already says stack with its three planes.

     Grey ground: the blades ARE the three layer colours, so a coloured ground
     would swallow one of them.

     Each blade is a TEARDROP: rounded at the wide end and tapering to a point.
     The earlier version cut the wide end on a straight radial line, which is
     what read as square. The taper follows t^1.7 rather than a straight
     interpolation, so the blade stays full longer and then closes quickly.

     Sampled, not built from arcs: the inner edge's radius varies along its
     length and an arc cannot do that. -->
