<!-- brick: the three planes. The twelve corners were placed by VLL on an
     interactive page, after four of my detection methods each failed on the
     left ones. Measured back from his placement: the short side is CONSTANT at
     about 74 units while the long side grows 125, 157, 167, and the left
     corners stay aligned within 2px, so the sheets keep their near edge and
     extend rightward. Edge angles agree within 1.2 degrees and the
     parallelogram defect stays under 3.1px.

     The border runs the WHOLE outline, far edges included. It is deliberately
     not a thickness: VLL called it a window effect rather than a 3D one, after
     a near-edges-only version with a radial fade did not read on the left.
     Its colour is still sampled 1.2px inside the reference's near edge, per
     plane, because one uniform lightening cannot serve all three: the rim runs
     +17 luminance over the face on the yellow against +81 on the blue.

     There is no extra shading overlay on the faces: their gradients are
     measured off the reference and already carry its shading, so a second
     one double counted and darkened the top right corner.

     Faces are sampled only where a plane covers the bare tile. Where it covers
     another plane its colour is a blend: the yellow over the pink departs from
     its own gradient by G-11 B+16, the pink over the blue by R-10. -->
