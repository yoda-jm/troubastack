<!-- Pencil chip - TroubaStudio. Same disc geometry and same white as the play
     chip's triangle for the glyph, but its ground is PINK, layer 2's hue.
     Three shapes, tip to top: triangle, body, and a cap that is the small
     rectangle and its half circle drawn as ONE path, not a rect with a
     separate disc on it. Square corners throughout; the only curve is the
     cap's dome. A 6px gap separates tip/body and body/cap, because solid
     black with no gaps reads as an arrow rather than a pencil. -->
<g transform="translate(786,786)">
  <circle cy="16" r="170" fill="#000000" fill-opacity="0.30"/>
  <circle r="170" fill="url(#gChipPencil)"/>
  <circle r="170" fill="url(#gSheen)"/>
  <circle r="166" fill="none" stroke="url(#gRim)" stroke-width="7.5"/>
  <g transform="rotate(45)" fill="#0C1013">
    <path d="M -27 70 L 27 70 L 0 138 Z"/>
    <rect x="-27" y="-76" width="54" height="140"/>
    <path d="M -27 -82 L -27 -108 A 27 27 0 0 1 27 -108 L 27 -82 Z"/>
  </g>
</g>
