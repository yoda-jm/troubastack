<!-- brick: monogram - "TS".

     The S is much smaller than the T and tucks UNDER the crossbar rather than
     standing beside it. The letters are kept apart: at an earlier spacing their
     strokes overlapped and they touched.

     T and S carry SEPARATE placement transforms, set by VLL in the placement
     page and applied in canvas space exactly as that page applied them, outside
     the monogram's own rotation. Rotation and scale are about each letter's own
     centre, computed by pushing its path points through the transform chain:
     T (180,827), S (292,812).

     The shared chain also nudges (10,-46): at the position first asked for, the
     stem's foot sat 231 from the tile's corner-arc centre against a radius of
     229, so it fell outside the tile.

     The S's stroke is 16 against the T's 24, because its 1.309 placement
     scale multiplies the stroke as well as the size: 16 x 1.309 is 21, so it
     reads finer than the T rather than heavier.

     Pure paths, no font dependency. -->
<g transform="translate(-41.7,49.4) rotate(-1.88 179.8 826.8)">
 <g transform="rotate(-14 512 640) translate(10,-46)">
  <g transform="translate(150,796) skewX(-11) translate(-150,-796)">
   <g stroke="url(#gMono)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 26 706 C 80 700, 192 702, 248 710"/>
    <path d="M 132 706 C 136 766, 134 836, 128 890"/>
   </g>
  </g>
 </g>
</g>
<g transform="translate(-59.6,92.8) translate(292.5,812.0) scale(1.309) translate(-292.5,-812.0)">
 <g transform="rotate(-14 512 640) translate(10,-46)">
  <g transform="translate(150,796) skewX(-11) translate(-150,-796)">
   <g stroke="url(#gMono)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 286 770 C 282 746, 218 742, 216 772 C 214 800, 282 798, 280 828
             C 278 854, 216 854, 210 834"/>
   </g>
  </g>
 </g>
</g>
