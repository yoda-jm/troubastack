<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calage des 3 plans — TroubaStack</title>
<style>
  :root{
    --bg:#0D1116; --panel:#161C23; --line:#28313B; --text:#E8ECF1; --muted:#8B96A3;
    --y:#F5A623; --p:#E43FA8; --b:#2A86E8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px}
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;height:100%;padding:18px}
  @media (max-width:1000px){.wrap{grid-template-columns:1fr;height:auto}}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         padding:12px;display:flex;align-items:center;justify-content:center;min-height:0}
  svg{width:100%;height:auto;max-height:calc(100vh - 60px);touch-action:none;display:block}
  aside{display:flex;flex-direction:column;gap:14px;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  h1{font-size:15px;margin:0 0 2px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:12px;line-height:1.5;margin:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
  button{font:inherit;color:var(--text);background:#20272F;border:1px solid var(--line);
         border-radius:8px;padding:7px 11px;cursor:pointer}
  button:hover{background:#28313B}
  button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
  label.tog{display:inline-flex;gap:7px;align-items:center;color:var(--muted);cursor:pointer}
  textarea{width:100%;height:150px;background:#0B0F14;color:#CFE3FF;border:1px solid var(--line);
           border-radius:8px;padding:10px;font-family:var(--mono);font-size:12px;line-height:1.6;resize:vertical}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .sel{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:8px}
  .sel b{color:var(--text)}
  #loupe{position:fixed;width:170px;height:170px;border-radius:50%;pointer-events:none;
         border:2px solid var(--line);box-shadow:0 8px 30px #0009;display:none;
         background-repeat:no-repeat;z-index:9}
  #loupe::after{content:"";position:absolute;inset:50% auto auto 50%;width:15px;height:15px;
         transform:translate(-50%,-50%);border:1px solid #fff8;border-radius:50%}
  kbd{font-family:var(--mono);background:#20272F;border:1px solid var(--line);
      border-radius:4px;padding:1px 5px;font-size:11px}
</style></head>

<script>

const START = {
  "1":[[229.9,131.5],[298.3,156.3],[185.5,206.7],[117.0,182.0]],
  "2":[[255.9,152.6],[327.1,178.3],[186.9,241.0],[115.6,215.3]],
  "3":[[265.1,183.6],[336.7,209.4],[188.0,275.9],[116.4,250.1]]};
const LET={"1":"ABCD","2":"EFGH","3":"IJKL"},
      COL={"1":"#F5A623","2":"#E43FA8","3":"#2A86E8"},
      NAME={"1":"jaune","2":"rose","3":"bleu"};
let P = JSON.parse(JSON.stringify(START)), sel=null, drag=null;
const svg=document.getElementById('v'), gL=document.getElementById('lines'),
      gQ=document.getElementById('quads'), gP=document.getElementById('pts'),
      out=document.getElementById('out'), loupe=document.getElementById('loupe');
function el(n,a){const e=document.createElementNS('http://www.w3.org/2000/svg',n);
  for(const k in a) e.setAttribute(k,a[k]); return e;}

function draw(){
  gL.textContent=''; gQ.textContent=''; gP.textContent='';
  const showL=document.getElementById('tLines').checked;
  const showF=document.getElementById('tFill').checked;
  ["1","2","3"].forEach(function(g){
    const q=P[g];
    if(showL){ for(let i=0;i<4;i++){
      const a=q[i], b=q[(i+1)%4], dx=b[0]-a[0], dy=b[1]-a[1];
      const L=Math.hypot(dx,dy), t=600/L;
      gL.appendChild(el('line',{x1:a[0]-dx*t,y1:a[1]-dy*t,x2:b[0]+dx*t,y2:b[1]+dy*t,
        stroke:COL[g],'stroke-width':1,'vector-effect':'non-scaling-stroke','stroke-opacity':0.45}));
    }}
    gQ.appendChild(el('polygon',{points:q.map(function(p){return p.join(',');}).join(' '),
      fill:showF?COL[g]:'none','fill-opacity':0.28,stroke:COL[g],'stroke-width':2,
      'vector-effect':'non-scaling-stroke'}));
    q.forEach(function(p,i){
      const key=g+':'+i, on=(sel===key);
      const c=el('circle',{cx:p[0],cy:p[1],r:on?5:4,fill:'#ffffff',stroke:COL[g],
        'stroke-width':on?4:3,'vector-effect':'non-scaling-stroke',style:'cursor:grab'});
      c.dataset.k=key; gP.appendChild(c);
      const t=el('text',{x:p[0]+7,y:p[1]-6,fill:COL[g],'font-size':9,
        'font-family':'ui-monospace,monospace','paint-order':'stroke',
        stroke:'#0D1116','stroke-width':2.5,'pointer-events':'none'});
      t.textContent=LET[g][i]; gP.appendChild(t);
    });
  });
  let s='';
  ["1","2","3"].forEach(function(g){
    s+=NAME[g]+' '+P[g].map(function(p,i){
      return LET[g][i]+'('+p[0].toFixed(1)+','+p[1].toFixed(1)+')';}).join(' ')+'\n';
  });
  out.value=s.replace(/\n$/,'');
  document.getElementById('sel').innerHTML = sel
    ? 'point <b>'+LET[sel[0]][+sel[2]]+'</b> &mdash; '+P[sel[0]][+sel[2]].map(function(n){return n.toFixed(1);}).join(', ')
    : 'aucun point sélectionné';
}
function toSvg(e){
  const m=svg.getScreenCTM().inverse(), p=svg.createSVGPoint();
  p.x=e.clientX; p.y=e.clientY; return p.matrixTransform(m);
}
function showLoupe(e){
  const p=toSvg(e), Z=7, SZ=170;
  loupe.style.display='block';
  loupe.style.left=(e.clientX+26)+'px';
  loupe.style.top=(e.clientY-SZ-14)+'px';
  loupe.style.backgroundImage='url("'+SRC+'")';
  loupe.style.backgroundSize=(332*Z)+'px '+(335*Z)+'px';
  loupe.style.backgroundPosition=(-(p.x-63)*Z+SZ/2)+'px '+(-(p.y-104)*Z+SZ/2)+'px';
}
svg.addEventListener('pointerdown',function(e){
  const k=e.target.dataset ? e.target.dataset.k : null;
  if(!k) return;
  sel=k; drag=k; svg.setPointerCapture(e.pointerId); showLoupe(e); draw();
});
svg.addEventListener('pointermove',function(e){
  if(!drag) return;
  const p=toSvg(e), parts=drag.split(':');
  P[parts[0]][+parts[1]]=[Math.round(p.x*4)/4, Math.round(p.y*4)/4];
  showLoupe(e); draw();
});
svg.addEventListener('pointerup',function(){drag=null; loupe.style.display='none';});
addEventListener('keydown',function(e){
  if(!sel || e.key.indexOf('Arrow')!==0) return;
  const d=e.shiftKey?2:0.25, parts=sel.split(':'), q=P[parts[0]][+parts[1]];
  if(e.key==='ArrowLeft')q[0]-=d; if(e.key==='ArrowRight')q[0]+=d;
  if(e.key==='ArrowUp')q[1]-=d;   if(e.key==='ArrowDown')q[1]+=d;
  q[0]=Math.round(q[0]*4)/4; q[1]=Math.round(q[1]*4)/4;
  e.preventDefault(); draw();
});
document.getElementById('tLines').onchange=draw;
document.getElementById('tFill').onchange=draw;
document.getElementById('reset').onclick=function(){
  P=JSON.parse(JSON.stringify(START)); sel=null; draw();};
document.getElementById('copy').onclick=function(){
  out.select();
  const done=function(){const b=document.getElementById('copy');
    b.textContent='Copié'; setTimeout(function(){b.textContent='Copier';},1200);};
  if(navigator.clipboard){navigator.clipboard.writeText(out.value).then(done,function(){document.execCommand('copy');done();});}
  else {document.execCommand('copy'); done();}
};
draw();
</script>
</body></html>
