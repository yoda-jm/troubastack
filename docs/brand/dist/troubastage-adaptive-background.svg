<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="troubastage adaptive background">
<title>troubastage adaptive background</title>
<!-- Shared paint. Every colour in the family is defined here and nowhere else. -->
<defs>
  <!-- Plane faces. VLL placed the twelve corners on an interactive page; the
       stops are binned averages of the reference's own pixels inside those
       quads, taken ONLY where the plane sits over the bare tile. Where a plane
       covers another its colour is a blend, not its own: measured, the yellow
       reading over the pink departs from its own gradient by G-11 B+16, and the
       pink over the blue by R-10. Solving those overlaps for the front plane's
       alpha gives 0.82 and 0.955, so the faces carry roughly 4 to 18 percent
       transparency; that estimate is weak, since it needs the hidden plane's
       gradient extrapolated under its neighbour, and 0.90 is taken as the
       middle of it. -->
  <linearGradient id="gLayer1" gradientUnits="userSpaceOnUse"
                  x1="663.5" y1="256.4" x2="225.2" y2="131.7">
    <stop offset="0.0" stop-color="#FC9F62"/><stop offset="0.2" stop-color="#F9AD5C"/><stop offset="0.4" stop-color="#F9BA57"/><stop offset="0.6" stop-color="#FCCC55"/><stop offset="0.8" stop-color="#FEDB5E"/><stop offset="1.0" stop-color="#FEE76C"/>
  </linearGradient>
  <linearGradient id="gLayer2" gradientUnits="userSpaceOnUse"
                  x1="474.6" y1="188.8" x2="473.9" y2="382.8">
    <stop offset="0.0" stop-color="#DC3EAA"/><stop offset="0.2" stop-color="#DE42B4"/><stop offset="0.4" stop-color="#DB2C9A"/><stop offset="0.6" stop-color="#E13198"/><stop offset="0.8" stop-color="#ED5BBE"/><stop offset="1.0" stop-color="#F87EE0"/>
  </linearGradient>
  <linearGradient id="gLayer3" gradientUnits="userSpaceOnUse"
                  x1="487.1" y1="318.6" x2="517.6" y2="496.4">
    <stop offset="0.0" stop-color="#0C4DB7"/><stop offset="0.2" stop-color="#115CC6"/><stop offset="0.4" stop-color="#1769D1"/><stop offset="0.6" stop-color="#1B73D7"/><stop offset="0.8" stop-color="#2A8FE9"/><stop offset="1.0" stop-color="#41ACF8"/>
  </linearGradient>
  <!-- Cast shadow of the plane above, measured on the reference: the
       luminance residual against each face's own fitted gradient is -12 at
       the occluding edge on the pink and -8 on the blue, reaching zero by
       10 to 12px on a 332px tile, hence about 34 at our scale.
       No SVG filter: a blur would not survive conversion to VectorDrawable,
       the same constraint that shaped the chips. The softness is six
       progressively DILATED copies of the plane above, each at low opacity
       and clipped to the plane below, so coverage is highest against the
       occluding edge and thins outward.
       Dilation, not translation: offsetting the copies downward would have
       darkened with distance instead of toward the edge. An earlier version
       hung one gradient band off each edge of the chain and the two
       overlapped at the bottom corner, printing a dark chevron. -->
  <clipPath id="clipPlane2">
    <path d="M 562.0 163.0 Q 595.0 148.6 628.8 160.8 L 783.5 216.4 Q 817.3 228.6 784.5 243.5 L 409.1 413.1 Q 376.3 427.9 342.8 414.6 L 190.8 354.1 Q 157.3 340.8 190.3 326.3 Z"/>
  </clipPath>
  <clipPath id="clipPlane3">
    <path d="M 598.8 253.1 Q 631.7 238.4 665.4 250.9 L 810.7 304.8 Q 844.5 317.3 811.9 332.5 L 409.8 519.7 Q 377.2 534.9 344.0 521.1 L 197.9 460.4 Q 164.7 446.6 197.6 431.9 Z"/>
  </clipPath>
  <!-- Staff rules. Measured on the reference: the rules are pure white, and
       their brightness holds a plateau across the middle then falls off at both
       ends (luminance 62 at 11% of the width, 255 through the middle, 48 at
       93%). So: white, with an oval falloff rather than a straight fade.
       VLL then asked for the falloff to start earlier and go further than the
       reference's own, so these stops are deliberately steeper than measured.
       userSpaceOnUse, NOT the default objectBoundingBox: a horizontal <line>
       has a zero-height bounding box, and a bbox-relative gradient degenerates
       on it. Coordinates are the staff's own, inside the rotated group. -->
  <radialGradient id="gRule" gradientUnits="userSpaceOnUse"
                  cx="515" cy="640" r="428"
                  gradientTransform="translate(515,640) scale(1,0.55) translate(-515,-640)">
    <stop offset="0"    stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="0.50" stop-color="#FFFFFF" stop-opacity="0.92"/>
    <stop offset="0.78" stop-color="#FFFFFF" stop-opacity="0.45"/>
    <stop offset="0.94" stop-color="#FFFFFF" stop-opacity="0.08"/>
    <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <!-- Chip sheen: a lit shoulder, so the disc reads as a raised object. -->
  <radialGradient id="gSheen" cx="0.32" cy="0.26" r="0.85">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/>
    <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.16"/>
  </radialGradient>
  <!-- One white for both chips: the play triangle and the pencil disc are the
       same material, so they take the same gradient. -->
  <linearGradient id="gWhite" x1="0.1" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.55" stop-color="#F6F1EA"/>
    <stop offset="1" stop-color="#DFD7CC"/>
  </linearGradient>
  <!-- Chip grounds. Each takes its own layer's hue, keeping the darkening
       profile the play chip already had: light at the upper left, deepening
       toward the lower right. Yellow is layer 1, pink layer 2, blue layer 3. -->
  <linearGradient id="gChipPlay" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0"    stop-color="#FEE36A"/>
    <stop offset="0.22" stop-color="#FCD25A"/>
    <stop offset="0.48" stop-color="#F7BB4E"/>
    <stop offset="0.72" stop-color="#E09E36"/>
    <stop offset="1"    stop-color="#B87A1C"/>
  </linearGradient>
  <linearGradient id="gChipPencil" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0"    stop-color="#F87EE0"/>
    <stop offset="0.22" stop-color="#EE60C9"/>
    <stop offset="0.48" stop-color="#E13198"/>
    <stop offset="0.72" stop-color="#C62680"/>
    <stop offset="1"    stop-color="#9E1B62"/>
  </linearGradient>
  <linearGradient id="gChipCore" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0"    stop-color="#41ACF8"/>
    <stop offset="0.22" stop-color="#2A8FE9"/>
    <stop offset="0.48" stop-color="#1769D1"/>
    <stop offset="0.72" stop-color="#1153B4"/>
    <stop offset="1"    stop-color="#0B3B88"/>
  </linearGradient>
  <!-- Lit rim: the disc's upper-left arc catches light, the lower-right falls
       into shade. A stroke, not a filter — filters do not survive VectorDrawable. -->
  <linearGradient id="gRim" x1="0.15" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
    <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.28"/>
  </linearGradient>
  <linearGradient id="gChipStack" x1="0" y1="0" x2="0.9" y2="1">
    <stop offset="0"    stop-color="#5A6674"/>
    <stop offset="0.22" stop-color="#48535F"/>
    <stop offset="0.48" stop-color="#333D48"/>
    <stop offset="0.72" stop-color="#28313B"/>
    <stop offset="1"    stop-color="#1A222A"/>
  </linearGradient>
  <!-- Whirl blades: each sweeps from its layer's light tint to its body
       colour, so the three read as turning rather than as flat wedges. -->
  <linearGradient id="gBladeY" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#FEE36A"/><stop offset="1" stop-color="#E8A32C"/>
  </linearGradient>
  <linearGradient id="gBladeP" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#FA8FD8"/><stop offset="1" stop-color="#D62A8A"/>
  </linearGradient>
  <linearGradient id="gBladeB" x1="0.1" y1="0" x2="0.9" y2="1">
    <stop offset="0" stop-color="#5DC9F8"/><stop offset="1" stop-color="#1769D1"/>
  </linearGradient>
  <linearGradient id="gTile" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#26333F"/><stop offset="1" stop-color="#1B242D"/>
  </linearGradient>
  <!-- Vignette: lifts the centre so the artwork sits in light. -->
  <radialGradient id="gVignette" cx="0.42" cy="0.34" r="0.78">
    <stop offset="0" stop-color="#3A4A59" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.30"/>
  </radialGradient>
  <linearGradient id="gMono" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#FFFCF2" stop-opacity="0.98"/>
    <stop offset="1" stop-color="#F2E9D4" stop-opacity="0.92"/>
  </linearGradient>
</defs>
<rect x="0" y="0" width="1024" height="1024" fill="url(#gTile)"/>
</svg>
