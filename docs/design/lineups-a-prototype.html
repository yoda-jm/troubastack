<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Studio's own tokens (web/studio/src/styles.css): warm paper ground, one brand pink, musician tints for identity.
   Layout: the grid owns the screen. One toolbar row, then a scroll box that ends at the window's bottom edge,
   so both of its scrollbars (right and bottom) are always on screen. The page itself never scrolls. */
:root {
  --bg: #f7f4ee; --surface: #fffdfa; --stripe: #f8f4ec; --head: #faf6f0; --row-hover: #f3ece2;
  --fg: #201d29; --muted: #6d6979; --border: #e7e1d8; --border-strong: #d8d1c5;
  --grid-line: #efe9df; --grid-group: #ddd5c8;
  --brand: #d11e87; --brand-strong: #a9186d; --brand-ink: #9b1664; --brand-tint: #fbe9f3; --on-brand: #ffffff;
  --warn-bg: #fbf0dd; --warn-fg: #8f5207;
  --edge: rgba(40, 34, 24, .24); --menu-shadow: 0 10px 30px rgba(40, 34, 24, .16);
  --scroll-track: #f1ece4; --scroll-thumb: #c4baab; --scroll-thumb-hover: #9f9587;
  --m0-bg: hsl(220 75% 93%); --m0-fg: hsl(220 62% 30%);
  --m1-bg: hsl(26 85% 91%);  --m1-fg: hsl(24 90% 26%);
  --m2-bg: hsl(150 45% 90%); --m2-fg: hsl(152 70% 21%);
  --m3-bg: hsl(270 70% 94%); --m3-fg: hsl(272 55% 34%);
  --m4-bg: hsl(340 70% 93%); --m4-fg: hsl(338 70% 31%);
  --m5-bg: hsl(188 55% 89%); --m5-fg: hsl(190 80% 22%);
  --m6-bg: hsl(46 85% 87%);  --m6-fg: hsl(36 90% 23%);
  --m7-bg: hsl(96 40% 88%);  --m7-fg: hsl(100 60% 22%);
  --font-display: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --row-h: 32px; --cell-w: 60px; --song-w: 248px; --ctl-h: 36px; --edit-btn: 26px; --head1: 32px; --head2: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e16; --surface: #191722; --stripe: #1d1a27; --head: #221f2d; --row-hover: #262232;
    --fg: #efeaf6; --muted: #a49eb3; --border: #2b2836; --border-strong: #3a3648;
    --grid-line: #262331; --grid-group: #3d3950;
    --brand: #e23b9d; --brand-strong: #e54da6; --brand-ink: #ef7cc0; --brand-tint: #2c1a28; --on-brand: #100e16;
    --warn-bg: #2b2111; --warn-fg: #f0b45a;
    --edge: rgba(0, 0, 0, .55); --menu-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --scroll-track: #1d1a27; --scroll-thumb: #4b4661; --scroll-thumb-hover: #67607e;
    --m0-bg: hsl(220 35% 25%); --m0-fg: hsl(220 90% 86%);
    --m1-bg: hsl(26 35% 23%);  --m1-fg: hsl(28 90% 80%);
    --m2-bg: hsl(150 30% 20%); --m2-fg: hsl(150 60% 76%);
    --m3-bg: hsl(270 30% 26%); --m3-fg: hsl(270 90% 87%);
    --m4-bg: hsl(340 30% 25%); --m4-fg: hsl(340 85% 85%);
    --m5-bg: hsl(188 35% 20%); --m5-fg: hsl(188 70% 76%);
    --m6-bg: hsl(42 35% 21%);  --m6-fg: hsl(44 90% 74%);
    --m7-bg: hsl(96 25% 20%);  --m7-fg: hsl(96 55% 74%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #100e16; --surface: #191722; --stripe: #1d1a27; --head: #221f2d; --row-hover: #262232;
  --fg: #efeaf6; --muted: #a49eb3; --border: #2b2836; --border-strong: #3a3648;
  --grid-line: #262331; --grid-group: #3d3950;
  --brand: #e23b9d; --brand-strong: #e54da6; --brand-ink: #ef7cc0; --brand-tint: #2c1a28; --on-brand: #100e16;
  --warn-bg: #2b2111; --warn-fg: #f0b45a;
  --edge: rgba(0, 0, 0, .55); --menu-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --scroll-track: #1d1a27; --scroll-thumb: #4b4661; --scroll-thumb-hover: #67607e;
  --m0-bg: hsl(220 35% 25%); --m0-fg: hsl(220 90% 86%);
  --m1-bg: hsl(26 35% 23%);  --m1-fg: hsl(28 90% 80%);
  --m2-bg: hsl(150 30% 20%); --m2-fg: hsl(150 60% 76%);
  --m3-bg: hsl(270 30% 26%); --m3-fg: hsl(270 90% 87%);
  --m4-bg: hsl(340 30% 25%); --m4-fg: hsl(340 85% 85%);
  --m5-bg: hsl(188 35% 20%); --m5-fg: hsl(188 70% 76%);
  --m6-bg: hsl(42 35% 21%);  --m6-fg: hsl(44 90% 74%);
  --m7-bg: hsl(96 25% 20%);  --m7-fg: hsl(96 55% 74%);
  color-scheme: dark;
}
@media (pointer: coarse) {
  :root { --row-h: 44px; --cell-w: 56px; --song-w: 210px; --ctl-h: 44px; --edit-btn: 40px; --head1: 44px; --head2: 30px; }
}
@media (max-width: 860px) { :root { --song-w: 172px; } }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.35 var(--font-body); overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

.app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.topbar { flex: none; height: 48px; display: flex; align-items: center; gap: 18px; background: var(--surface); border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.brand b { color: var(--brand); font-weight: 700; }
.back { color: var(--brand-ink); font-weight: 600; text-decoration: none; }
.tabs { display: flex; align-self: stretch; }
.tabs a { display: flex; align-items: center; padding: 0 10px; color: var(--muted); font-weight: 600; text-decoration: none; }
.tabs a[aria-current="page"] { color: var(--brand-strong); box-shadow: inset 0 -2px 0 var(--brand); }
.me { margin-left: auto; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 13px; }

.toolbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-block: 10px; }
.filter { flex: 1 1 240px; min-width: 0; height: var(--ctl-h); padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
.btn { height: var(--ctl-h); padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 700; }
.hidden-chip { display: flex; align-items: center; gap: 2px; height: var(--ctl-h); padding: 0 4px 0 10px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.hidden-chip button { min-width: 32px; height: 32px; border: 0; background: transparent; font-size: 16px; cursor: pointer; border-radius: 6px; }
.proto { display: flex; align-items: center; gap: 6px; margin-left: auto; padding: 3px 8px; border: 1px dashed var(--border-strong); border-radius: 8px; color: var(--muted); font-size: 12px; }
.proto legend { float: left; padding: 0 4px 0 0; font-weight: 700; }
.proto label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

.jump { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 8px; }
.jump span { color: var(--muted); font-size: 12px; font-weight: 600; margin-right: 2px; }
.jump button { height: calc(var(--ctl-h) - 6px); padding: 0 12px; border: 0; border-radius: 999px; background: var(--mbg); color: var(--mfg); font-weight: 650; font-size: 13px; cursor: pointer; }

.grid-wrap { flex: 1; min-height: 0; position: relative; margin-left: max(16px, env(safe-area-inset-left, 0px)); margin-right: max(16px, env(safe-area-inset-right, 0px)); border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
.grid-scroll { position: absolute; inset: 0; overflow: auto; overscroll-behavior: contain; }
/* Scrollbars only along what scrolls: the vertical track starts under the frozen header, the horizontal one after
   the frozen song column. Chromium (Edge, the Windows and Android apps) and Safari honour track margins; Firefox
   keeps its own full-length bar. Mouse screens only: a touch screen keeps its thin fading bars and the edge shadows. */
@media (pointer: fine) {
  .grid-scroll::-webkit-scrollbar { width: 14px; height: 14px; background: var(--head); }
  .grid-scroll::-webkit-scrollbar-track { background: var(--scroll-track); }
  .grid-scroll::-webkit-scrollbar-track:vertical { margin-top: var(--head-px, 58px); }
  .grid-scroll::-webkit-scrollbar-track:horizontal { margin-left: var(--song-px, 248px); }
  .grid-scroll::-webkit-scrollbar-thumb { background-color: var(--scroll-thumb); background-clip: padding-box; border: 3px solid transparent; border-radius: 7px; }
  .grid-scroll::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-thumb-hover); }
  .grid-scroll::-webkit-scrollbar-corner { background: var(--head); }
}
.edge { position: absolute; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 6; }
.edge.on { opacity: 1; }
.edge-l { top: 0; bottom: var(--sbh, 0px); left: var(--song-px, 248px); width: 14px; background: linear-gradient(to right, var(--edge), transparent); }
.edge-r { top: 0; bottom: var(--sbh, 0px); right: var(--sbw, 0px); width: 24px; background: linear-gradient(to left, var(--edge), transparent); }
.edge-t { left: 0; right: var(--sbw, 0px); top: var(--head-px, 58px); height: 10px; background: linear-gradient(to bottom, var(--edge), transparent); }
@media (prefers-reduced-motion: reduce) { .edge { transition: none; } }

table.grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; min-width: 100%; }
.grid .fill { border-left: 2px solid var(--grid-group); }
.grid th, .grid td { padding: 0; }
.grid thead th { position: sticky; background: var(--head); z-index: 3; }
.grid tr.h1 th { top: 0; height: var(--head1); }
.grid tr.h2 th { top: var(--head1); height: var(--head2); border-bottom: 1px solid var(--grid-group); }
.grid th.corner { left: 0; z-index: 5; width: var(--song-w); min-width: var(--song-w); max-width: var(--song-w); text-align: left; vertical-align: bottom; padding: 0 12px 7px; border-right: 1px solid var(--grid-group); border-bottom: 1px solid var(--grid-group); }
.grid th.corner .count { color: var(--muted); font-weight: 500; font-size: 12px; }
.grid th.mus { z-index: 4; background: var(--mbg); color: var(--mfg); border-left: 2px solid var(--grid-group); white-space: nowrap; }
.mus-in { display: flex; align-items: center; justify-content: center; gap: 2px; padding: 0 4px; overflow: hidden; }
.mus-in .mname { overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
.more { flex: none; width: var(--edit-btn); height: var(--edit-btn); border: 0; border-radius: 6px; background: transparent; font-weight: 700; font-size: 16px; line-height: 1; cursor: pointer; }
.more:hover, .more[aria-expanded="true"] { background: color-mix(in srgb, currentColor 14%, transparent); }
.menu { position: absolute; top: calc(var(--head1) - 2px); left: 4px; z-index: 20; width: 200px; padding: 6px; display: grid; gap: 2px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--menu-shadow); text-align: left; font-weight: 500; }
.menu button { height: var(--ctl-h); padding: 0 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--brand-tint); }
.menu .warn { color: var(--warn-fg); }
.grid th.sub { width: var(--cell-w); min-width: var(--cell-w); max-width: var(--cell-w); font-size: 12px; font-weight: 650; color: var(--muted); border-left: 1px solid var(--grid-line); }
.grid th.sub.g0, .grid td.g0 { border-left: 2px solid var(--grid-group); }

.grid tbody th.song { position: sticky; left: 0; z-index: 2; width: var(--song-w); min-width: var(--song-w); max-width: var(--song-w); height: var(--row-h); text-align: left; font-weight: 500; border-right: 1px solid var(--grid-group); }
.song-in { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 4px; min-width: 0; }
.edit { flex: none; width: var(--edit-btn); height: var(--edit-btn); display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.edit:hover { background: var(--brand-tint); color: var(--brand-strong); }
.title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grid tbody td { width: var(--cell-w); height: var(--row-h); border-left: 1px solid var(--grid-line); }
.grid tbody tr > * { background: var(--surface); }
.grid tbody tr:nth-child(even) > * { background: var(--stripe); }
@media (hover: hover) { .grid tbody tr:hover > * { background: var(--row-hover); } }
.cell { display: block; width: calc(100% - 6px); height: calc(var(--row-h) - 6px); margin: 3px; padding: 0; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-weight: 650; cursor: pointer; }
.cell.on { background: var(--mbg); color: var(--mfg); }
@media (hover: hover) { .cell:not(.on):hover::after { content: "+"; color: var(--muted); font-weight: 500; } }
.cell:focus-visible { outline-offset: -2px; }
.m0 { --mbg: var(--m0-bg); --mfg: var(--m0-fg); } .m1 { --mbg: var(--m1-bg); --mfg: var(--m1-fg); }
.m2 { --mbg: var(--m2-bg); --mfg: var(--m2-fg); } .m3 { --mbg: var(--m3-bg); --mfg: var(--m3-fg); }
.m4 { --mbg: var(--m4-bg); --mfg: var(--m4-fg); } .m5 { --mbg: var(--m5-bg); --mfg: var(--m5-fg); }
.m6 { --mbg: var(--m6-bg); --mfg: var(--m6-fg); } .m7 { --mbg: var(--m7-bg); --mfg: var(--m7-fg); }

.status { flex: none; min-height: 30px; display: flex; align-items: center; color: var(--muted); font-size: 12px; padding-block: 4px; }

dialog.sheet { width: min(720px, calc(100vw - 32px)); max-height: min(760px, calc(100dvh - 48px)); padding: 0; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); color: var(--fg); box-shadow: var(--menu-shadow); }
dialog.sheet::backdrop { background: rgba(16, 14, 22, .45); }
dialog.sheet[open] { display: flex; flex-direction: column; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px 10px; }
.dlg-head > div { flex: 1; min-width: 0; }
.dlg-pos { margin: 0; color: var(--muted); font-size: 13px; }
.dlg-head h2 { margin: 2px 0 0; font-family: var(--font-display); font-size: 26px; line-height: 1.15; font-weight: 600; text-wrap: balance; }
.dlg-body { flex: 1; min-height: 0; overflow: auto; padding: 0 22px; }
.dlg-row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--grid-line); }
.dlg-name { display: flex; align-items: center; gap: 8px; min-height: 40px; font-weight: 700; }
.dlg-name i { width: 10px; height: 10px; border-radius: 50%; background: var(--mfg); }
.togs { display: flex; flex-wrap: wrap; gap: 8px; }
.tog { min-height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 1.5px solid var(--border-strong); border-radius: 20px; background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }
.tog small { opacity: .7; font-size: 12px; }
.tog[aria-pressed="true"] { background: var(--mbg); color: var(--mfg); border-color: var(--mfg); }
.tog[aria-pressed="true"]::before { content: "✓"; }
.dlg-note { margin: 10px 0 14px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.dlg-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 22px 18px; border-top: 1px solid var(--grid-line); }
@media (pointer: coarse), (max-width: 640px) {
  dialog.sheet { width: 100%; max-width: none; margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 78dvh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .dlg-row { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .dlg-foot .btn { flex: 1; height: 50px; font-size: 15px; }
  .tog { min-height: 46px; }
}
@media (max-width: 640px) { .tabs, .proto legend { display: none; } }

/* Editing the band: the musician editor (a sheet like the song editor) and the parts panel (a side panel). */
.btn[aria-pressed="true"] { background: var(--brand-tint); border-color: var(--brand); color: var(--brand-ink); }
.mname-btn { min-width: 0; padding: 2px 6px; border: 0; border-radius: 6px; background: transparent; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.mname-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
.fsec { padding: 12px 0; border-top: 1px solid var(--grid-line); display: grid; gap: 8px; }
.fsec:first-child { border-top: 0; }
.flabel { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.fhint { margin: 0; color: var(--muted); font-size: 13px; }
.finput { height: 40px; max-width: 360px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { width: 64px; height: 52px; display: grid; place-items: center; border: 2px solid transparent; border-radius: 12px; background: var(--mbg); color: var(--mfg); font-size: 12px; font-weight: 700; cursor: pointer; }
.sw[aria-pressed="true"] { border-color: var(--mfg); box-shadow: 0 0 0 2px var(--surface) inset; }
.sw span { max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-ed { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 4px 0 14px; border-radius: 20px; background: var(--mbg); color: var(--mfg); font-weight: 600; }
.chip-ed small { opacity: .7; font-size: 12px; }
.chip-ed button { width: 32px; height: 32px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; }
.chip-ed button:hover { background: color-mix(in srgb, currentColor 14%, transparent); }
.add-chip { min-height: 40px; padding: 0 14px; border: 1.5px dashed var(--border-strong); border-radius: 20px; background: transparent; font-weight: 600; cursor: pointer; }
.add-chip:hover { border-color: var(--muted); }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline-form input, .inline-form select { height: 40px; padding: 0 10px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
.inline-form input.grow { flex: 1 1 200px; min-width: 0; }
.inline-form input.short { width: 72px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.confirm .btn { height: 34px; }
.foot-left { margin-right: auto; color: var(--warn-fg); }

.panel { position: fixed; z-index: 40; top: 48px; right: 0; bottom: 0; width: min(460px, 100vw); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border); box-shadow: var(--menu-shadow); padding-right: env(safe-area-inset-right, 0px); }
.panel-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px 10px; }
.panel-head h2 { flex: 1; margin: 0; font-family: var(--font-display); font-size: 22px; font-weight: 600; }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 0 18px 18px; display: grid; align-content: start; gap: 6px; }
.panel h3 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.plist, .tlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.plist li, .tlist li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-height: 44px; padding: 4px 6px; border-radius: 8px; }
.plist li:nth-child(odd), .tlist li:nth-child(odd) { background: var(--stripe); }
.pname { font-weight: 600; }
.tag { color: var(--muted); font-size: 12px; }
.plist select { height: 34px; margin-left: auto; max-width: 150px; border: 1px solid var(--border-strong); border-radius: 8px; background: var(--surface); }
.icon-btn { width: 34px; height: 34px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--brand-tint); color: var(--brand-strong); }
.warn-text { color: var(--warn-fg); font-size: 12px; }
.linkish { border: 0; background: transparent; color: var(--brand-ink); font-weight: 600; cursor: pointer; padding: 4px; }
@media (pointer: coarse), (max-width: 640px) {
  .panel { top: auto; left: 0; width: auto; height: 82dvh; border-left: 0; border-radius: 20px 20px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .plist select, .icon-btn { height: 44px; }
  .icon-btn { width: 44px; }
}

/* The list opened from the middle of a voice chip, in the song's detailed view. */
.choice { position: fixed; z-index: 30; min-width: 220px; padding: 6px; display: grid; gap: 2px; background: var(--surface); color: var(--fg); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--menu-shadow); }
.choice-title { margin: 2px 8px 6px; color: var(--muted); font-size: 12px; }
.choice button { display: flex; align-items: center; gap: 10px; height: var(--ctl-h); padding: 0 10px; border: 0; border-radius: 6px; background: transparent; text-align: left; cursor: pointer; }
.choice button:hover { background: var(--row-hover); }
.choice button[aria-checked="true"] { background: var(--mbg); color: var(--mfg); font-weight: 650; }
.choice .code { min-width: 40px; padding: 2px 6px; border-radius: 6px; background: var(--mbg); color: var(--mfg); font-size: 12px; font-weight: 700; text-align: center; }
.choice .code.none { background: transparent; color: var(--muted); }
.choice kbd { margin-left: auto; color: var(--muted); font: 12px var(--font-body); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--border-strong); border-radius: 21px; overflow: hidden; }
.seg button { min-height: 40px; padding: 0 14px; border: 0; border-left: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; }

@media (pointer: coarse), (max-width: 640px) { .seg button { min-height: 46px; } .choice button { height: 46px; } }

/* Voice in the song's detailed view: a round chip ‹ value ›. The arrows step None → Lead → Backing → Both; the middle
   opens the list. (In the grid a click just steps to the next value.) */

@media (pointer: coarse), (max-width: 640px) { .vstep { height: 48px; border-radius: 24px; } .vstep .arr { width: 46px; font-size: 18px; } .vstep .val { min-width: 96px; font-size: 15px; } }
</style>

<script>
(function () {
  "use strict";
  // Example data only: invented names and titles, the same shape as a real band (48 songs, ~2.3 players a song).
  var COLOURS = ["Blue", "Orange", "Green", "Purple", "Rose", "Teal", "Amber", "Olive"];
  var parts = [

    { id: "Uku", name: "Ukulele", short: "Uku", kind: "instrument" }, { id: "Bs", name: "Bass", short: "Bs", kind: "instrument" },
    { id: "Key", name: "Keys", short: "Key", kind: "instrument" }, { id: "Acc", name: "Accordion", short: "Acc", kind: "instrument" },
    { id: "Caj", name: "Cajón", short: "Caj", kind: "instrument" }, { id: "Dje", name: "Djembe", short: "Dje", kind: "instrument" },
    { id: "Bgo", name: "Bongos", short: "Bgo", kind: "instrument" }, { id: "Sn", name: "Snare", short: "Sn", kind: "instrument" },
    { id: "Hp", name: "Handpan", short: "Hp", kind: "instrument" }, { id: "Dr", name: "Drums", short: "Dr", kind: "instrument" },
    { id: "Pc", name: "Percussion", short: "Pc", kind: "instrument" }, { id: "Vln", name: "Violin", short: "Vln", kind: "instrument" },
    { id: "Mdl", name: "Mandolin", short: "Mdl", kind: "instrument" }, { id: "Tpt", name: "Trumpet", short: "Tpt", kind: "instrument" },
    { id: "Sax", name: "Saxophone", short: "Sax", kind: "instrument" }, { id: "Cl", name: "Clarinet", short: "Cl", kind: "instrument" },
    { id: "Flt", name: "Flute", short: "Flt", kind: "instrument" }
  ];
  var mus = [
    { id: "a", name: "Alex", ci: 0, inst: ["EG", "AG", "Uku"] }, { id: "b", name: "Bastien", ci: 1, inst: ["Caj", "Dje", "Bgo", "Sn", "Hp"] },
    { id: "c", name: "Chloé", ci: 2, inst: ["Acc"] }, { id: "d", name: "Dana", ci: 3, inst: ["Bs", "Key"] },
    { id: "f", name: "Fanny", ci: 5, inst: ["Vln", "Mdl"] }, { id: "g", name: "Gaspard", ci: 6, inst: ["Tpt", "Sax", "Cl"] },
    { id: "h", name: "Hugo", ci: 7, inst: ["Dr", "Pc"] }, { id: "e", name: "Eli", ci: 4, inst: ["Flt"] }
  ];
  var BANDS = { small: ["a", "b", "c", "d", "e"], large: ["a", "b", "c", "d", "f", "g", "h", "e"] };
  var TITLES = ["À la lisière", "Alizés", "Au bout du quai", "Balade des cerfs-volants", "Banquise", "Belle étoile", "Brume de mai", "Café des marins", "Caravane", "Chanson pour Margot", "Cinq heures du matin", "Coquelicots", "Danse du fanal", "Derrière la colline", "Deux rives", "Douce pluie", "Éclaircie", "En roue libre", "Feu de camp", "Fil d'Ariane", "Grand large", "Horizon bleu", "Jardin suspendu", "Kilomètre zéro", "La complainte du gardien de phare / Retour au port", "La valse des lampions", "Le bal des mouettes", "Le vieux moulin", "Les heures claires", "Lune rousse", "Marée haute", "Midnight Ferry", "Neon River", "Nuit d'orage", "Orange sanguine", "Paper Lanterns", "Petit matin", "Quatre saisons plus une", "Rue des tilleuls", "Silver Lining Road", "Sous le pont", "Tango du grenier", "Train de nuit", "Une autre fois", "Vent d'est", "Velvet Morning", "Zéphyr", "Zinc et velours"];
  var PENCIL = '<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M12.8 3.6l3.6 3.6L7.2 16.4H3.6v-3.6z M10.8 5.6l3.6 3.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  var tracks = [], nextId = 1;

  function seed() {
    var s = 20261114, cells = {};
    function rnd() { s = (s + 0x6D2B79F5) | 0; var t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
    TITLES.forEach(function (title, i) {
      if (i % 12 === 5) return;
      var n = 1 + Math.floor(rnd() * 3.6);
      mus.map(function (m) { return { m: m, r: rnd() }; }).sort(function (x, y) { return x.r - y.r; }).slice(0, n).forEach(function (p) {
        var m = p.m, r = rnd(), base = i + ":" + m.id + ":";
        if (r < 0.4) { var v = rnd(); if (v < 0.6) cells[base + "L"] = true; else if (v < 0.88) cells[base + "B"] = true; else { cells[base + "L"] = true; cells[base + "B"] = true; } }
        var k = r < 0.4 ? (rnd() < 0.3 ? 1 : 0) : (rnd() < 0.82 ? 1 : 2);
        for (var j = 0; j < k; j++) cells[base + m.inst[Math.floor(rnd() * m.inst.length)]] = true;
      });
    });
    return cells;
  }

  var st = { band: "large", hidden: ["e"], order: mus.map(function (m) { return m.id; }), cells: seed(), q: "", dlg: null, rows: [],
    musEdit: null, musNew: false, pendingRm: null, swapNote: "", trackFor: null, renameTrack: null, delTrack: null };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), scroll = $("scroll"), wrap = $("wrap"), choice = $("choice");
  var coarse = window.matchMedia("(pointer: coarse)");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  function esc(t) { return String(t).replace(/[&<>"]/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]; }); }
  function find(list, id) { for (var k = 0; k < list.length; k++) if (list[k].id === id) return list[k]; return null; }
  function part(id) { return find(parts, id); }
  function musician(id) { return find(mus, id); }
  function plural(n, w) { return n + " " + w + (n === 1 ? "" : "s"); }
  function voiceLabel(p) { return p.name.replace(/ voice$/i, ""); }

  function visible() {
    var inBand = BANDS[st.band];
    return st.order.filter(function (id) { return inBand.indexOf(id) >= 0 && st.hidden.indexOf(id) < 0; }).map(musician);
  }
  function hiddenInBand() { return st.hidden.filter(function (id) { return BANDS[st.band].indexOf(id) >= 0; }); }
  function voiceParts() { return parts.filter(function (p) { return p.kind === "voice" && !p.shared; }); }

  // A musician's columns: Voice (a choice among the voice parts), then one column per instrument, except that
  // parts put on the same track share one column (a choice among them), as Studio's tracks do today.
  function columns(m) {
    var cols = [], vp = voiceParts(), byKey = {};
    if (vp.length) cols.push({ key: "voice", voice: true, members: vp.map(function (p) { return p.id; }), label: "Voice", full: "Voice: " + vp.map(function (p) { return p.short + " = " + p.name; }).join(", ") });
    parts.forEach(function (p) {
      if (p.kind === "voice" || p.shared || m.inst.indexOf(p.id) < 0) return;
      var k = p.track ? "t:" + p.track : "p:" + p.id;
      if (!byKey[k]) { byKey[k] = { key: k, members: [], track: p.track || null }; cols.push(byKey[k]); }
      byKey[k].members.push(p.id);
    });
    cols.forEach(function (c) {
      if (c.voice) return;
      if (c.track) {
        var t = find(tracks, c.track);
        c.label = t.short; c.full = t.name + " track: " + c.members.map(function (id) { return part(id).name; }).join(", ");
      } else { c.label = part(c.members[0]).short; c.full = part(c.members[0]).name; }
    });
    return cols;
  }
  function playing(i, mid, members) { return members.filter(function (id) { return st.cells[i + ":" + mid + ":" + id]; }); }
  function cellText(i, mid, members) { return playing(i, mid, members).map(function (id) { return part(id).short; }).join("+"); }
  function setPlaying(i, mid, members, on) {
    members.forEach(function (id) { var k = i + ":" + mid + ":" + id; if (on.indexOf(id) >= 0) st.cells[k] = true; else delete st.cells[k]; });
  }
  function songsUsing(mid, pid) { var n = 0; TITLES.forEach(function (t, i) { if (st.cells[i + ":" + mid + ":" + pid]) n++; }); return n; }

  function filteredRows(vis) {
    var q = st.q.trim().toLowerCase(), out = [];
    TITLES.forEach(function (t, i) {
      if (!q || t.toLowerCase().indexOf(q) >= 0 || vis.some(function (m) {
        return parts.some(function (p) {
          if (!st.cells[i + ":" + m.id + ":" + p.id]) return false;
          return m.name.toLowerCase().indexOf(q) === 0 || p.short.toLowerCase() === q || p.name.toLowerCase().indexOf(q) === 0;

    var h = '<thead><tr class="h1"><th class="corner" rowspan="2" scope="col">Song <span class="count">' + st.rows.length + "</span></th>";
    vis.forEach(function (m) {

      h += '<th class="mus m' + m.ci + '" colspan="' + n + '" scope="colgroup" id="mus-' + m.id + '"><div class="mus-in">' +
        '<button type="button" class="mname-btn" data-editmus="' + m.id + '" title="Edit ' + esc(m.name) + '">' + esc(m.name) + '</button>' +
        '<button type="button" class="more" aria-label="More for ' + esc(m.name) + '" aria-haspopup="menu" aria-expanded="false" data-more="' + m.id + '">⋯</button></div>' +
        '<div class="menu" role="menu" hidden data-menu="' + m.id + '">' +
        '<button type="button" role="menuitem" data-act="edit" data-mid="' + m.id + '">Edit musician…</button>' +
        '<button type="button" role="menuitem" data-act="left" data-mid="' + m.id + '">◀ Move left</button>' +
        '<button type="button" role="menuitem" data-act="right" data-mid="' + m.id + '">Move right ▶</button>' +

      var t = TITLES[i];

      });

    var hid = hiddenInBand(), chip = $("hiddenChip");

    chip.innerHTML = "<b>Hidden:</b>&nbsp;" + hid.map(function (id) {

    $("jump").innerHTML = "<span>Jump to</span>" + vis.map(function (m) { return '<button type="button" class="m' + m.ci + '" data-jump="' + m.id + '">' + esc(m.name) + "</button>"; }).join("");

  function layout() {

  function cellInfo(btn) {

  var choiceFor = null;
  function choiceOpts(col) {
    var opts = [{ label: col.voice ? "None" : "Not playing", code: "", on: [] }];
    col.members.forEach(function (id) { var p = part(id); opts.push({ label: col.voice ? voiceLabel(p) : p.name, code: p.short, on: [id], key: p.short.length === 1 ? p.short : "" }); });
    if (col.members.length > 1) opts.push({ label: col.members.length === 2 ? "Both" : "All of them", code: col.members.map(function (id) { return part(id).short; }).join("+"), on: col.members.slice() });
    return opts;
  }
  function choiceIndex(opts, cur) {
    for (var k = 0; k < opts.length; k++) if (opts[k].on.length === cur.length && opts[k].on.every(function (id) { return cur.indexOf(id) >= 0; })) return k;
    return 0;

  function stepChoice(i, m, col, d) {
    var opts = choiceOpts(col), k = choiceIndex(opts, playing(i, m.id, col.members));
    setPlaying(i, m.id, col.members, opts[(k + d + opts.length) % opts.length].on);
  }
  function openChoice(btn, ctx) {
    var x = ctx || cellInfo(btn), cur = playing(x.i, x.m.id, x.col.members), opts = choiceOpts(x.col);

    var h = '<p class="choice-title">' + esc(x.m.name) + " · " + esc(x.col.voice ? "Voice" : x.col.full.split(":")[0]) + "</p>";
    opts.forEach(function (o, k) {
      var checked = o.on.length === cur.length && o.on.every(function (id) { return cur.indexOf(id) >= 0; });
      h += '<button type="button" role="menuitemradio" aria-checked="' + checked + '" data-opt="' + k + '"><span class="code' + (o.code ? "" : " none") + '">' + (o.code ? esc(o.code) : "—") + "</span>" + esc(o.label) + (o.key && !coarse.matches ? "<kbd>" + o.key + "</kbd>" : "") + "</button>";
    });

    choiceFor = { btn: btn, x: x, opts: opts, after: x.after };
    var r = btn.getBoundingClientRect(), w = choice.offsetWidth, ch = choice.offsetHeight;

    if (!s) return;
    var p = part(s.dataset.track);
    if (s.value === "__new") { st.trackFor = p.id; fillParts(); $("ntName").focus(); return; }
    p.track = s.value || undefined; fillParts(); render();
  });
  $("partsBody").addEventListener("submit", function (e) {
    e.preventDefault();
    var f = e.target;
    if (f.id === "newPartForm") {
      var name = $("npName").value.trim();
      if (!name) { $("npName").focus(); return; }
      parts.push({ id: "n" + nextId++, name: name, short: $("npShort").value.trim() || abbreviate(name), kind: $("npKind").value, shared: $("npShared").checked });
      fillParts(); render(); $("npName").focus();
    } else if (f.dataset.newtrack) {
      var tn = $("ntName").value.trim();
      if (!tn) { $("ntName").focus(); return; }
      var t = { id: "t" + nextId++, name: tn, short: tn.length <= 5 ? tn : tn.slice(0, 4) };
      tracks.push(t); part(f.dataset.newtrack).track = t.id; st.trackFor = null; fillParts(); render();
    } else if (f.dataset.renametrack) {
      var tr = find(tracks, f.dataset.renametrack), nn = $("rtName").value.trim();
      if (nn) { tr.name = nn; tr.short = nn.length <= 5 ? nn : nn.slice(0, 4); }
      st.renameTrack = null; fillParts(); render();
    }
  });
  $("partsBody").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.pmv) {
      var d = b.dataset.pmv.split("|"), k = parts.indexOf(part(d[0])), j = k + +d[1];
      if (j < 0 || j >= parts.length) return;
      var tmp = parts[k]; parts[k] = parts[j]; parts[j] = tmp;
      fillParts(); render();
      var again = $("partsBody").querySelector('[data-pmv="' + b.dataset.pmv + '"]'); if (again && !again.disabled) again.focus();
    } else if (b.hasAttribute("data-canceltrack")) { st.trackFor = null; fillParts(); }
    else if (b.dataset.rename) { st.renameTrack = b.dataset.rename; fillParts(); $("rtName").focus(); }
    else if (b.dataset.deltrack) { st.delTrack = b.dataset.deltrack; fillParts(); }
    else if (b.hasAttribute("data-deltrackno")) { st.delTrack = null; fillParts(); }
    else if (b.dataset.deltrackyes) {
      var id = b.dataset.deltrackyes;
      parts.forEach(function (p) { if (p.track === id) p.track = undefined; });
      tracks = tracks.filter(function (t) { return t.id !== id; }); st.delTrack = null; fillParts(); render();
    }
  });

  render();
})();
</script>
</body></html>
